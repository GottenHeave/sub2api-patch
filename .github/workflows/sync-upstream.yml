name: Sync upstream

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      release_after_validation:
        description: Publish after validation succeeds
        required: true
        default: true
        type: boolean

permissions: {}

concurrency:
  group: sub2api-release-mutation
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  UPSTREAM_REPOSITORY: Wei-Shaw/sub2api
  UPSTREAM_GIT_URL: https://github.com/Wei-Shaw/sub2api.git

jobs:
  resolve:
    permissions:
      checks: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      patchset_sha: ${{ steps.resolve.outputs.patchset_sha }}
      upstream_source_sha: ${{ steps.resolve.outputs.upstream_source_sha }}
      expected_main_sha: ${{ steps.resolve.outputs.expected_main_sha }}
      expected_mirror_sha: ${{ steps.resolve.outputs.expected_mirror_sha }}
      expected_patched_sha: ${{ steps.resolve.outputs.expected_patched_sha }}
      release_after_validation: ${{ steps.resolve.outputs.release_after_validation }}
    steps:
      - name: Checkout current patchset
        uses: actions/checkout@v7.0.0
        with:
          ref: patchset
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve current CI-ready upstream
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE: ${{ inputs.release_after_validation }}
        run: |
          set -euo pipefail
          [ "$UPSTREAM_REPOSITORY" = Wei-Shaw/sub2api ]
          git init upstream
          git -C upstream remote add upstream "$UPSTREAM_GIT_URL"
          git -C upstream fetch --no-tags upstream "+refs/heads/main:refs/remotes/upstream/main"
          upstream_head="$(git -C upstream rev-parse refs/remotes/upstream/main^{commit})"
          upstream_source_sha="$(scripts/upstream-ci-ready.sh "$UPSTREAM_REPOSITORY" "$upstream_head")"

          downstream_url="https://github.com/${GITHUB_REPOSITORY}.git"
          expected_main_sha="$(git ls-remote "$downstream_url" refs/heads/main | awk '{print $1}')"
          expected_mirror_sha="$(git ls-remote "$downstream_url" refs/heads/mirror/upstream-main | awk '{print $1}')"
          expected_patched_sha="$(git ls-remote "$downstream_url" refs/heads/patched | awk '{print $1}')"
          [ -n "$expected_main_sha" ] || {
            echo "downstream main does not exist" >&2
            exit 1
          }

          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            release_after_validation=true
          else
            release_after_validation="${REQUESTED_RELEASE:-true}"
          fi

          echo "patchset_sha=$(git rev-parse HEAD^{commit})" >> "$GITHUB_OUTPUT"
          echo "upstream_source_sha=$upstream_source_sha" >> "$GITHUB_OUTPUT"
          echo "expected_main_sha=$expected_main_sha" >> "$GITHUB_OUTPUT"
          echo "expected_mirror_sha=$expected_mirror_sha" >> "$GITHUB_OUTPUT"
          echo "expected_patched_sha=$expected_patched_sha" >> "$GITHUB_OUTPUT"
          echo "release_after_validation=$release_after_validation" >> "$GITHUB_OUTPUT"

  validate:
    needs: resolve
    permissions:
      checks: read
      contents: read
    uses: ./.github/workflows/upstream-pr-check.yml
    with:
      invocation_mode: sync
      patchset_sha: ${{ needs.resolve.outputs.patchset_sha }}
      upstream_source_sha: ${{ needs.resolve.outputs.upstream_source_sha }}

  release:
    needs:
      - resolve
      - validate
    if: ${{ needs.validate.result == 'success' && needs.resolve.outputs.release_after_validation == 'true' }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/auto-release.yml
    with:
      patchset_sha: ${{ needs.resolve.outputs.patchset_sha }}
      upstream_source_sha: ${{ needs.resolve.outputs.upstream_source_sha }}
      expected_main_sha: ${{ needs.resolve.outputs.expected_main_sha }}
      expected_mirror_sha: ${{ needs.resolve.outputs.expected_mirror_sha }}
      expected_patched_sha: ${{ needs.resolve.outputs.expected_patched_sha }}

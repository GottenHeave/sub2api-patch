name: Auto release

on:
  workflow_call:
    inputs:
      patchset_sha:
        required: true
        type: string
      upstream_source_sha:
        required: true
        type: string
      expected_main_sha:
        required: true
        type: string
      expected_mirror_sha:
        required: false
        default: ""
        type: string
      expected_patched_sha:
        required: false
        default: ""
        type: string

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  UPSTREAM_REPOSITORY: Wei-Shaw/sub2api
  UPSTREAM_GIT_URL: https://github.com/Wei-Shaw/sub2api.git

jobs:
  release:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated patchset
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ inputs.patchset_sha }}
          path: sub2api-patch
          fetch-depth: 0
          persist-credentials: false

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/sub2api-patch" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Prepare mirror and patched commits
        id: prepare
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          EXPECTED_MIRROR_SHA: ${{ inputs.expected_mirror_sha }}
          EXPECTED_PATCHED_SHA: ${{ inputs.expected_patched_sha }}
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.name }}
          UPSTREAM_SOURCE_SHA: ${{ inputs.upstream_source_sha }}
        run: |
          set -euo pipefail
          [ "$UPSTREAM_REPOSITORY" = Wei-Shaw/sub2api ]
          git init worktree
          git -C worktree remote add upstream "$UPSTREAM_GIT_URL"
          git -C worktree remote add downstream "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C worktree fetch --no-tags upstream "+refs/heads/main:refs/remotes/upstream/main"
          git -C worktree fetch --no-tags upstream 'refs/tags/v*:refs/upstream-tags/v*'
          git -C worktree fetch --tags downstream "$EXPECTED_MAIN_SHA"
          if [ -n "$EXPECTED_MIRROR_SHA" ]; then
            git -C worktree fetch --no-tags downstream "$EXPECTED_MIRROR_SHA"
          fi
          if [ -n "$EXPECTED_PATCHED_SHA" ]; then
            git -C worktree fetch --no-tags downstream "$EXPECTED_PATCHED_SHA"
          fi

          previous_version=""
          if [ -n "$EXPECTED_PATCHED_SHA" ]; then
            previous_version="$(git -C worktree tag --points-at "$EXPECTED_PATCHED_SHA" --list 'v*-patch.*' --sort=-v:refname | sed -n '1p')"
          fi
          if [ -n "$previous_version" ]; then
            state="$(bash sub2api-patch/scripts/release-publication-state.sh "$IMAGE" "$previous_version")"
            read -r image_exists release_exists <<< "$state"
            if [ "$image_exists" = false ] || [ "$release_exists" = false ]; then
              git -C worktree checkout --detach "$previous_version"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "resume=true" >> "$GITHUB_OUTPUT"
              echo "publish_image=$([ "$image_exists" = false ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
              echo "publish_release=$([ "$release_exists" = false ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
              echo "patched_commit=$EXPECTED_PATCHED_SHA" >> "$GITHUB_OUTPUT"
              echo "version=$previous_version" >> "$GITHUB_OUTPUT"
              echo "upstream_source_sha=$(git -C worktree merge-base "$UPSTREAM_SOURCE_SHA" "$EXPECTED_PATCHED_SHA")" >> "$GITHUB_OUTPUT"
              echo "Recovering missing publication outputs for $previous_version; selected content will be evaluated on the next sync."
              exit 0
            fi
          fi
          git -C worktree checkout --detach "$UPSTREAM_SOURCE_SHA"
          git -C worktree config user.name "sub2api-patch automation"
          git -C worktree config user.email "actions@users.noreply.github.com"

          rm -rf worktree/.github/workflows
          mkdir -p worktree/.github/workflows
          cp sub2api-patch/.github/workflows/upstream-pr-check.yml worktree/.github/workflows/upstream-pr-check.yml
          git -C worktree add -A .github/workflows
          git -C worktree commit -m "Install downstream validation workflow on mirror branch"
          workflow_commit="$(git -C worktree rev-parse HEAD^{commit})"
          mirror_commit="$(printf '%s\n' 'Promote validated upstream' | git -C worktree commit-tree HEAD^{tree} -p "$EXPECTED_MAIN_SHA" -p "$workflow_commit")"

          git -C worktree checkout --detach "$UPSTREAM_SOURCE_SHA"
          EXPECTED_BASE_SHA="$UPSTREAM_SOURCE_SHA" sub2api-patch/scripts/apply-patches.sh worktree
          rm -rf worktree/.github/workflows
          git -C worktree add -A .github/workflows
          if ! git -C worktree diff --cached --quiet; then
            git -C worktree commit -m "Remove upstream workflows from patched branch"
          fi
          patched_commit="$(git -C worktree rev-parse HEAD^{commit})"

          mirror_tree="$(git -C worktree rev-parse "$mirror_commit^{tree}")"
          current_main_tree="$(git -C worktree rev-parse "$EXPECTED_MAIN_SHA^{tree}")"
          current_mirror_tree=""
          if [ -n "$EXPECTED_MIRROR_SHA" ]; then
            current_mirror_tree="$(git -C worktree rev-parse "$EXPECTED_MIRROR_SHA^{tree}")"
          fi
          if [ -n "$EXPECTED_PATCHED_SHA" ]; then
            current_patched_tree="$(git -C worktree rev-parse "$EXPECTED_PATCHED_SHA^{tree}")"
          else
            current_patched_tree=""
          fi
          patched_tree="$(git -C worktree rev-parse "$patched_commit^{tree}")"
          upstream_tag="$(git -C worktree for-each-ref --points-at "$UPSTREAM_SOURCE_SHA" --format='%(refname:strip=2)' refs/upstream-tags | sed -nE '/^v[0-9]+\.[0-9]+\.[0-9]+$/p' | sort -V | tail -1)"
          upstream_version="${upstream_tag#v}"
          upstream_version="${upstream_version:-$(tr -d '[:space:]' < worktree/backend/cmd/server/VERSION)}"
          if [[ "$previous_version" == "v${upstream_version}-patch."* ]] && [ "$mirror_tree" = "$current_main_tree" ] && \
            [ "$mirror_tree" = "$current_mirror_tree" ] && [ "$patched_tree" = "$current_patched_tree" ]; then
            echo "Published branches already have the selected upstream and patchset content."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="$(UPSTREAM_VERSION="$upstream_version" RELEASE_REPOSITORY="$GITHUB_REPOSITORY" sub2api-patch/scripts/compute-next-version.sh worktree)"
          git -C worktree tag "$version" "$patched_commit"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "resume=false" >> "$GITHUB_OUTPUT"
          echo "publish_image=true" >> "$GITHUB_OUTPUT"
          echo "publish_release=true" >> "$GITHUB_OUTPUT"
          echo "mirror_commit=$mirror_commit" >> "$GITHUB_OUTPUT"
          echo "patched_commit=$patched_commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "upstream_source_sha=$UPSTREAM_SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        if: steps.prepare.outputs.changed == 'true'
        env:
          PATCHED_COMMIT: ${{ steps.prepare.outputs.patched_commit }}
          UPSTREAM_SOURCE_SHA: ${{ steps.prepare.outputs.upstream_source_sha }}
          RESUME: ${{ steps.prepare.outputs.resume }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          upstream_version="$(tr -d '[:space:]' < worktree/backend/cmd/server/VERSION)"
          patchset_commit="$(git -C sub2api-patch rev-parse --short=12 HEAD)"
          upstream_short="$(git -C worktree rev-parse --short=12 "$UPSTREAM_SOURCE_SHA")"
          {
            echo "$VERSION"
            echo
            echo "Base:"
            upstream_tag="$(git -C worktree for-each-ref --points-at "$UPSTREAM_SOURCE_SHA" --format='%(refname:strip=2)' refs/upstream-tags | sed -nE '/^v[0-9]+\.[0-9]+\.[0-9]+$/p' | sort -V | tail -1)"
            if [ -n "$upstream_tag" ]; then
              echo "- upstream tag: ${upstream_tag}"
            fi
            echo "- upstream VERSION: ${upstream_version}"
            echo "- upstream commit: ${upstream_short}"
            echo "- source revision: ${PATCHED_COMMIT}"
            if [ "$RESUME" != true ]; then
              echo "- patchset commit: ${patchset_commit}"
            fi
            echo
            echo "Patch topics:"
            git -C worktree log --reverse --format='- %s' "$UPSTREAM_SOURCE_SHA..$PATCHED_COMMIT" | grep -v '^- Remove upstream workflows'
          } > release-notes.md
          if grep -E '#[0-9]+|/issues/[0-9]+|/pull/[0-9]+' release-notes.md; then
            echo "blocked reference found in release notes" >&2
            exit 1
          fi

      - name: Reject publication collisions
        if: steps.prepare.outputs.changed == 'true' && steps.prepare.outputs.resume != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if git -C worktree ls-remote --exit-code downstream "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "version tag already exists: $VERSION" >&2
            exit 1
          else
            result=$?
            [ "$result" -eq 2 ] || exit "$result"
          fi

          state="$(bash sub2api-patch/scripts/release-publication-state.sh "$IMAGE" "$VERSION")"
          read -r image_exists release_exists <<< "$state"
          if [ "$release_exists" = true ]; then
            echo "GitHub release already exists: $VERSION" >&2
            exit 1
          fi
          if [ "$image_exists" = true ]; then
            echo "versioned image tag already exists: $IMAGE:$VERSION" >&2
            exit 1
          fi

      - name: Publish branches and reserve version tag
        if: steps.prepare.outputs.changed == 'true' && steps.prepare.outputs.resume != 'true'
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          EXPECTED_MIRROR_SHA: ${{ inputs.expected_mirror_sha }}
          EXPECTED_PATCHED_SHA: ${{ inputs.expected_patched_sha }}
          MIRROR_COMMIT: ${{ steps.prepare.outputs.mirror_commit }}
          PATCHED_COMMIT: ${{ steps.prepare.outputs.patched_commit }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          push_url="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git -C worktree push --atomic "$push_url" \
            --force-with-lease="refs/heads/main:$EXPECTED_MAIN_SHA" \
            --force-with-lease="refs/heads/mirror/upstream-main:$EXPECTED_MIRROR_SHA" \
            --force-with-lease="refs/heads/patched:$EXPECTED_PATCHED_SHA" \
            "$MIRROR_COMMIT:refs/heads/main" \
            "$MIRROR_COMMIT:refs/heads/mirror/upstream-main" \
            "$PATCHED_COMMIT:refs/heads/patched" \
            "refs/tags/$VERSION:refs/tags/$VERSION"

      - name: Build and publish release image
        if: steps.prepare.outputs.publish_image == 'true'
        uses: docker/build-push-action@v7.3.0
        with:
          context: worktree
          file: worktree/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.prepare.outputs.version }}
            ${{ steps.image.outputs.name }}:latest-patch
          labels: |
            org.opencontainers.image.version=${{ steps.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ steps.prepare.outputs.patched_commit }}
          cache-from: type=gha,scope=sub2api-patch-release
          cache-to: type=gha,mode=max,scope=sub2api-patch-release

      - name: Restore latest image tag during recovery
        if: steps.prepare.outputs.resume == 'true' && steps.prepare.outputs.publish_image != 'true'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: docker buildx imagetools create --tag "$IMAGE:latest-patch" "$IMAGE:$VERSION"

      - name: Create GitHub release
        if: steps.prepare.outputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --title "$VERSION" --notes-file release-notes.md

      - name: Report recovered release
        if: steps.prepare.outputs.resume == 'true'
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          echo "Recovered missing publication outputs for $VERSION." >> "$GITHUB_STEP_SUMMARY"
          echo "Selected upstream ${{ inputs.upstream_source_sha }} and patchset ${{ inputs.patchset_sha }} will be evaluated on the next sync." >> "$GITHUB_STEP_SUMMARY"

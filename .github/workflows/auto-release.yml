name: Auto release

on:
  workflow_call:
    inputs:
      invocation_mode:
        required: true
        type: string
      release_after_validation:
        required: true
        type: boolean
      patchset_sha:
        required: true
        type: string
      upstream_source_sha:
        required: true
        type: string
      mirror_candidate_sha:
        required: true
        type: string
      replay_tree_sha:
        required: true
        type: string
      validation_conclusion:
        required: true
        type: string
      originating_repository:
        required: true
        type: string
      originating_workflow_path:
        required: true
        type: string
      originating_run_id:
        required: true
        type: string
      originating_run_attempt:
        required: true
        type: string
      candidate_artifact_name:
        required: true
        type: string
      candidate_artifact_id:
        required: true
        type: string
      candidate_artifact_digest:
        required: true
        type: string
      expected_main_sha:
        required: true
        type: string
      expected_mirror_sha:
        required: false
        default: ""
        type: string
      expected_patched_sha:
        required: false
        default: ""
        type: string
      recovery_release_artifact_name:
        required: false
        default: ""
        type: string
      recovery_release_artifact_id:
        required: false
        default: ""
        type: string
      recovery_release_artifact_digest:
        required: false
        default: ""
        type: string
      recovery_image_artifact_name:
        required: false
        default: ""
        type: string
      recovery_image_artifact_id:
        required: false
        default: ""
        type: string
      recovery_image_artifact_digest:
        required: false
        default: ""
        type: string

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  UPSTREAM_REPOSITORY: Wei-Shaw/sub2api
  UPSTREAM_GIT_URL: https://github.com/Wei-Shaw/sub2api.git
  PATCHED_BRANCH: patched
  OCI_CLOSURE_VERIFIER: |
    import hashlib
    import json
    import os
    import pathlib
    import re
    import shutil
    import sys
    import tarfile

    (archive_path, layout_path, output_path, version, revision, replay_tree,
     publication_tree, patchset_sha, upstream_source_sha, mirror_candidate_sha,
     publication_commit_sha) = sys.argv[1:]
    layout = pathlib.Path(layout_path)
    if layout.exists():
        raise SystemExit("layout destination already exists")
    layout.mkdir()

    allowed_file = re.compile(r"(?:oci-layout|index[.]json|blobs/sha256/[0-9a-f]{64})$")
    allowed_dir = re.compile(r"(?:blobs|blobs/sha256)/?$")
    seen_paths = set()
    with tarfile.open(archive_path, "r:*") as archive:
        for member in archive.getmembers():
            name = member.name
            while name.startswith("./"):
                name = name[2:]
            if not name or name.startswith("/") or any(part == ".." for part in pathlib.PurePosixPath(name).parts):
                raise SystemExit(f"unsafe OCI archive path: {member.name!r}")
            if any(character.isspace() or ord(character) < 32 or ord(character) == 127 for character in name):
                raise SystemExit(f"invalid OCI archive path: {member.name!r}")
            normalized = name.rstrip("/")
            if normalized in seen_paths:
                raise SystemExit(f"duplicate OCI archive path: {normalized}")
            seen_paths.add(normalized)
            if member.isdir():
                if not allowed_dir.fullmatch(name):
                    raise SystemExit(f"unexpected OCI archive directory: {name}")
                (layout / normalized).mkdir(parents=True, exist_ok=True)
                continue
            if not member.isfile() or not allowed_file.fullmatch(name):
                raise SystemExit(f"unexpected OCI archive member: {name}")
            destination = layout / name
            destination.parent.mkdir(parents=True, exist_ok=True)
            source = archive.extractfile(member)
            if source is None:
                raise SystemExit(f"cannot read OCI archive member: {name}")
            with source, destination.open("xb") as target:
                shutil.copyfileobj(source, target, length=1024 * 1024)

    expected_root = {"blobs", "index.json", "oci-layout"}
    if {entry.name for entry in layout.iterdir()} != expected_root:
        raise SystemExit("OCI layout root entries differ from the schema")
    expected_directories = {layout / "blobs", layout / "blobs" / "sha256"}
    actual_directories = {entry for entry in layout.rglob("*") if entry.is_dir()}
    if actual_directories != expected_directories:
        raise SystemExit("OCI layout contains unexpected directories")
    if any(entry.is_symlink() or not entry.is_file() for entry in layout.rglob("*") if not entry.is_dir()):
        raise SystemExit("OCI layout contains a non-regular file")

    def bytes_and_digest(path):
        content = path.read_bytes()
        return content, hashlib.sha256(content).hexdigest(), len(content)

    def file_digest(path):
        digest = hashlib.sha256()
        size = 0
        with path.open("rb") as content:
            for chunk in iter(lambda: content.read(1024 * 1024), b""):
                digest.update(chunk)
                size += len(chunk)
        return digest.hexdigest(), size

    def unique_object(pairs):
        value = {}
        for key, item in pairs:
            if key in value:
                raise ValueError(f"duplicate JSON key: {key}")
            value[key] = item
        return value

    def parse_json(content):
        return json.loads(content, object_pairs_hook=unique_object)

    layout_bytes, layout_sha, layout_size = bytes_and_digest(layout / "oci-layout")
    if parse_json(layout_bytes) != {"imageLayoutVersion": "1.0.0"}:
        raise SystemExit("invalid oci-layout metadata")
    index_bytes, index_sha, index_size = bytes_and_digest(layout / "index.json")
    index = parse_json(index_bytes)
    if set(index) - {"schemaVersion", "mediaType", "manifests", "annotations"}:
        raise SystemExit("unsupported OCI index field")
    if index.get("schemaVersion") != 2 or not isinstance(index.get("manifests"), list) or len(index["manifests"]) != 1:
        raise SystemExit("OCI index must contain one root descriptor")
    if "mediaType" in index and index["mediaType"] != "application/vnd.oci.image.index.v1+json":
        raise SystemExit("OCI index media type is invalid")

    digest_pattern = re.compile(r"sha256:[0-9a-f]{64}$")
    index_media = "application/vnd.oci.image.index.v1+json"
    image_media = "application/vnd.oci.image.manifest.v1+json"
    artifact_media = "application/vnd.oci.artifact.manifest.v1+json"
    config_media = "application/vnd.oci.image.config.v1+json"
    descriptors = {}
    parsed = {}
    active = set()
    edges = []
    runtime_platforms = []
    runtime_roots = set()
    auxiliary_roots = []

    def descriptor(value):
        if not isinstance(value, dict):
            raise SystemExit("OCI descriptor is not an object")
        if set(value) - {"mediaType", "digest", "size", "annotations", "artifactType", "platform"}:
            raise SystemExit("unsupported OCI descriptor field")
        media_type = value.get("mediaType")
        digest = value.get("digest")
        size = value.get("size")
        if not isinstance(media_type, str) or not media_type or not digest_pattern.fullmatch(str(digest)):
            raise SystemExit("invalid OCI descriptor identity")
        if not isinstance(size, int) or isinstance(size, bool) or size < 0:
            raise SystemExit("invalid OCI descriptor size")
        if "urls" in value or "data" in value:
            raise SystemExit("external or inline OCI descriptor content is forbidden")
        canonical = json.loads(json.dumps(value, sort_keys=True, separators=(",", ":")))
        prior = descriptors.get(digest)
        if prior is not None and prior != canonical:
            raise SystemExit(f"conflicting descriptor for {digest}")
        descriptors[digest] = canonical
        return canonical

    def blob_for(desc):
        digest = desc["digest"]
        path = layout / "blobs" / "sha256" / digest.removeprefix("sha256:")
        if not path.is_file() or path.is_symlink():
            raise SystemExit(f"missing descriptor blob: {digest}")
        actual_digest, actual_size = file_digest(path)
        if actual_digest != digest.removeprefix("sha256:") or actual_size != desc["size"]:
            raise SystemExit(f"descriptor blob mismatch: {digest}")
        return path

    def add_edge(parent, relation, ordinal, value):
        child = descriptor(value)
        edges.append({"parent": parent, "relation": relation, "ordinal": ordinal, "descriptor": child})
        return child

    def parse_json_blob(desc):
        digest = desc["digest"]
        path = blob_for(desc)
        if digest not in parsed:
            try:
                parsed[digest] = parse_json(path.read_bytes())
            except (UnicodeDecodeError, json.JSONDecodeError) as error:
                raise SystemExit(f"invalid structured OCI blob {digest}: {error}")
        return parsed[digest]

    def walk(desc, root_role=None):
        digest = desc["digest"]
        if digest in active:
            raise SystemExit(f"OCI descriptor cycle at {digest}")
        media_type = desc["mediaType"]
        blob_for(desc)
        if digest in parsed:
            return
        if media_type not in {index_media, image_media, artifact_media}:
            if media_type == "application/json" or media_type.endswith("+json"):
                raise SystemExit(f"unsupported structured OCI media type: {media_type}")
            parsed[digest] = None
            return
        active.add(digest)
        document = parse_json_blob(desc)
        if not isinstance(document, dict) or document.get("schemaVersion") != 2:
            raise SystemExit(f"invalid OCI structured blob: {digest}")
        allowed_fields = {
            index_media: {"schemaVersion", "mediaType", "artifactType", "manifests", "subject", "annotations"},
            image_media: {"schemaVersion", "mediaType", "artifactType", "config", "layers", "subject", "annotations"},
            artifact_media: {"schemaVersion", "mediaType", "artifactType", "blobs", "subject", "annotations"},
        }[media_type]
        if set(document) - allowed_fields:
            raise SystemExit(f"unsupported field in structured OCI blob: {digest}")
        if "mediaType" in document and document["mediaType"] != media_type:
            raise SystemExit(f"descriptor and content media types differ: {digest}")
        if media_type == index_media:
            if "artifactType" in document:
                raise SystemExit("OCI image index cannot be an auxiliary artifact")
            manifests = document.get("manifests")
            if not isinstance(manifests, list) or not manifests:
                raise SystemExit("OCI image index has no manifests")
            manifest_digests = set()
            for ordinal, value in enumerate(manifests):
                child = add_edge(digest, "manifests", ordinal, value)
                if child["digest"] in manifest_digests:
                    raise SystemExit("duplicate OCI index descriptor")
                manifest_digests.add(child["digest"])
                platform = child.get("platform")
                if child["mediaType"] == index_media:
                    raise SystemExit("nested OCI image indexes are outside the fixed build policy")
                else:
                    role = ("runtime" if child["mediaType"] == image_media and
                            "artifactType" not in child and
                            isinstance(platform, dict) and platform.get("os") != "unknown"
                            else "auxiliary")
                if role == "runtime":
                    if child["digest"] in runtime_roots:
                        raise SystemExit("duplicate OCI runtime descriptor")
                    runtime_roots.add(child["digest"])
                if role == "auxiliary":
                    auxiliary_roots.append(child)
                walk(child, role)
            if "subject" in document:
                child = add_edge(digest, "subject", 0, document["subject"])
                auxiliary_roots.append(child)
                walk(child, "auxiliary")
        elif media_type == image_media:
            config = add_edge(digest, "config", 0, document.get("config"))
            layers = document.get("layers")
            if not isinstance(layers, list) or not layers:
                raise SystemExit("OCI image manifest has no layers")
            layer_descriptors = [add_edge(digest, "layers", ordinal, value) for ordinal, value in enumerate(layers)]
            if "artifactType" in config or "platform" in config:
                raise SystemExit("runtime config descriptor has artifact-only metadata")
            allowed_layer_media = {
                "application/vnd.oci.image.layer.v1.tar",
                "application/vnd.oci.image.layer.v1.tar+gzip",
                "application/vnd.oci.image.layer.v1.tar+zstd",
            }
            if any(value["mediaType"] not in allowed_layer_media or
                   "artifactType" in value or "platform" in value
                   for value in layer_descriptors):
                raise SystemExit("runtime image manifest contains an unsupported layer")
            config_document = parse_json_blob(config)
            walk(config)
            for child in layer_descriptors:
                walk(child)
            if "subject" in document:
                child = add_edge(digest, "subject", 0, document["subject"])
                auxiliary_roots.append(child)
                walk(child, "auxiliary")
            if root_role == "runtime":
                if "artifactType" in document or "subject" in document:
                    raise SystemExit("runtime manifest contains artifact-only fields")
                platform = desc.get("platform")
                if not isinstance(platform, dict):
                    raise SystemExit("runtime manifest lacks a platform")
                if config["mediaType"] != config_media or not isinstance(config_document, dict):
                    raise SystemExit("runtime image config has an invalid media type")
                if config_document.get("os") != platform.get("os") or config_document.get("architecture") != platform.get("architecture"):
                    raise SystemExit("runtime config platform differs from its descriptor")
                labels = config_document.get("config", {}).get("Labels", {})
                if labels.get("org.opencontainers.image.version") != version or labels.get("org.opencontainers.image.revision") != revision:
                    raise SystemExit("runtime image labels differ from release authority")
                runtime_platforms.append({
                    "os": platform.get("os"),
                    "architecture": platform.get("architecture"),
                    "variant": platform.get("variant"),
                    "manifest": desc,
                    "config": config,
                    "layers": layer_descriptors,
                })
        else:
            blobs = document.get("blobs")
            if not isinstance(blobs, list):
                raise SystemExit("OCI artifact manifest has invalid blobs")
            for ordinal, value in enumerate(blobs):
                walk(add_edge(digest, "blobs", ordinal, value))
            if "subject" in document:
                walk(add_edge(digest, "subject", 0, document["subject"]), "auxiliary")
        active.remove(digest)

    root = add_edge("index.json", "manifests", 0, index["manifests"][0])
    root_platform = root.get("platform")
    if root["mediaType"] == index_media:
        if "platform" in root or "artifactType" in root:
            raise SystemExit("root OCI index descriptor has auxiliary metadata")
        root_role = None
    else:
        root_role = ("runtime" if root["mediaType"] == image_media and
                     "artifactType" not in root and
                     isinstance(root_platform, dict) and root_platform.get("os") != "unknown"
                     else "auxiliary")
    if root_role == "runtime":
        runtime_roots.add(root["digest"])
    if root_role == "auxiliary":
        auxiliary_roots.append(root)
    walk(root, root_role)
    actual_blobs = {entry.name for entry in (layout / "blobs" / "sha256").iterdir() if entry.is_file()}
    expected_blobs = {digest.removeprefix("sha256:") for digest in descriptors}
    if actual_blobs != expected_blobs:
        raise SystemExit("OCI layout contains missing or unreferenced blobs")
    if len(runtime_platforms) != 1:
        raise SystemExit("OCI layout must contain exactly one runtime platform")
    if len(runtime_roots) != len(runtime_platforms):
        raise SystemExit("OCI runtime descriptor traversal is incomplete")
    runtime = runtime_platforms[0]
    if runtime["os"] != "linux" or runtime["architecture"] != "amd64" or runtime["variant"] not in (None, ""):
        raise SystemExit("OCI runtime platform must be exactly linux/amd64")
    if auxiliary_roots:
        raise SystemExit("provenance=false and sbom=false forbid auxiliary descriptors")

    archive_sha, archive_size = file_digest(pathlib.Path(archive_path))
    closure = {
        "schemaVersion": 1,
        "binding": {
            "patchsetSha": patchset_sha,
            "upstreamSourceSha": upstream_source_sha,
            "mirrorCandidateSha": mirror_candidate_sha,
            "replayCommitSha": revision,
            "replayTreeSha": replay_tree,
            "publicationCommitSha": publication_commit_sha,
            "publicationTreeSha": publication_tree,
            "version": version,
            "labels": {
                "org.opencontainers.image.version": version,
                "org.opencontainers.image.revision": revision,
            },
        },
        "buildPolicy": {"runtimePlatforms": ["linux/amd64"], "provenance": False, "sbom": False},
        "layout": {
            "archive": {"sha256": archive_sha, "size": archive_size},
            "ociLayout": {"sha256": layout_sha, "size": layout_size},
            "index": {"sha256": index_sha, "size": index_size},
        },
        "root": root,
        "runtimePlatforms": sorted(runtime_platforms, key=lambda value: (value["os"], value["architecture"], value["variant"] or "")),
        "auxiliaryRoots": [],
        "edges": sorted(edges, key=lambda value: (value["parent"], value["relation"], value["ordinal"], value["descriptor"]["digest"], value["descriptor"]["mediaType"])),
        "blobs": sorted(({"digest": digest, "size": value["size"]} for digest, value in descriptors.items()), key=lambda value: value["digest"]),
    }
    pathlib.Path(output_path).write_text(json.dumps(closure, sort_keys=True, separators=(",", ":")) + "\n")

jobs:
  prepare-release:
    permissions:
      actions: read
      contents: read
      checks: read
    runs-on: ubuntu-latest
    outputs:
      patchset_sha: ${{ inputs.patchset_sha }}
      upstream_source_sha: ${{ inputs.upstream_source_sha }}
      mirror_candidate_sha: ${{ inputs.mirror_candidate_sha }}
      replay_tree_sha: ${{ inputs.replay_tree_sha }}
      expected_main_sha: ${{ inputs.expected_main_sha }}
      expected_mirror_sha: ${{ inputs.expected_mirror_sha }}
      expected_patched_sha: ${{ inputs.expected_patched_sha }}
      validation_conclusion: ${{ inputs.validation_conclusion }}
      originating_repository: ${{ inputs.originating_repository }}
      originating_workflow_path: ${{ inputs.originating_workflow_path }}
      originating_run_id: ${{ inputs.originating_run_id }}
      originating_run_attempt: ${{ steps.recover_release.outputs.originating_run_attempt || inputs.originating_run_attempt }}
      version: ${{ steps.release.outputs.version || steps.recover_release.outputs.version }}
      replay_commit_sha: ${{ steps.release.outputs.replay_commit_sha || steps.recover_release.outputs.replay_commit_sha }}
      publication_commit_sha: ${{ steps.release.outputs.publication_commit_sha || steps.recover_release.outputs.publication_commit_sha }}
      publication_tree_sha: ${{ steps.release.outputs.publication_tree_sha || steps.recover_release.outputs.publication_tree_sha }}
      image_owner: ${{ steps.release.outputs.image_owner || steps.recover_release.outputs.image_owner }}
      version_image_tag: ${{ steps.release.outputs.version_image_tag || steps.recover_release.outputs.version_image_tag }}
      latest_image_tag: ${{ steps.release.outputs.latest_image_tag || steps.recover_release.outputs.latest_image_tag }}
      version_label: ${{ steps.release.outputs.version_label || steps.recover_release.outputs.version_label }}
      revision_label: ${{ steps.release.outputs.revision_label || steps.recover_release.outputs.revision_label }}
      docker_context_commit_sha: ${{ steps.release.outputs.docker_context_commit_sha || steps.recover_release.outputs.docker_context_commit_sha }}
      docker_context_tree_sha: ${{ steps.release.outputs.docker_context_tree_sha || steps.recover_release.outputs.docker_context_tree_sha }}
      dockerfile_path: ${{ steps.release.outputs.dockerfile_path || steps.recover_release.outputs.dockerfile_path }}
      cache_from: ${{ steps.release.outputs.cache_from || steps.recover_release.outputs.cache_from }}
      cache_to: ${{ steps.release.outputs.cache_to || steps.recover_release.outputs.cache_to }}
      release_notes_sha256: ${{ steps.release.outputs.release_notes_sha256 || steps.recover_release.outputs.release_notes_sha256 }}
      content_manifest_sha256: ${{ steps.release.outputs.content_manifest_sha256 || steps.recover_release.outputs.content_manifest_sha256 }}
      manifest_sha256: ${{ steps.release.outputs.manifest_sha256 || steps.recover_release.outputs.manifest_sha256 }}
      release_artifact_name: ${{ steps.release.outputs.release_artifact_name || steps.recovery.outputs.release_artifact_name }}
      release_artifact_id: ${{ steps.upload_release.outputs.artifact-id || steps.recovery.outputs.release_artifact_id }}
      release_artifact_digest: ${{ steps.upload_release.outputs.artifact-digest || steps.recovery.outputs.release_artifact_digest }}
      recovered_image_digest: ${{ steps.recover_release.outputs.recovered_image_digest }}
      recovery_image_artifact_name: ${{ steps.recovery.outputs.image_artifact_name }}
      recovery_image_artifact_id: ${{ steps.recovery.outputs.image_artifact_id }}
      recovery_image_artifact_digest: ${{ steps.recovery.outputs.image_artifact_digest }}
      artifact_producer_attempt: ${{ steps.release.outputs.artifact_producer_attempt || steps.recover_release.outputs.artifact_producer_attempt }}
    steps:
      - name: Assert trusted Sync caller and provenance shape
        env:
          INVOCATION_MODE: ${{ inputs.invocation_mode }}
          RELEASE_AFTER_VALIDATION: ${{ inputs.release_after_validation }}
          VALIDATION_CONCLUSION: ${{ inputs.validation_conclusion }}
          PATCHSET_SHA: ${{ inputs.patchset_sha }}
          UPSTREAM_SOURCE_SHA: ${{ inputs.upstream_source_sha }}
          MIRROR_CANDIDATE_SHA: ${{ inputs.mirror_candidate_sha }}
          REPLAY_TREE_SHA: ${{ inputs.replay_tree_sha }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          EXPECTED_MIRROR_SHA: ${{ inputs.expected_mirror_sha }}
          EXPECTED_PATCHED_SHA: ${{ inputs.expected_patched_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          ORIGINATING_REPOSITORY: ${{ inputs.originating_repository }}
          ORIGINATING_WORKFLOW_PATH: ${{ inputs.originating_workflow_path }}
          ORIGINATING_RUN_ID: ${{ inputs.originating_run_id }}
          ORIGINATING_RUN_ATTEMPT: ${{ inputs.originating_run_attempt }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
          RECOVERY_RELEASE_ARTIFACT_ID: ${{ inputs.recovery_release_artifact_id }}
          RECOVERY_RELEASE_ARTIFACT_DIGEST: ${{ inputs.recovery_release_artifact_digest }}
        run: |
          set -euo pipefail
          [ "$INVOCATION_MODE" = sync ] || exit 1
          [ "$RELEASE_AFTER_VALIDATION" = true ] || exit 1
          [ "$VALIDATION_CONCLUSION" = success ] || exit 1
          [ "$GITHUB_WORKFLOW" = "Sync upstream" ] || exit 1
          case "$WORKFLOW_REF" in
            "${GITHUB_REPOSITORY}/.github/workflows/sync-upstream.yml@"*) ;;
            *) echo "unexpected caller workflow ref: $WORKFLOW_REF" >&2; exit 1 ;;
          esac
          case "$GITHUB_EVENT_NAME" in schedule|workflow_dispatch) ;; *) exit 1 ;; esac
          [ "$ORIGINATING_REPOSITORY" = "$GITHUB_REPOSITORY" ] || exit 1
          [ "$ORIGINATING_WORKFLOW_PATH" = .github/workflows/sync-upstream.yml ] || exit 1
          [ "$ORIGINATING_RUN_ID" = "$GITHUB_RUN_ID" ] || exit 1
          [[ "$ORIGINATING_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || exit 1
          [ "$ORIGINATING_RUN_ATTEMPT" -le "$GITHUB_RUN_ATTEMPT" ] || exit 1
          [ "$PATCHSET_SHA" = "$GITHUB_SHA" ] || exit 1
          full_sha='^[0-9a-f]{40}$'
          for sha in "$PATCHSET_SHA" "$UPSTREAM_SOURCE_SHA" "$MIRROR_CANDIDATE_SHA" \
            "$REPLAY_TREE_SHA" "$EXPECTED_MAIN_SHA"; do
            [[ "$sha" =~ $full_sha ]] || exit 1
          done
          for optional_sha in "$EXPECTED_MIRROR_SHA" "$EXPECTED_PATCHED_SHA"; do
            [ -z "$optional_sha" ] || [[ "$optional_sha" =~ $full_sha ]] || exit 1
          done
          [[ "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$CANDIDATE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          if [ "$GITHUB_RUN_ATTEMPT" -eq 1 ]; then
            [ -z "$RECOVERY_RELEASE_ARTIFACT_ID" ] || exit 1
            [ -z "$RECOVERY_RELEASE_ARTIFACT_DIGEST" ] || exit 1
          else
            if [ -n "$RECOVERY_RELEASE_ARTIFACT_ID" ] || \
              [ -n "$RECOVERY_RELEASE_ARTIFACT_DIGEST" ]; then
              [[ "$RECOVERY_RELEASE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
              [[ "$RECOVERY_RELEASE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
            fi
          fi

      - name: Resolve exact rerun publication artifacts
        id: recovery
        if: ${{ github.run_attempt > 1 }}
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
          SUPPLIED_RELEASE_NAME: ${{ inputs.recovery_release_artifact_name }}
          SUPPLIED_RELEASE_ID: ${{ inputs.recovery_release_artifact_id }}
          SUPPLIED_RELEASE_DIGEST: ${{ inputs.recovery_release_artifact_digest }}
          SUPPLIED_IMAGE_NAME: ${{ inputs.recovery_image_artifact_name }}
          SUPPLIED_IMAGE_ID: ${{ inputs.recovery_image_artifact_id }}
          SUPPLIED_IMAGE_DIGEST: ${{ inputs.recovery_image_artifact_digest }}
        run: |
          set -euo pipefail
          suffix="${CANDIDATE_ARTIFACT_NAME#sync-candidate-bundle-}"
          producer_run="${suffix%-*}"
          producer_attempt="${suffix##*-}"
          [ "$CANDIDATE_ARTIFACT_NAME" = \
            "sync-candidate-bundle-${producer_run}-${producer_attempt}" ] || exit 1
          [ "$producer_run" = "$GITHUB_RUN_ID" ] || exit 1
          [[ "$producer_attempt" =~ ^[1-9][0-9]*$ ]] || exit 1
          [ "$producer_attempt" -lt "$GITHUB_RUN_ATTEMPT" ] || exit 1
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            > recovery-artifact-pages.json
          jq '[.[].artifacts[]]' recovery-artifact-pages.json > recovery-artifacts.json

          select_exact() {
            name="$1"
            prefix="$2"
            supplied_name="$3"
            supplied_id="$4"
            supplied_digest="$5"
            count="$(jq --arg name "$name" \
              '[.[] | select(.name == $name and .expired == false)] | length' \
              recovery-artifacts.json)"
            [ "$count" -eq 1 ] || {
              echo "expected one unexpired artifact named $name, found $count" >&2
              exit 1
            }
            id="$(jq -er --arg name "$name" \
              '.[] | select(.name == $name and .expired == false) | .id' \
              recovery-artifacts.json)"
            digest="$(jq -er --arg name "$name" \
              '.[] | select(.name == $name and .expired == false) | .digest' \
              recovery-artifacts.json)"
            [[ "$id" =~ ^[1-9][0-9]*$ ]] || exit 1
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
            if [ -n "$supplied_name" ] || [ -n "$supplied_id" ] || [ -n "$supplied_digest" ]; then
              [ "$supplied_name" = "$name" ] || exit 1
              [ "$supplied_id" = "$id" ] || exit 1
              [ "$supplied_digest" = "$digest" ] || exit 1
            fi
            echo "${prefix}_artifact_name=$name" >> "$GITHUB_OUTPUT"
            echo "${prefix}_artifact_id=$id" >> "$GITHUB_OUTPUT"
            echo "${prefix}_artifact_digest=$digest" >> "$GITHUB_OUTPUT"
          }

          select_exact "$CANDIDATE_ARTIFACT_NAME" candidate \
            "$CANDIDATE_ARTIFACT_NAME" "$CANDIDATE_ARTIFACT_ID" \
            "$CANDIDATE_ARTIFACT_DIGEST"

          highest_attempt() {
            prefix="$1"
            jq -r --arg prefix "$prefix" --arg run "$GITHUB_RUN_ID" \
              --argjson current "$GITHUB_RUN_ATTEMPT" '
                [.[] | select(.expired == false) | .name
                 | capture("^(?<prefix>.+)-(?<run>[1-9][0-9]*)-(?<attempt>[1-9][0-9]*)$")
                 | select(.prefix == $prefix and .run == $run and
                          (.attempt | tonumber) < $current)
                 | .attempt | tonumber] | if length > 0 then max else empty end
              ' recovery-artifacts.json
          }

          release_attempt="$(highest_attempt verified-release-state)"
          if [ -n "$release_attempt" ]; then
            release_name="verified-release-state-${GITHUB_RUN_ID}-${release_attempt}"
            select_exact "$release_name" release \
              "$SUPPLIED_RELEASE_NAME" "$SUPPLIED_RELEASE_ID" "$SUPPLIED_RELEASE_DIGEST"
          else
            [ -z "$SUPPLIED_RELEASE_NAME" ] || exit 1
            [ -z "$SUPPLIED_RELEASE_ID" ] || exit 1
            [ -z "$SUPPLIED_RELEASE_DIGEST" ] || exit 1
          fi

          image_attempt="$(highest_attempt image-publication-authority)"
          if [ -n "$image_attempt" ]; then
            [ -n "$release_attempt" ] || {
              echo "image receipt exists without a verified release artifact" >&2
              exit 1
            }
            image_name="image-publication-authority-${GITHUB_RUN_ID}-${image_attempt}"
            select_exact "$image_name" image \
              "$SUPPLIED_IMAGE_NAME" "$SUPPLIED_IMAGE_ID" "$SUPPLIED_IMAGE_DIGEST"
          else
            [ -z "$SUPPLIED_IMAGE_NAME" ] || exit 1
            [ -z "$SUPPLIED_IMAGE_ID" ] || exit 1
            [ -z "$SUPPLIED_IMAGE_DIGEST" ] || exit 1
          fi

      - name: Checkout exact patchset revision
        if: ${{ steps.recovery.outputs.release_artifact_id == '' }}
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ inputs.patchset_sha }}
          path: sub2api-patch
          fetch-depth: 0
          persist-credentials: false

      - name: Download immutable mirror candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          path: candidate-download
          skip-decompress: true
          digest-mismatch: error

      - name: Verify candidate artifact producer attempt
        env:
          ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
          PATCHSET_SHA: ${{ inputs.patchset_sha }}
          UPSTREAM_SOURCE_SHA: ${{ inputs.upstream_source_sha }}
          MIRROR_CANDIDATE_SHA: ${{ inputs.mirror_candidate_sha }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          EXPECTED_MIRROR_SHA: ${{ inputs.expected_mirror_sha }}
          EXPECTED_PATCHED_SHA: ${{ inputs.expected_patched_sha }}
        run: |
          set -euo pipefail
          suffix="${ARTIFACT_NAME#sync-candidate-bundle-}"
          producer_run="${suffix%-*}"
          producer_attempt="${suffix##*-}"
          [ "$ARTIFACT_NAME" = "sync-candidate-bundle-${producer_run}-${producer_attempt}" ] || exit 1
          [[ "$producer_run" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$producer_attempt" =~ ^[1-9][0-9]*$ ]] || exit 1
          [ "$producer_run" = "$GITHUB_RUN_ID" ] || exit 1
          [ "$producer_attempt" -le "$GITHUB_RUN_ATTEMPT" ] || exit 1
          mapfile -t archives < <(find candidate-download -maxdepth 1 -type f -print)
          [ "${#archives[@]}" -eq 1 ] || exit 1
          archive_digest="${ARTIFACT_DIGEST#sha256:}"
          [[ "$archive_digest" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [ "$(sha256sum "${archives[0]}" | awk '{print $1}')" = "$archive_digest" ] || exit 1
          mkdir sync-candidate
          unzip -q "${archives[0]}" -d sync-candidate
          expected_files="$(printf '%s\n' SHA256SUMS candidate.bundle provenance.env | sort)"
          actual_files="$(find sync-candidate -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          [ "$actual_files" = "$expected_files" ] || exit 1
          (cd sync-candidate && sha256sum -c SHA256SUMS)
          provenance=sync-candidate/provenance.env
          [ "$(wc -l < "$provenance")" -eq 13 ] || exit 1
          ! grep -Ev '^[a-z_]+=[^[:cntrl:]]*$' "$provenance" || exit 1
          provenance_field() {
            [ "$(grep -F "${1}=" "$provenance" | wc -l)" -eq 1 ] || exit 1
            sed -n "s/^${1}=//p" "$provenance"
          }
          [ "$(provenance_field patchset_sha)" = "$PATCHSET_SHA" ] || exit 1
          [ "$(provenance_field upstream_source_sha)" = "$UPSTREAM_SOURCE_SHA" ] || exit 1
          [ "$(provenance_field mirror_candidate_sha)" = "$MIRROR_CANDIDATE_SHA" ] || exit 1
          [ "$(provenance_field expected_main_sha)" = "$EXPECTED_MAIN_SHA" ] || exit 1
          [ "$(provenance_field expected_mirror_sha)" = "$EXPECTED_MIRROR_SHA" ] || exit 1
          [ "$(provenance_field expected_patched_sha)" = "$EXPECTED_PATCHED_SHA" ] || exit 1
          [[ "$(provenance_field preview_tree)" =~ ^[0-9a-f]{40}$ ]] || exit 1
          expected_patched_tree="$(provenance_field expected_patched_tree)"
          [ -z "$expected_patched_tree" ] || \
            [[ "$expected_patched_tree" =~ ^[0-9a-f]{40}$ ]] || exit 1
          case "$(provenance_field candidate_changed)" in true|false) ;; *) exit 1 ;; esac
          [ "$(provenance_field repository)" = "$GITHUB_REPOSITORY" ] || exit 1
          [ "$(provenance_field workflow_path)" = .github/workflows/sync-upstream.yml ] || exit 1
          [ "$(provenance_field run_id)" = "$producer_run" ] || exit 1
          [ "$(provenance_field run_attempt)" = "$producer_attempt" ] || exit 1

      - name: Download exact prior verified release state
        if: ${{ steps.recovery.outputs.release_artifact_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.recovery.outputs.release_artifact_id }}
          path: recovery-release-download
          skip-decompress: true
          digest-mismatch: error

      - name: Download exact prior image receipt
        if: ${{ steps.recovery.outputs.image_artifact_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.recovery.outputs.image_artifact_id }}
          path: recovery-image-download
          skip-decompress: true
          digest-mismatch: error

      - name: Recover immutable release inputs without recomputation
        id: recover_release
        if: ${{ steps.recovery.outputs.release_artifact_id != '' }}
        env:
          PATCHSET_SHA: ${{ inputs.patchset_sha }}
          UPSTREAM_SOURCE_SHA: ${{ inputs.upstream_source_sha }}
          MIRROR_CANDIDATE_SHA: ${{ inputs.mirror_candidate_sha }}
          REPLAY_TREE_SHA: ${{ inputs.replay_tree_sha }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          EXPECTED_MIRROR_SHA: ${{ inputs.expected_mirror_sha }}
          EXPECTED_PATCHED_SHA: ${{ inputs.expected_patched_sha }}
          VALIDATION_CONCLUSION: ${{ inputs.validation_conclusion }}
          RELEASE_AFTER_VALIDATION: ${{ inputs.release_after_validation }}
          ORIGINATING_REPOSITORY: ${{ inputs.originating_repository }}
          ORIGINATING_WORKFLOW_PATH: ${{ inputs.originating_workflow_path }}
          ORIGINATING_RUN_ID: ${{ inputs.originating_run_id }}
          ORIGINATING_RUN_ATTEMPT: ${{ inputs.originating_run_attempt }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          RELEASE_ARTIFACT_NAME: ${{ steps.recovery.outputs.release_artifact_name }}
          RELEASE_ARTIFACT_ID: ${{ steps.recovery.outputs.release_artifact_id }}
          RELEASE_ARTIFACT_DIGEST: ${{ steps.recovery.outputs.release_artifact_digest }}
          IMAGE_ARTIFACT_NAME: ${{ steps.recovery.outputs.image_artifact_name }}
          IMAGE_ARTIFACT_ID: ${{ steps.recovery.outputs.image_artifact_id }}
          IMAGE_ARTIFACT_DIGEST: ${{ steps.recovery.outputs.image_artifact_digest }}
        run: |
          set -euo pipefail
          release_producer_attempt="${RELEASE_ARTIFACT_NAME##*-}"
          [ "$RELEASE_ARTIFACT_NAME" = \
            "verified-release-state-${GITHUB_RUN_ID}-${release_producer_attempt}" ] || exit 1
          [[ "$release_producer_attempt" =~ ^[1-9][0-9]*$ ]] || exit 1
          [ "$release_producer_attempt" -lt "$GITHUB_RUN_ATTEMPT" ] || exit 1
          candidate_suffix="${CANDIDATE_ARTIFACT_NAME#sync-candidate-bundle-}"
          candidate_run="${candidate_suffix%-*}"
          candidate_producer_attempt="${candidate_suffix##*-}"
          [ "$CANDIDATE_ARTIFACT_NAME" = \
            "sync-candidate-bundle-${candidate_run}-${candidate_producer_attempt}" ] || exit 1
          [ "$candidate_run" = "$GITHUB_RUN_ID" ] || exit 1
          [[ "$candidate_producer_attempt" =~ ^[1-9][0-9]*$ ]] || exit 1
          [ "$candidate_producer_attempt" -lt "$GITHUB_RUN_ATTEMPT" ] || exit 1

          mapfile -t archives < <(find recovery-release-download -maxdepth 1 -type f -print)
          [ "${#archives[@]}" -eq 1 ] || exit 1
          archive_digest="${RELEASE_ARTIFACT_DIGEST#sha256:}"
          [[ "$archive_digest" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [ "$(sha256sum "${archives[0]}" | awk '{print $1}')" = "$archive_digest" ] || exit 1
          mkdir recovered-release-state
          unzip -q "${archives[0]}" -d recovered-release-state
          expected_files="$(printf '%s\n' MANIFEST.SHA256 SHA256SUMS \
            content-manifest.sha256 publication-context.tar publication-manifest.env \
            release-notes.md release.bundle | sort)"
          actual_files="$(find recovered-release-state -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          [ "$actual_files" = "$expected_files" ] || exit 1
          (cd recovered-release-state && sha256sum -c MANIFEST.SHA256)
          (cd recovered-release-state && sha256sum -c content-manifest.sha256)
          cmp recovered-release-state/MANIFEST.SHA256 recovered-release-state/SHA256SUMS
          manifest=recovered-release-state/publication-manifest.env
          [ "$(wc -l < "$manifest")" -eq 28 ] || exit 1
          ! grep -Ev '^[a-z_]+=[^[:cntrl:]]*$' "$manifest" || exit 1

          field() {
            key="$1"
            [ "$(grep -F "${key}=" "$manifest" | wc -l)" -eq 1 ] || exit 1
            sed -n "s/^${key}=//p" "$manifest"
          }
          require_field() {
            [ "$(field "$1")" = "$2" ] || {
              echo "recovered release manifest mismatch: $1" >&2
              exit 1
            }
          }
          require_field patchset_sha "$PATCHSET_SHA"
          require_field upstream_source_sha "$UPSTREAM_SOURCE_SHA"
          require_field mirror_candidate_sha "$MIRROR_CANDIDATE_SHA"
          require_field replay_tree_sha "$REPLAY_TREE_SHA"
          require_field expected_main_sha "$EXPECTED_MAIN_SHA"
          require_field expected_mirror_sha "$EXPECTED_MIRROR_SHA"
          require_field expected_patched_sha "$EXPECTED_PATCHED_SHA"
          require_field validation_conclusion "$VALIDATION_CONCLUSION"
          require_field originating_repository "$ORIGINATING_REPOSITORY"
          require_field originating_workflow_path "$ORIGINATING_WORKFLOW_PATH"
          require_field originating_run_id "$ORIGINATING_RUN_ID"
          require_field originating_run_attempt "$ORIGINATING_RUN_ATTEMPT"
          [ "$ORIGINATING_RUN_ID" = "$GITHUB_RUN_ID" ] || exit 1
          [[ "$ORIGINATING_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || exit 1
          [ "$ORIGINATING_RUN_ATTEMPT" = "$release_producer_attempt" ] || exit 1
          [ "$ORIGINATING_RUN_ATTEMPT" -le "$GITHUB_RUN_ATTEMPT" ] || exit 1
          manifest_sha256="$(sha256sum "$manifest" | awk '{print $1}')"
          grep -Fx "${manifest_sha256}  publication-manifest.env" \
            recovered-release-state/MANIFEST.SHA256 >/dev/null
          content_manifest_sha256="$(sha256sum \
            recovered-release-state/content-manifest.sha256 | awk '{print $1}')"
          release_notes_sha256="$(sha256sum \
            recovered-release-state/release-notes.md | awk '{print $1}')"
          require_field content_manifest_sha256 "$content_manifest_sha256"
          require_field release_notes_sha256 "$release_notes_sha256"

          replay_commit_sha="$(field replay_commit_sha)"
          publication_commit_sha="$(field publication_commit_sha)"
          publication_tree_sha="$(field publication_tree_sha)"
          version="$(field version)"
          image_owner="$(field image_owner)"
          version_image_tag="$(field version_image_tag)"
          latest_image_tag="$(field latest_image_tag)"
          version_label="$(field version_label)"
          revision_label="$(field revision_label)"
          docker_context_commit_sha="$(field docker_context_commit_sha)"
          docker_context_tree_sha="$(field docker_context_tree_sha)"
          dockerfile_path="$(field dockerfile_path)"
          cache_from="$(field cache_from)"
          cache_to="$(field cache_to)"
          for sha in "$replay_commit_sha" "$publication_commit_sha" "$publication_tree_sha"; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          done
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-patch\.[0-9]+$ ]] || exit 1
          [ "$image_owner" = \
            "$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" ] || exit 1
          [ "$version_image_tag" = "ghcr.io/${image_owner}/sub2api-patch:${version}" ] || exit 1
          [ "$latest_image_tag" = "ghcr.io/${image_owner}/sub2api-patch:latest-patch" ] || exit 1
          [ "$version_label" = "org.opencontainers.image.version=${version}" ] || exit 1
          [ "$revision_label" = "org.opencontainers.image.revision=${replay_commit_sha}" ] || exit 1
          [ "$docker_context_commit_sha" = "$publication_commit_sha" ] || exit 1
          [ "$docker_context_tree_sha" = "$publication_tree_sha" ] || exit 1
          [ "$dockerfile_path" = Dockerfile ] || exit 1
          [ "$cache_from" = 'type=gha,scope=sub2api-patch-release' ] || exit 1
          [ "$cache_to" = 'type=gha,mode=max,scope=sub2api-patch-release' ] || exit 1

          candidate_provenance=sync-candidate/provenance.env
          [ "$(wc -l < "$candidate_provenance")" -eq 13 ] || exit 1
          ! grep -Ev '^[a-z_]+=[^[:cntrl:]]*$' "$candidate_provenance" || exit 1
          candidate_field() {
            key="$1"
            [ "$(grep -F "${key}=" "$candidate_provenance" | wc -l)" -eq 1 ] || exit 1
            sed -n "s/^${key}=//p" "$candidate_provenance"
          }
          [ "$(candidate_field patchset_sha)" = "$PATCHSET_SHA" ] || exit 1
          [ "$(candidate_field upstream_source_sha)" = "$UPSTREAM_SOURCE_SHA" ] || exit 1
          [ "$(candidate_field mirror_candidate_sha)" = "$MIRROR_CANDIDATE_SHA" ] || exit 1
          [ "$(candidate_field expected_main_sha)" = "$EXPECTED_MAIN_SHA" ] || exit 1
          [ "$(candidate_field expected_mirror_sha)" = "$EXPECTED_MIRROR_SHA" ] || exit 1
          [ "$(candidate_field expected_patched_sha)" = "$EXPECTED_PATCHED_SHA" ] || exit 1
          [ "$(candidate_field preview_tree)" = "$publication_tree_sha" ] || exit 1
          expected_patched_tree="$(candidate_field expected_patched_tree)"
          [ -z "$expected_patched_tree" ] || \
            [[ "$expected_patched_tree" =~ ^[0-9a-f]{40}$ ]] || exit 1
          candidate_changed="$(candidate_field candidate_changed)"
          case "$candidate_changed" in true|false) ;; *) exit 1 ;; esac
          case "$GITHUB_EVENT_NAME" in
            schedule) [ "$candidate_changed" = true ] || exit 1 ;;
            workflow_dispatch) [ "$RELEASE_AFTER_VALIDATION" = true ] || exit 1 ;;
            *) exit 1 ;;
          esac
          [ "$(candidate_field repository)" = "$GITHUB_REPOSITORY" ] || exit 1
          [ "$(candidate_field workflow_path)" = .github/workflows/sync-upstream.yml ] || exit 1
          [ "$(candidate_field run_id)" = "$GITHUB_RUN_ID" ] || exit 1
          [ "$(candidate_field run_attempt)" = "$candidate_producer_attempt" ] || exit 1

          git init recovered-objects
          git -C recovered-objects bundle verify \
            "$GITHUB_WORKSPACE/recovered-release-state/release.bundle"
          git -C recovered-objects bundle unbundle \
            "$GITHUB_WORKSPACE/recovered-release-state/release.bundle" >/dev/null
          [ "$(git -C recovered-objects rev-parse "$MIRROR_CANDIDATE_SHA^1")" = \
            "$EXPECTED_MAIN_SHA" ] || exit 1
          [ "$(git -C recovered-objects rev-parse "$replay_commit_sha^{tree}")" = \
            "$REPLAY_TREE_SHA" ] || exit 1
          [ "$(git -C recovered-objects rev-parse "$publication_commit_sha^{tree}")" = \
            "$publication_tree_sha" ] || exit 1
          [ "$(git -C recovered-objects rev-parse "$publication_commit_sha^")" = \
            "$replay_commit_sha" ] || exit 1
          git init recovered-candidate-objects
          git -C recovered-candidate-objects bundle verify \
            "$GITHUB_WORKSPACE/sync-candidate/candidate.bundle"
          git -C recovered-candidate-objects bundle unbundle \
            "$GITHUB_WORKSPACE/sync-candidate/candidate.bundle" >/dev/null
          [ "$(git -C recovered-candidate-objects rev-parse \
            "$MIRROR_CANDIDATE_SHA^{commit}")" = "$MIRROR_CANDIDATE_SHA" ] || exit 1
          [ "$(git -C recovered-candidate-objects rev-parse "$MIRROR_CANDIDATE_SHA^1")" = \
            "$EXPECTED_MAIN_SHA" ] || exit 1
          workflow_install_sha="$(git -C recovered-candidate-objects rev-parse \
            "$MIRROR_CANDIDATE_SHA^2")"
          [ "$(git -C recovered-candidate-objects rev-parse "$workflow_install_sha^")" = \
            "$UPSTREAM_SOURCE_SHA" ] || exit 1
          [ "$(git -C recovered-candidate-objects rev-parse \
            "$MIRROR_CANDIDATE_SHA^{tree}")" = \
            "$(git -C recovered-candidate-objects rev-parse "$workflow_install_sha^{tree}")" ] || exit 1

          blocked='(^|[^A-Za-z0-9_])#[0-9]+|PR[[:space:]]*#[0-9]+|pull request[[:space:]]*#[0-9]+|issue[[:space:]]*#[0-9]+|/issues/[0-9]+|/pull/[0-9]+|github\.com/[^[:space:]]+/(issues|pull)/[0-9]+|(^|[^A-Za-z0-9_])@[A-Za-z0-9_-]+'
          ! grep -E "$blocked" recovered-release-state/release-notes.md || exit 1
          grep -Fxq "$version" recovered-release-state/release-notes.md || exit 1
          grep -Fxq -- "- upstream_source_sha: $UPSTREAM_SOURCE_SHA" \
            recovered-release-state/release-notes.md || exit 1
          grep -Fxq -- "- patchset_sha: $PATCHSET_SHA" \
            recovered-release-state/release-notes.md || exit 1
          grep -Fxq -- "- replay_tree_sha: $REPLAY_TREE_SHA" \
            recovered-release-state/release-notes.md || exit 1
          mkdir recovered-publication
          tar -xf recovered-release-state/publication-context.tar -C recovered-publication
          [ -f "recovered-publication/$dockerfile_path" ] || exit 1

          recovered_image_digest=
          if [ -n "$IMAGE_ARTIFACT_ID" ] || [ -n "$IMAGE_ARTIFACT_DIGEST" ] || \
            [ -n "$IMAGE_ARTIFACT_NAME" ]; then
            [[ "$IMAGE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
            [[ "$IMAGE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
            image_producer_attempt="${IMAGE_ARTIFACT_NAME##*-}"
            [ "$IMAGE_ARTIFACT_NAME" = \
              "image-publication-authority-${GITHUB_RUN_ID}-${image_producer_attempt}" ] || exit 1
            [[ "$image_producer_attempt" =~ ^[1-9][0-9]*$ ]] || exit 1
            [ "$image_producer_attempt" -lt "$GITHUB_RUN_ATTEMPT" ] || exit 1
            mapfile -t image_archives < <(find recovery-image-download -maxdepth 1 -type f -print)
            [ "${#image_archives[@]}" -eq 1 ] || exit 1
            image_archive_digest="${IMAGE_ARTIFACT_DIGEST#sha256:}"
            [ "$(sha256sum "${image_archives[0]}" | awk '{print $1}')" = \
              "$image_archive_digest" ] || exit 1
            mkdir recovered-image-state
            unzip -q "${image_archives[0]}" -d recovered-image-state
            expected_image_files="$(printf '%s\n' IMAGE-MANIFEST.SHA256 \
              image-publication.env oci-closure.json release-image.oci.tar | sort)"
            actual_image_files="$(find recovered-image-state -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
            [ "$actual_image_files" = "$expected_image_files" ] || exit 1
            (cd recovered-image-state && sha256sum -c IMAGE-MANIFEST.SHA256)
            image_manifest=recovered-image-state/image-publication.env
            [ "$(wc -l < "$image_manifest")" -eq 37 ] || exit 1
            ! grep -Ev '^[a-z_]+=[^[:cntrl:]]*$' "$image_manifest" || exit 1
            image_field() {
              key="$1"
              [ "$(grep -F "${key}=" "$image_manifest" | wc -l)" -eq 1 ] || exit 1
              sed -n "s/^${key}=//p" "$image_manifest"
            }
            [ "$(image_field repository)" = "$GITHUB_REPOSITORY" ] || exit 1
            [ "$(image_field workflow_path)" = .github/workflows/sync-upstream.yml ] || exit 1
            [ "$(image_field run_id)" = "$GITHUB_RUN_ID" ] || exit 1
            [ "$(image_field run_attempt)" = "$image_producer_attempt" ] || exit 1
            [ "$(image_field release_artifact_id)" = "$RELEASE_ARTIFACT_ID" ] || exit 1
            [ "$(image_field release_artifact_digest)" = "$RELEASE_ARTIFACT_DIGEST" ] || exit 1
            [ "$(image_field manifest_sha256)" = "$manifest_sha256" ] || exit 1
            [ "$(image_field version)" = "$version" ] || exit 1
            [ "$(image_field replay_commit_sha)" = "$replay_commit_sha" ] || exit 1
            [ "$(image_field publication_commit_sha)" = "$publication_commit_sha" ] || exit 1
            [ "$(image_field patchset_sha)" = "$PATCHSET_SHA" ] || exit 1
            [ "$(image_field upstream_source_sha)" = "$UPSTREAM_SOURCE_SHA" ] || exit 1
            [ "$(image_field mirror_candidate_sha)" = "$MIRROR_CANDIDATE_SHA" ] || exit 1
            [ "$(image_field replay_tree_sha)" = "$REPLAY_TREE_SHA" ] || exit 1
            [ "$(image_field publication_tree_sha)" = "$publication_tree_sha" ] || exit 1
            [ "$(image_field version_image_tag)" = "$version_image_tag" ] || exit 1
            [ "$(image_field latest_image_tag)" = "$latest_image_tag" ] || exit 1
            [ "$(image_field expected_version_state)" = missing ] || exit 1
            recovered_latest_state="$(image_field expected_latest_state)"
            case "$recovered_latest_state" in
              missing)
                [ -z "$(image_field expected_latest_manifest_sha256)" ] || exit 1
                [ -z "$(image_field expected_latest_version_label)" ] || exit 1
                [ -z "$(image_field expected_latest_revision_label)" ] || exit 1
                ;;
              present)
                [[ "$(image_field expected_latest_manifest_sha256)" =~ ^[0-9a-f]{64}$ ]] || exit 1
                [[ "$(image_field expected_latest_version_label)" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-patch\.[0-9]+$ ]] || exit 1
                [[ "$(image_field expected_latest_revision_label)" =~ ^[0-9a-f]{40}$ ]] || exit 1
                ;;
              *) exit 1 ;;
            esac
            [ "$(image_field runtime_platforms)" = linux/amd64 ] || exit 1
            [ "$(image_field build_provenance)" = false ] || exit 1
            [ "$(image_field build_sbom)" = false ] || exit 1
            [[ "$(image_field oci_root_media_type)" =~ ^application/[^[:space:]]+$ ]] || exit 1
            recovered_image_digest="$(image_field oci_root_digest)"
            [[ "$recovered_image_digest" =~ ^[0-9a-f]{64}$ ]] || exit 1
            [[ "$(image_field oci_root_size)" =~ ^[0-9]+$ ]] || exit 1
            [ "$(image_field oci_archive_sha256)" = \
              "$(sha256sum recovered-image-state/release-image.oci.tar | awk '{print $1}')" ] || exit 1
            [ "$(image_field oci_archive_size)" = \
              "$(stat -c %s recovered-image-state/release-image.oci.tar)" ] || exit 1
            closure_sha="$(sha256sum recovered-image-state/oci-closure.json | awk '{print $1}')"
            [ "$(image_field oci_closure_sha256)" = "$closure_sha" ] || exit 1
            jq -e --arg replay "$REPLAY_TREE_SHA" --arg publication "$publication_tree_sha" \
              --arg version "$version" \
              '.schemaVersion == 1 and .binding.replayTreeSha == $replay and
               .binding.publicationTreeSha == $publication and .binding.version == $version and
               .buildPolicy.runtimePlatforms == ["linux/amd64"] and
               .buildPolicy.provenance == false and .buildPolicy.sbom == false' \
              recovered-image-state/oci-closure.json >/dev/null
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "replay_commit_sha=$replay_commit_sha" >> "$GITHUB_OUTPUT"
          echo "publication_commit_sha=$publication_commit_sha" >> "$GITHUB_OUTPUT"
          echo "publication_tree_sha=$publication_tree_sha" >> "$GITHUB_OUTPUT"
          echo "image_owner=$image_owner" >> "$GITHUB_OUTPUT"
          echo "version_image_tag=$version_image_tag" >> "$GITHUB_OUTPUT"
          echo "latest_image_tag=$latest_image_tag" >> "$GITHUB_OUTPUT"
          echo "version_label=$version_label" >> "$GITHUB_OUTPUT"
          echo "revision_label=$revision_label" >> "$GITHUB_OUTPUT"
          echo "docker_context_commit_sha=$docker_context_commit_sha" >> "$GITHUB_OUTPUT"
          echo "docker_context_tree_sha=$docker_context_tree_sha" >> "$GITHUB_OUTPUT"
          echo "dockerfile_path=$dockerfile_path" >> "$GITHUB_OUTPUT"
          echo "cache_from=$cache_from" >> "$GITHUB_OUTPUT"
          echo "cache_to=$cache_to" >> "$GITHUB_OUTPUT"
          echo "release_notes_sha256=$release_notes_sha256" >> "$GITHUB_OUTPUT"
          echo "content_manifest_sha256=$content_manifest_sha256" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"
          echo "recovered_image_digest=$recovered_image_digest" >> "$GITHUB_OUTPUT"
          echo "artifact_producer_attempt=$release_producer_attempt" >> "$GITHUB_OUTPUT"
          echo "originating_run_attempt=$ORIGINATING_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Reconstruct and prepare release without mutation
        id: release
        if: ${{ steps.recovery.outputs.release_artifact_id == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PATCHSET_SHA: ${{ inputs.patchset_sha }}
          UPSTREAM_SOURCE_SHA: ${{ inputs.upstream_source_sha }}
          MIRROR_CANDIDATE_SHA: ${{ inputs.mirror_candidate_sha }}
          REPLAY_TREE_SHA: ${{ inputs.replay_tree_sha }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          EXPECTED_MIRROR_SHA: ${{ inputs.expected_mirror_sha }}
          EXPECTED_PATCHED_SHA: ${{ inputs.expected_patched_sha }}
        run: |
          set -euo pipefail
          (cd sync-candidate && sha256sum -c SHA256SUMS)
          [ "$UPSTREAM_REPOSITORY" = Wei-Shaw/sub2api ] || {
            echo "unexpected upstream repository: $UPSTREAM_REPOSITORY" >&2
            exit 1
          }
          [ "$(git -C sub2api-patch rev-parse HEAD^{commit})" = "$PATCHSET_SHA" ] || exit 1

          git init candidate-check
          git -C candidate-check fetch ../sync-candidate/candidate.bundle \
            refs/heads/candidate:refs/heads/candidate
          [ "$(git -C candidate-check rev-parse refs/heads/candidate^{commit})" = \
            "$MIRROR_CANDIDATE_SHA" ] || exit 1
          [ "$(git -C candidate-check show -s --format=%P "$MIRROR_CANDIDATE_SHA" | wc -w)" -eq 2 ] || exit 1
          [ "$(git -C candidate-check rev-parse "$MIRROR_CANDIDATE_SHA^1")" = "$EXPECTED_MAIN_SHA" ] || exit 1
          workflow_install_sha="$(git -C candidate-check rev-parse "$MIRROR_CANDIDATE_SHA^2")"
          [ "$(git -C candidate-check rev-parse "$workflow_install_sha^")" = "$UPSTREAM_SOURCE_SHA" ] || exit 1
          [ "$(git -C candidate-check rev-parse "$MIRROR_CANDIDATE_SHA^{tree}")" = \
            "$(git -C candidate-check rev-parse "$workflow_install_sha^{tree}")" ] || exit 1
          git -C candidate-check show "$workflow_install_sha:.github/workflows/upstream-pr-check.yml" > installed.yml
          cmp installed.yml sub2api-patch/.github/workflows/upstream-pr-check.yml

          git init worktree
          git -C worktree remote add upstream "$UPSTREAM_GIT_URL"
          [ "$(git -C worktree remote get-url upstream)" = https://github.com/Wei-Shaw/sub2api.git ] || exit 1
          git -C worktree fetch --no-tags upstream "+refs/heads/main:refs/remotes/upstream/main"
          git -C worktree rev-list --first-parent refs/remotes/upstream/main |
            grep -Fx "$UPSTREAM_SOURCE_SHA" >/dev/null || exit 1
          ready_sha="$(sub2api-patch/scripts/upstream-ci-ready.sh "$UPSTREAM_REPOSITORY" "$UPSTREAM_SOURCE_SHA")"
          [ "$ready_sha" = "$UPSTREAM_SOURCE_SHA" ] || exit 1
          git -C worktree checkout --detach "$UPSTREAM_SOURCE_SHA"
          downstream_url="https://github.com/${GITHUB_REPOSITORY}.git"
          git -C worktree remote add downstream "$downstream_url"
          git -C worktree fetch --tags downstream
          current_main="$(git -C worktree rev-parse refs/remotes/downstream/main^{commit})"
          current_mirror="$(git ls-remote "$downstream_url" refs/heads/mirror/upstream-main | awk '{print $1}')"
          current_patched="$(git ls-remote "$downstream_url" refs/heads/patched | awk '{print $1}')"
          [ "$current_main" = "$EXPECTED_MAIN_SHA" ] || {
            echo "main changed before release authority was created" >&2
            exit 1
          }
          [ "$current_mirror" = "$EXPECTED_MIRROR_SHA" ] || {
            echo "mirror/upstream-main changed before release authority was created" >&2
            exit 1
          }
          [ "$current_patched" = "$EXPECTED_PATCHED_SHA" ] || {
            echo "patched changed before release authority was created" >&2
            exit 1
          }

          EXPECTED_BASE_SHA="$UPSTREAM_SOURCE_SHA" sub2api-patch/scripts/apply-patches.sh worktree
          replay_commit_sha="$(git -C worktree rev-parse HEAD^{commit})"
          actual_replay_tree="$(git -C worktree rev-parse HEAD^{tree})"
          [ "$actual_replay_tree" = "$REPLAY_TREE_SHA" ] || {
            echo "release replay tree differs from validated tree" >&2
            exit 1
          }
          [ -z "$(git -C worktree status --porcelain)" ] || exit 1
          [ -z "$(git -C worktree diff --name-only --diff-filter=U)" ] || exit 1
          if find worktree -type f \( -name '*.rej' -o -name '*.orig' \) -print -quit | grep -q .; then
            exit 1
          fi
          (cd worktree && git diff --check)
          PATCH_BASE_REPO=worktree EXPECTED_BASE_SHA="$UPSTREAM_SOURCE_SHA" \
            sub2api-patch/scripts/check-no-pr-issue-refs.sh sub2api-patch

          upstream_version="$(tr -d '[:space:]' < worktree/backend/cmd/server/VERSION)"
          base="v${upstream_version}"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[].tag_name' > release-tags.txt
          gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${base}-patch.?per_page=100" \
            --jq '.[].ref' > remote-tag-refs.txt
          sed 's#^refs/tags/##' remote-tag-refs.txt > remote-tag-names.txt
          version="$(RELEASE_REPOSITORY="$GITHUB_REPOSITORY" \
            sub2api-patch/scripts/compute-next-version.sh worktree)"
          ! git -C worktree show-ref --verify --quiet "refs/tags/$version" || exit 1
          ! grep -Fxq "$version" release-tags.txt || exit 1
          ! grep -Fxq "$version" remote-tag-names.txt || exit 1

          cat > release-notes.md <<EOF
          ${version}

          Base:
          - upstream version: v${upstream_version}
          - upstream_source_sha: ${UPSTREAM_SOURCE_SHA}
          - patchset_sha: ${PATCHSET_SHA}
          - replay_tree_sha: ${REPLAY_TREE_SHA}

          Patch topics:
          1. publish downstream Docker images
          2. cache pnpm dependencies with BuildKit
          3. parse singular OpenAI cached token details
          4. add shared endpoint account scheduling context
          5. schedule resilient OpenAI audio transcriptions
          6. expose OpenAI audio transcription transport
          7. proxy OpenAI realtime WebSocket sessions
          8. proxy OpenAI realtime REST endpoints
          9. moderate OpenAI realtime client events
          10. connect realtime REST moderation protocol
          11. preserve caller Codex system prompts
          EOF
          PATCH_BASE_REPO=worktree EXPECTED_BASE_SHA="$UPSTREAM_SOURCE_SHA" \
            sub2api-patch/scripts/check-no-pr-issue-refs.sh sub2api-patch
          blocked='(^|[^A-Za-z0-9_])#[0-9]+|PR[[:space:]]*#[0-9]+|pull request[[:space:]]*#[0-9]+|issue[[:space:]]*#[0-9]+|/issues/[0-9]+|/pull/[0-9]+|github\.com/[^[:space:]]+/(issues|pull)/[0-9]+|(^|[^A-Za-z0-9_])@[A-Za-z0-9_-]+'
          ! grep -E "$blocked" release-notes.md || exit 1

          git -C worktree checkout -B publication "$replay_commit_sha"
          rm -rf worktree/.github/workflows
          git -C worktree add -A .github/workflows
          git -C worktree diff --cached --quiet && {
            echo "publication commit must remove upstream workflow files" >&2
            exit 1
          }
          release_notes_sha256="$(sha256sum release-notes.md | awk '{print $1}')"
          git -C worktree commit \
            -m "Remove upstream workflows from patched branch" \
            -m "Release-Version: ${version}
          Patchset-SHA: ${PATCHSET_SHA}
          Upstream-Source-SHA: ${UPSTREAM_SOURCE_SHA}
          Mirror-Candidate-SHA: ${MIRROR_CANDIDATE_SHA}
          Replay-Tree-SHA: ${REPLAY_TREE_SHA}
          Expected-Main-SHA: ${EXPECTED_MAIN_SHA}
          Expected-Mirror-SHA: ${EXPECTED_MIRROR_SHA}
          Expected-Patched-SHA: ${EXPECTED_PATCHED_SHA}
          Release-Notes-SHA256: ${release_notes_sha256}"
          publication_commit_sha="$(git -C worktree rev-parse HEAD^{commit})"
          [ "$(git -C worktree rev-parse "$publication_commit_sha^")" = "$replay_commit_sha" ] || exit 1
          git -C worktree diff-tree --no-commit-id --name-only -r \
            "$replay_commit_sha" "$publication_commit_sha" > publication-paths.txt
          [ -s publication-paths.txt ] || exit 1
          if grep -Ev '^\.github/workflows/' publication-paths.txt; then
            echo "publication commit changes non-workflow paths" >&2
            exit 1
          fi
          ! grep -E "$blocked" publication-paths.txt || exit 1
          [ -z "$(git -C worktree status --porcelain)" ] || exit 1
          git -C worktree diff --check "$replay_commit_sha" "$publication_commit_sha"
          ! git -C worktree show -s --format=%B "$publication_commit_sha" | grep -E "$blocked" || exit 1
          PATCH_BASE_REPO=worktree EXPECTED_BASE_SHA="$UPSTREAM_SOURCE_SHA" \
            sub2api-patch/scripts/check-no-pr-issue-refs.sh sub2api-patch
          publication_tree_sha="$(git -C worktree rev-parse "$publication_commit_sha^{tree}")"
          provenance_preview_tree="$(sed -n 's/^preview_tree=//p' \
            sync-candidate/provenance.env)"
          [ "$provenance_preview_tree" = "$publication_tree_sha" ] || {
            echo "candidate preview tree differs from prepared publication tree" >&2
            exit 1
          }

          [ "$current_main" = "$EXPECTED_MAIN_SHA" ] || exit 1
          [ "$current_mirror" = "$EXPECTED_MIRROR_SHA" ] || exit 1
          [ "$current_patched" = "$EXPECTED_PATCHED_SHA" ] || exit 1

          git -C worktree checkout --detach "$publication_commit_sha"
          git -C worktree branch -f replay "$replay_commit_sha"
          git -C worktree branch -f publication "$publication_commit_sha"
          git -C worktree bundle unbundle ../sync-candidate/candidate.bundle >/dev/null
          git -C worktree update-ref refs/heads/candidate "$MIRROR_CANDIDATE_SHA"
          git -C worktree bundle create ../release.bundle \
            refs/heads/candidate refs/heads/replay refs/heads/publication

          image_owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          [[ "$image_owner" =~ ^[a-z0-9][a-z0-9._-]*$ ]] || exit 1
          version_image_tag="ghcr.io/${image_owner}/sub2api-patch:${version}"
          latest_image_tag="ghcr.io/${image_owner}/sub2api-patch:latest-patch"
          version_label="org.opencontainers.image.version=${version}"
          revision_label="org.opencontainers.image.revision=${replay_commit_sha}"
          docker_context_commit_sha="$publication_commit_sha"
          docker_context_tree_sha="$publication_tree_sha"
          dockerfile_path=Dockerfile
          cache_from='type=gha,scope=sub2api-patch-release'
          cache_to='type=gha,mode=max,scope=sub2api-patch-release'
          mkdir -p release-state
          mv release.bundle release-notes.md release-state/
          git -C worktree archive --format=tar "$publication_commit_sha" > \
            release-state/publication-context.tar
          release_notes_sha256="$(sha256sum release-state/release-notes.md | awk '{print $1}')"
          (
            cd release-state
            sha256sum publication-context.tar release.bundle release-notes.md > \
              content-manifest.sha256
          )
          content_manifest_sha256="$(sha256sum release-state/content-manifest.sha256 | awk '{print $1}')"
          cat > release-state/publication-manifest.env <<EOF
          patchset_sha=${PATCHSET_SHA}
          upstream_source_sha=${UPSTREAM_SOURCE_SHA}
          mirror_candidate_sha=${MIRROR_CANDIDATE_SHA}
          replay_tree_sha=${REPLAY_TREE_SHA}
          expected_main_sha=${EXPECTED_MAIN_SHA}
          expected_mirror_sha=${EXPECTED_MIRROR_SHA}
          expected_patched_sha=${EXPECTED_PATCHED_SHA}
          validation_conclusion=${{ inputs.validation_conclusion }}
          originating_repository=${{ inputs.originating_repository }}
          originating_workflow_path=${{ inputs.originating_workflow_path }}
          originating_run_id=${{ inputs.originating_run_id }}
          originating_run_attempt=${{ inputs.originating_run_attempt }}
          replay_commit_sha=${replay_commit_sha}
          publication_commit_sha=${publication_commit_sha}
          publication_tree_sha=${publication_tree_sha}
          version=${version}
          image_owner=${image_owner}
          version_image_tag=${version_image_tag}
          latest_image_tag=${latest_image_tag}
          version_label=${version_label}
          revision_label=${revision_label}
          docker_context_commit_sha=${docker_context_commit_sha}
          docker_context_tree_sha=${docker_context_tree_sha}
          dockerfile_path=${dockerfile_path}
          cache_from=${cache_from}
          cache_to=${cache_to}
          release_notes_sha256=${release_notes_sha256}
          content_manifest_sha256=${content_manifest_sha256}
          EOF
          release_artifact_name="verified-release-state-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          manifest_sha256="$(sha256sum release-state/publication-manifest.env | awk '{print $1}')"
          printf '%s  %s\n' "$manifest_sha256" publication-manifest.env > \
            release-state/MANIFEST.SHA256
          cp release-state/MANIFEST.SHA256 release-state/SHA256SUMS
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "replay_commit_sha=$replay_commit_sha" >> "$GITHUB_OUTPUT"
          echo "publication_commit_sha=$publication_commit_sha" >> "$GITHUB_OUTPUT"
          echo "publication_tree_sha=$publication_tree_sha" >> "$GITHUB_OUTPUT"
          echo "image_owner=$image_owner" >> "$GITHUB_OUTPUT"
          echo "version_image_tag=$version_image_tag" >> "$GITHUB_OUTPUT"
          echo "latest_image_tag=$latest_image_tag" >> "$GITHUB_OUTPUT"
          echo "version_label=$version_label" >> "$GITHUB_OUTPUT"
          echo "revision_label=$revision_label" >> "$GITHUB_OUTPUT"
          echo "docker_context_commit_sha=$docker_context_commit_sha" >> "$GITHUB_OUTPUT"
          echo "docker_context_tree_sha=$docker_context_tree_sha" >> "$GITHUB_OUTPUT"
          echo "dockerfile_path=$dockerfile_path" >> "$GITHUB_OUTPUT"
          echo "cache_from=$cache_from" >> "$GITHUB_OUTPUT"
          echo "cache_to=$cache_to" >> "$GITHUB_OUTPUT"
          echo "release_notes_sha256=$release_notes_sha256" >> "$GITHUB_OUTPUT"
          echo "content_manifest_sha256=$content_manifest_sha256" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"
          echo "release_artifact_name=$release_artifact_name" >> "$GITHUB_OUTPUT"
          echo "artifact_producer_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload verified release state
        id: upload_release
        if: ${{ steps.recovery.outputs.release_artifact_id == '' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.release.outputs.release_artifact_name }}
          path: release-state
          if-no-files-found: error

  authorize-git-mutation:
    needs: [prepare-release, prepare-image-authority]
    if: >-
      ${{ needs.prepare-release.result == 'success'
        && needs.prepare-image-authority.result == 'success' }}
    permissions:
      actions: read
      contents: read
    outputs:
      authority_artifact_name: ${{ steps.git_authority.outputs.authority_artifact_name }}
      authority_artifact_id: ${{ steps.upload_git_authority.outputs.artifact-id }}
      authority_artifact_digest: ${{ steps.upload_git_authority.outputs.artifact-digest }}
      release_artifact_name: ${{ steps.git_authority.outputs.release_artifact_name }}
      release_artifact_id: ${{ steps.git_authority.outputs.release_artifact_id }}
      release_artifact_digest: ${{ steps.git_authority.outputs.release_artifact_digest }}
      patchset_sha: ${{ steps.git_authority.outputs.patchset_sha }}
      upstream_source_sha: ${{ steps.git_authority.outputs.upstream_source_sha }}
      mirror_candidate_sha: ${{ steps.git_authority.outputs.mirror_candidate_sha }}
      expected_main_sha: ${{ steps.git_authority.outputs.expected_main_sha }}
      expected_mirror_sha: ${{ steps.git_authority.outputs.expected_mirror_sha }}
      expected_patched_sha: ${{ steps.git_authority.outputs.expected_patched_sha }}
      replay_commit_sha: ${{ steps.git_authority.outputs.replay_commit_sha }}
      replay_tree_sha: ${{ steps.git_authority.outputs.replay_tree_sha }}
      publication_commit_sha: ${{ steps.git_authority.outputs.publication_commit_sha }}
      version: ${{ steps.git_authority.outputs.version }}
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Download exact verified release state by platform identity
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.prepare-release.outputs.release_artifact_id }}
          path: artifact-download
          skip-decompress: true
          digest-mismatch: error

      - name: Authorize immutable Git publication state
        env:
          PATCHSET_SHA: ${{ needs.prepare-release.outputs.patchset_sha }}
          UPSTREAM_SOURCE_SHA: ${{ needs.prepare-release.outputs.upstream_source_sha }}
          MIRROR_CANDIDATE_SHA: ${{ needs.prepare-release.outputs.mirror_candidate_sha }}
          REPLAY_TREE_SHA: ${{ needs.prepare-release.outputs.replay_tree_sha }}
          EXPECTED_MAIN_SHA: ${{ needs.prepare-release.outputs.expected_main_sha }}
          EXPECTED_MIRROR_SHA: ${{ needs.prepare-release.outputs.expected_mirror_sha }}
          EXPECTED_PATCHED_SHA: ${{ needs.prepare-release.outputs.expected_patched_sha }}
          VALIDATION_CONCLUSION: ${{ needs.prepare-release.outputs.validation_conclusion }}
          ORIGINATING_REPOSITORY: ${{ needs.prepare-release.outputs.originating_repository }}
          ORIGINATING_WORKFLOW_PATH: ${{ needs.prepare-release.outputs.originating_workflow_path }}
          ORIGINATING_RUN_ID: ${{ needs.prepare-release.outputs.originating_run_id }}
          ORIGINATING_RUN_ATTEMPT: ${{ needs.prepare-release.outputs.originating_run_attempt }}
          REPLAY_COMMIT_SHA: ${{ needs.prepare-release.outputs.replay_commit_sha }}
          PUBLICATION_COMMIT_SHA: ${{ needs.prepare-release.outputs.publication_commit_sha }}
          PUBLICATION_TREE_SHA: ${{ needs.prepare-release.outputs.publication_tree_sha }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          IMAGE_OWNER: ${{ needs.prepare-release.outputs.image_owner }}
          VERSION_IMAGE_TAG: ${{ needs.prepare-release.outputs.version_image_tag }}
          LATEST_IMAGE_TAG: ${{ needs.prepare-release.outputs.latest_image_tag }}
          VERSION_LABEL: ${{ needs.prepare-release.outputs.version_label }}
          REVISION_LABEL: ${{ needs.prepare-release.outputs.revision_label }}
          DOCKER_CONTEXT_COMMIT_SHA: ${{ needs.prepare-release.outputs.docker_context_commit_sha }}
          DOCKER_CONTEXT_TREE_SHA: ${{ needs.prepare-release.outputs.docker_context_tree_sha }}
          DOCKERFILE_PATH: ${{ needs.prepare-release.outputs.dockerfile_path }}
          CACHE_FROM: ${{ needs.prepare-release.outputs.cache_from }}
          CACHE_TO: ${{ needs.prepare-release.outputs.cache_to }}
          RELEASE_NOTES_SHA256: ${{ needs.prepare-release.outputs.release_notes_sha256 }}
          CONTENT_MANIFEST_SHA256: ${{ needs.prepare-release.outputs.content_manifest_sha256 }}
          MANIFEST_SHA256: ${{ needs.prepare-release.outputs.manifest_sha256 }}
          RELEASE_ARTIFACT_NAME: ${{ needs.prepare-release.outputs.release_artifact_name }}
          RELEASE_ARTIFACT_ID: ${{ needs.prepare-release.outputs.release_artifact_id }}
          RELEASE_ARTIFACT_DIGEST: ${{ needs.prepare-release.outputs.release_artifact_digest }}
        run: |
          set -euo pipefail
          suffix="${RELEASE_ARTIFACT_NAME#verified-release-state-}"
          producer_run="${suffix%-*}"
          producer_attempt="${suffix##*-}"
          [ "$RELEASE_ARTIFACT_NAME" = "verified-release-state-${producer_run}-${producer_attempt}" ] || exit 1
          [[ "$producer_run" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$producer_attempt" =~ ^[1-9][0-9]*$ ]] || exit 1
          [ "$producer_run" = "$GITHUB_RUN_ID" ] || exit 1
          [ "$producer_attempt" -le "$GITHUB_RUN_ATTEMPT" ] || exit 1
          [ "$ORIGINATING_RUN_ID" = "$GITHUB_RUN_ID" ] || exit 1
          [[ "$RELEASE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          archive_digest="${RELEASE_ARTIFACT_DIGEST#sha256:}"
          [[ "$archive_digest" =~ ^[0-9a-f]{64}$ ]] || exit 1
          mapfile -t archive_files < <(find artifact-download -maxdepth 1 -type f -print)
          [ "${#archive_files[@]}" -eq 1 ] || exit 1
          [ "$(sha256sum "${archive_files[0]}" | awk '{print $1}')" = "$archive_digest" ] || exit 1
          mkdir release-state
          unzip -q "${archive_files[0]}" -d release-state
          expected_payload_files="$(printf '%s\n' \
            MANIFEST.SHA256 SHA256SUMS content-manifest.sha256 \
            publication-context.tar publication-manifest.env release-notes.md release.bundle | sort)"
          actual_payload_files="$(find release-state -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          [ "$actual_payload_files" = "$expected_payload_files" ] || exit 1
          [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [[ "$CONTENT_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [[ "$RELEASE_NOTES_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          (cd release-state && sha256sum -c MANIFEST.SHA256)
          [ "$(sha256sum release-state/publication-manifest.env | awk '{print $1}')" = \
            "$MANIFEST_SHA256" ] || exit 1
          [ "$(sha256sum release-state/content-manifest.sha256 | awk '{print $1}')" = \
            "$CONTENT_MANIFEST_SHA256" ] || exit 1
          (cd release-state && sha256sum -c content-manifest.sha256)
          [ "$(sha256sum release-state/release-notes.md | awk '{print $1}')" = \
            "$RELEASE_NOTES_SHA256" ] || exit 1

          require_manifest() {
            key="$1"
            expected="$2"
            [ "$(grep -F "${key}=" release-state/publication-manifest.env | wc -l)" -eq 1 ] || exit 1
            grep -Fx "${key}=${expected}" release-state/publication-manifest.env >/dev/null
          }
          require_manifest patchset_sha "$PATCHSET_SHA"
          require_manifest upstream_source_sha "$UPSTREAM_SOURCE_SHA"
          require_manifest mirror_candidate_sha "$MIRROR_CANDIDATE_SHA"
          require_manifest replay_tree_sha "$REPLAY_TREE_SHA"
          require_manifest expected_main_sha "$EXPECTED_MAIN_SHA"
          require_manifest expected_mirror_sha "$EXPECTED_MIRROR_SHA"
          require_manifest expected_patched_sha "$EXPECTED_PATCHED_SHA"
          require_manifest validation_conclusion "$VALIDATION_CONCLUSION"
          require_manifest originating_repository "$ORIGINATING_REPOSITORY"
          require_manifest originating_workflow_path "$ORIGINATING_WORKFLOW_PATH"
          require_manifest originating_run_id "$ORIGINATING_RUN_ID"
          require_manifest originating_run_attempt "$ORIGINATING_RUN_ATTEMPT"
          require_manifest replay_commit_sha "$REPLAY_COMMIT_SHA"
          require_manifest publication_commit_sha "$PUBLICATION_COMMIT_SHA"
          require_manifest publication_tree_sha "$PUBLICATION_TREE_SHA"
          require_manifest version "$VERSION"
          require_manifest image_owner "$IMAGE_OWNER"
          require_manifest version_image_tag "$VERSION_IMAGE_TAG"
          require_manifest latest_image_tag "$LATEST_IMAGE_TAG"
          require_manifest version_label "$VERSION_LABEL"
          require_manifest revision_label "$REVISION_LABEL"
          require_manifest docker_context_commit_sha "$DOCKER_CONTEXT_COMMIT_SHA"
          require_manifest docker_context_tree_sha "$DOCKER_CONTEXT_TREE_SHA"
          require_manifest dockerfile_path "$DOCKERFILE_PATH"
          require_manifest cache_from "$CACHE_FROM"
          require_manifest cache_to "$CACHE_TO"
          require_manifest release_notes_sha256 "$RELEASE_NOTES_SHA256"
          require_manifest content_manifest_sha256 "$CONTENT_MANIFEST_SHA256"
          [ "$(wc -l < release-state/publication-manifest.env)" -eq 28 ] || exit 1
          ! grep -Ev '^[a-z_]+=[^[:cntrl:]]*$' release-state/publication-manifest.env || exit 1
          [ "$VALIDATION_CONCLUSION" = success ] || exit 1
          [ "$ORIGINATING_REPOSITORY" = "$GITHUB_REPOSITORY" ] || exit 1
          [ "$ORIGINATING_WORKFLOW_PATH" = .github/workflows/sync-upstream.yml ] || exit 1

          git init mutation
          git -C mutation bundle verify "$GITHUB_WORKSPACE/release-state/release.bundle"
          git -C mutation bundle unbundle "$GITHUB_WORKSPACE/release-state/release.bundle" >/dev/null
          for object in "$MIRROR_CANDIDATE_SHA^{commit}" "$REPLAY_COMMIT_SHA^{commit}" \
            "$PUBLICATION_COMMIT_SHA^{commit}"; do
            git -C mutation cat-file -e "$object"
          done
          git -C mutation update-ref refs/heads/candidate "$MIRROR_CANDIDATE_SHA"
          git -C mutation update-ref refs/heads/replay "$REPLAY_COMMIT_SHA"
          git -C mutation update-ref refs/heads/publication "$PUBLICATION_COMMIT_SHA"
          [ "$(git -C mutation rev-parse "$REPLAY_COMMIT_SHA^{tree}")" = "$REPLAY_TREE_SHA" ] || exit 1
          [ "$(git -C mutation rev-parse "$PUBLICATION_COMMIT_SHA^{tree}")" = "$PUBLICATION_TREE_SHA" ] || exit 1
          [ "$(git -C mutation rev-parse "$PUBLICATION_COMMIT_SHA^")" = "$REPLAY_COMMIT_SHA" ] || exit 1
          [ "$(git -C mutation rev-parse "$MIRROR_CANDIDATE_SHA^1")" = "$EXPECTED_MAIN_SHA" ] || exit 1
          workflow_install_sha="$(git -C mutation rev-parse "$MIRROR_CANDIDATE_SHA^2")"
          [ "$(git -C mutation show -s --format=%P "$MIRROR_CANDIDATE_SHA" | wc -w)" -eq 2 ] || exit 1
          [ "$(git -C mutation rev-parse "$workflow_install_sha^")" = "$UPSTREAM_SOURCE_SHA" ] || exit 1
          [ "$(git -C mutation rev-parse "$MIRROR_CANDIDATE_SHA^{tree}")" = \
            "$(git -C mutation rev-parse "$workflow_install_sha^{tree}")" ] || exit 1
          upstream_version="$(git -C mutation show "$REPLAY_COMMIT_SHA:backend/cmd/server/VERSION" | tr -d '[:space:]')"
          version_suffix="${VERSION#v${upstream_version}-patch.}"
          [ "$VERSION" = "v${upstream_version}-patch.${version_suffix}" ] || exit 1
          [[ "$version_suffix" =~ ^[0-9]+$ ]] || exit 1
          [ "$IMAGE_OWNER" = "$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" ] || exit 1
          [ "$DOCKER_CONTEXT_COMMIT_SHA" = "$PUBLICATION_COMMIT_SHA" ] || exit 1
          [ "$DOCKER_CONTEXT_TREE_SHA" = "$PUBLICATION_TREE_SHA" ] || exit 1
          [ "$DOCKERFILE_PATH" = Dockerfile ] || exit 1
          blocked='(^|[^A-Za-z0-9_])#[0-9]+|PR[[:space:]]*#[0-9]+|pull request[[:space:]]*#[0-9]+|issue[[:space:]]*#[0-9]+|/issues/[0-9]+|/pull/[0-9]+|github\.com/[^[:space:]]+/(issues|pull)/[0-9]+|(^|[^A-Za-z0-9_])@[A-Za-z0-9_-]+'
          git -C mutation diff-tree --no-commit-id --name-only -r \
            "$REPLAY_COMMIT_SHA" "$PUBLICATION_COMMIT_SHA" > publication-paths.txt
          [ -s publication-paths.txt ] || exit 1
          ! grep -Ev '^\.github/workflows/' publication-paths.txt || exit 1
          ! grep -E "$blocked" publication-paths.txt || exit 1
          ! grep -E "$blocked" release-state/release-notes.md || exit 1
          grep -Fxq "$VERSION" release-state/release-notes.md || exit 1
          grep -Fxq -- "- upstream_source_sha: $UPSTREAM_SOURCE_SHA" release-state/release-notes.md || exit 1
          grep -Fxq -- "- patchset_sha: $PATCHSET_SHA" release-state/release-notes.md || exit 1
          grep -Fxq -- "- replay_tree_sha: $REPLAY_TREE_SHA" release-state/release-notes.md || exit 1
          ! git -C mutation show -s --format=%B "$PUBLICATION_COMMIT_SHA" | grep -E "$blocked" || exit 1
          git -C mutation diff --check "$REPLAY_COMMIT_SHA" "$PUBLICATION_COMMIT_SHA"

      - name: Recheck identities and compare-and-swap preconditions
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          PATCHSET_SHA: ${{ needs.prepare-release.outputs.patchset_sha }}
          UPSTREAM_SOURCE_SHA: ${{ needs.prepare-release.outputs.upstream_source_sha }}
          MIRROR_CANDIDATE_SHA: ${{ needs.prepare-release.outputs.mirror_candidate_sha }}
          EXPECTED_MAIN_SHA: ${{ needs.prepare-release.outputs.expected_main_sha }}
          EXPECTED_MIRROR_SHA: ${{ needs.prepare-release.outputs.expected_mirror_sha }}
          EXPECTED_PATCHED_SHA: ${{ needs.prepare-release.outputs.expected_patched_sha }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          PUBLICATION_COMMIT_SHA: ${{ needs.prepare-release.outputs.publication_commit_sha }}
          ORIGINATING_REPOSITORY: ${{ needs.prepare-release.outputs.originating_repository }}
          ORIGINATING_WORKFLOW_PATH: ${{ needs.prepare-release.outputs.originating_workflow_path }}
          ORIGINATING_RUN_ID: ${{ needs.prepare-release.outputs.originating_run_id }}
          ORIGINATING_RUN_ATTEMPT: ${{ needs.prepare-release.outputs.originating_run_attempt }}
        run: |
          set -euo pipefail
          [ "$GITHUB_WORKFLOW" = "Sync upstream" ] || exit 1
          case "$WORKFLOW_REF" in
            "${GITHUB_REPOSITORY}/.github/workflows/sync-upstream.yml@"*) ;;
            *) exit 1 ;;
          esac
          [ "$ORIGINATING_REPOSITORY" = "$GITHUB_REPOSITORY" ] || exit 1
          [ "$ORIGINATING_WORKFLOW_PATH" = .github/workflows/sync-upstream.yml ] || exit 1
          [ "$ORIGINATING_RUN_ID" = "$GITHUB_RUN_ID" ] || exit 1
          [[ "$ORIGINATING_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || exit 1
          [ "$ORIGINATING_RUN_ATTEMPT" -le "$GITHUB_RUN_ATTEMPT" ] || exit 1
          [ "$PATCHSET_SHA" = "$GITHUB_SHA" ] || exit 1
          final_authority_window=true
          queried_upstream_sha="$(gh api \
            "repos/${UPSTREAM_REPOSITORY}/git/commits/${UPSTREAM_SOURCE_SHA}" --jq .sha)"
          [ "$queried_upstream_sha" = "$UPSTREAM_SOURCE_SHA" ] || {
            echo "upstream source identity query returned $queried_upstream_sha" >&2
            exit 1
          }
          downstream_url="https://github.com/${GITHUB_REPOSITORY}.git"
          git -C mutation remote add origin "$downstream_url"
          ! git -C mutation show-ref --verify --quiet "refs/tags/$VERSION" || exit 1

          current_main="$(git ls-remote "$downstream_url" refs/heads/main | awk '{print $1}')"
          current_mirror="$(git ls-remote "$downstream_url" refs/heads/mirror/upstream-main | awk '{print $1}')"
          current_patched="$(git ls-remote "$downstream_url" refs/heads/patched | awk '{print $1}')"
          require_expected_or_intended() {
            actual="$1"
            expected="$2"
            intended="$3"
            ref_name="$4"
            if [ "$actual" != "$expected" ] && [ "$actual" != "$intended" ]; then
              echo "$ref_name moved to an unauthorized state: $actual" >&2
              exit 1
            fi
          }
          require_expected_or_intended \
            "$current_main" "$EXPECTED_MAIN_SHA" "$MIRROR_CANDIDATE_SHA" main
          require_expected_or_intended \
            "$current_mirror" "$EXPECTED_MIRROR_SHA" "$MIRROR_CANDIDATE_SHA" mirror/upstream-main
          require_expected_or_intended \
            "$current_patched" "$EXPECTED_PATCHED_SHA" "$PUBLICATION_COMMIT_SHA" patched

          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > mutation/releases.json
          jq --arg version "$VERSION" \
            '[.[][] | select(.tag_name == $version)]' mutation/releases.json > \
            mutation/version-releases.json
          current_tag="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${VERSION}?per_page=100" \
            --jq ".[] | select(.ref == \"refs/tags/${VERSION}\") | .object.sha")"
          release_match_count="$(jq 'length' mutation/version-releases.json)"
          [ "$release_match_count" -le 1 ] || {
            echo "multiple releases use $VERSION" >&2
            exit 1
          }
          if [ "$release_match_count" -eq 1 ]; then
            jq -e --arg version "$VERSION" --arg target "$PUBLICATION_COMMIT_SHA" \
              --rawfile body release-state/release-notes.md \
              '.[0].tag_name == $version and .[0].name == $version and
               .[0].body == $body and .[0].target_commitish == $target and
               .[0].draft == false and .[0].prerelease == false' \
              mutation/version-releases.json >/dev/null || {
                echo "existing release conflicts with authorized publication" >&2
                exit 1
              }
          fi
          require_expected_or_intended "$current_tag" "" "$PUBLICATION_COMMIT_SHA" "tag $VERSION"
          current_patchset_sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/patchset" --jq .object.sha)"
          [ "$current_patchset_sha" = "$PATCHSET_SHA" ] || {
            echo "patchset moved before publication: $current_patchset_sha" >&2
            exit 1
          }
          [ "$current_patchset_sha" = "$GITHUB_SHA" ] || exit 1

      - name: Record immutable Git mutation authority
        id: git_authority
        env:
          RELEASE_ARTIFACT_NAME: ${{ needs.prepare-release.outputs.release_artifact_name }}
          RELEASE_ARTIFACT_ID: ${{ needs.prepare-release.outputs.release_artifact_id }}
          RELEASE_ARTIFACT_DIGEST: ${{ needs.prepare-release.outputs.release_artifact_digest }}
          PATCHSET_SHA: ${{ needs.prepare-release.outputs.patchset_sha }}
          UPSTREAM_SOURCE_SHA: ${{ needs.prepare-release.outputs.upstream_source_sha }}
          MIRROR_CANDIDATE_SHA: ${{ needs.prepare-release.outputs.mirror_candidate_sha }}
          EXPECTED_MAIN_SHA: ${{ needs.prepare-release.outputs.expected_main_sha }}
          EXPECTED_MIRROR_SHA: ${{ needs.prepare-release.outputs.expected_mirror_sha }}
          EXPECTED_PATCHED_SHA: ${{ needs.prepare-release.outputs.expected_patched_sha }}
          REPLAY_COMMIT_SHA: ${{ needs.prepare-release.outputs.replay_commit_sha }}
          REPLAY_TREE_SHA: ${{ needs.prepare-release.outputs.replay_tree_sha }}
          PUBLICATION_COMMIT_SHA: ${{ needs.prepare-release.outputs.publication_commit_sha }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          authority_name="git-mutation-authority-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir git-mutation-authority
          git -C mutation bundle create \
            "$GITHUB_WORKSPACE/git-mutation-authority/authorized-mutation.bundle" \
            refs/heads/candidate refs/heads/publication
          cp release-state/release-notes.md git-mutation-authority/release-notes.md
          cat > git-mutation-authority/authorization.env <<EOF
          release_artifact_name=${RELEASE_ARTIFACT_NAME}
          release_artifact_id=${RELEASE_ARTIFACT_ID}
          release_artifact_digest=${RELEASE_ARTIFACT_DIGEST}
          patchset_sha=${PATCHSET_SHA}
          upstream_source_sha=${UPSTREAM_SOURCE_SHA}
          mirror_candidate_sha=${MIRROR_CANDIDATE_SHA}
          expected_main_sha=${EXPECTED_MAIN_SHA}
          expected_mirror_sha=${EXPECTED_MIRROR_SHA}
          expected_patched_sha=${EXPECTED_PATCHED_SHA}
          replay_commit_sha=${REPLAY_COMMIT_SHA}
          replay_tree_sha=${REPLAY_TREE_SHA}
          publication_commit_sha=${PUBLICATION_COMMIT_SHA}
          version=${VERSION}
          EOF
          (cd git-mutation-authority && \
            sha256sum authorization.env authorized-mutation.bundle \
              release-notes.md > SHA256SUMS)
          echo "authority_artifact_name=$authority_name" >> "$GITHUB_OUTPUT"
          echo "release_artifact_name=$RELEASE_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "release_artifact_id=$RELEASE_ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "release_artifact_digest=$RELEASE_ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"
          echo "patchset_sha=$PATCHSET_SHA" >> "$GITHUB_OUTPUT"
          echo "upstream_source_sha=$UPSTREAM_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "mirror_candidate_sha=$MIRROR_CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "expected_main_sha=$EXPECTED_MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "expected_mirror_sha=$EXPECTED_MIRROR_SHA" >> "$GITHUB_OUTPUT"
          echo "expected_patched_sha=$EXPECTED_PATCHED_SHA" >> "$GITHUB_OUTPUT"
          echo "replay_commit_sha=$REPLAY_COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "replay_tree_sha=$REPLAY_TREE_SHA" >> "$GITHUB_OUTPUT"
          echo "publication_commit_sha=$PUBLICATION_COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload immutable Git mutation authority
        id: upload_git_authority
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.git_authority.outputs.authority_artifact_name }}
          path: git-mutation-authority
          if-no-files-found: error

  mutate-git:
    needs: authorize-git-mutation
    if: ${{ needs.authorize-git-mutation.result == 'success' }}
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ needs.authorize-git-mutation.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Download exact Git mutation authority
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.authorize-git-mutation.outputs.authority_artifact_id }}
          path: authority-download
          skip-decompress: true
          digest-mismatch: error

      - name: Materialize exact authorized Git mutation
        env:
          AUTHORITY_ARTIFACT_NAME: ${{ needs.authorize-git-mutation.outputs.authority_artifact_name }}
          AUTHORITY_ARTIFACT_ID: ${{ needs.authorize-git-mutation.outputs.authority_artifact_id }}
          AUTHORITY_ARTIFACT_DIGEST: ${{ needs.authorize-git-mutation.outputs.authority_artifact_digest }}
          RELEASE_ARTIFACT_NAME: ${{ needs.authorize-git-mutation.outputs.release_artifact_name }}
          RELEASE_ARTIFACT_ID: ${{ needs.authorize-git-mutation.outputs.release_artifact_id }}
          RELEASE_ARTIFACT_DIGEST: ${{ needs.authorize-git-mutation.outputs.release_artifact_digest }}
          PATCHSET_SHA: ${{ needs.authorize-git-mutation.outputs.patchset_sha }}
          UPSTREAM_SOURCE_SHA: ${{ needs.authorize-git-mutation.outputs.upstream_source_sha }}
          MIRROR_CANDIDATE_SHA: ${{ needs.authorize-git-mutation.outputs.mirror_candidate_sha }}
          EXPECTED_MAIN_SHA: ${{ needs.authorize-git-mutation.outputs.expected_main_sha }}
          EXPECTED_MIRROR_SHA: ${{ needs.authorize-git-mutation.outputs.expected_mirror_sha }}
          EXPECTED_PATCHED_SHA: ${{ needs.authorize-git-mutation.outputs.expected_patched_sha }}
          REPLAY_COMMIT_SHA: ${{ needs.authorize-git-mutation.outputs.replay_commit_sha }}
          REPLAY_TREE_SHA: ${{ needs.authorize-git-mutation.outputs.replay_tree_sha }}
          PUBLICATION_COMMIT_SHA: ${{ needs.authorize-git-mutation.outputs.publication_commit_sha }}
          VERSION: ${{ needs.authorize-git-mutation.outputs.version }}
        run: |
          set -euo pipefail
          suffix="${AUTHORITY_ARTIFACT_NAME#git-mutation-authority-}"
          authority_run="${suffix%-*}"
          authority_attempt="${suffix##*-}"
          [ "$AUTHORITY_ARTIFACT_NAME" = \
            "git-mutation-authority-${authority_run}-${authority_attempt}" ] || exit 1
          [ "$authority_run" = "$GITHUB_RUN_ID" ] || exit 1
          [[ "$authority_attempt" =~ ^[1-9][0-9]*$ ]] || exit 1
          [ "$authority_attempt" -le "$GITHUB_RUN_ATTEMPT" ] || exit 1
          [ "$authority_attempt" = "$GITHUB_RUN_ATTEMPT" ] || exit 1
          [[ "$AUTHORITY_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          archive_digest="${AUTHORITY_ARTIFACT_DIGEST#sha256:}"
          [[ "$archive_digest" =~ ^[0-9a-f]{64}$ ]] || exit 1
          mapfile -t archive_files < <(find authority-download -maxdepth 1 -type f -print)
          [ "${#archive_files[@]}" -eq 1 ] || exit 1
          [ "$(sha256sum "${archive_files[0]}" | awk '{print $1}')" = \
            "$archive_digest" ] || exit 1
          mkdir authorized
          unzip -q "${archive_files[0]}" -d authorized
          expected_files="$(printf '%s\n' SHA256SUMS authorization.env \
            authorized-mutation.bundle release-notes.md | sort)"
          actual_files="$(find authorized -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          [ "$actual_files" = "$expected_files" ] || exit 1
          (cd authorized && sha256sum -c SHA256SUMS)
          require_authority() {
            key="$1"
            expected="$2"
            [ "$(grep -F "${key}=" authorized/authorization.env | wc -l)" -eq 1 ] || exit 1
            grep -Fx "${key}=${expected}" authorized/authorization.env >/dev/null
          }
          require_authority patchset_sha "$PATCHSET_SHA"
          require_authority release_artifact_name "$RELEASE_ARTIFACT_NAME"
          require_authority release_artifact_id "$RELEASE_ARTIFACT_ID"
          require_authority release_artifact_digest "$RELEASE_ARTIFACT_DIGEST"
          require_authority upstream_source_sha "$UPSTREAM_SOURCE_SHA"
          require_authority mirror_candidate_sha "$MIRROR_CANDIDATE_SHA"
          require_authority expected_main_sha "$EXPECTED_MAIN_SHA"
          require_authority expected_mirror_sha "$EXPECTED_MIRROR_SHA"
          require_authority expected_patched_sha "$EXPECTED_PATCHED_SHA"
          require_authority replay_commit_sha "$REPLAY_COMMIT_SHA"
          require_authority replay_tree_sha "$REPLAY_TREE_SHA"
          require_authority publication_commit_sha "$PUBLICATION_COMMIT_SHA"
          require_authority version "$VERSION"
          [ "$(wc -l < authorized/authorization.env)" -eq 13 ] || exit 1
          ! grep -Ev '^[a-z_]+=[^[:cntrl:]]*$' authorized/authorization.env || exit 1
          git init mutation
          git -C mutation bundle verify \
            "$GITHUB_WORKSPACE/authorized/authorized-mutation.bundle"
          git -C mutation bundle unbundle \
            "$GITHUB_WORKSPACE/authorized/authorized-mutation.bundle" >/dev/null
          for object in "$MIRROR_CANDIDATE_SHA^{commit}" "$REPLAY_COMMIT_SHA^{commit}" \
            "$PUBLICATION_COMMIT_SHA^{commit}"; do
            git -C mutation cat-file -e "$object"
          done
          git -C mutation update-ref refs/heads/candidate "$MIRROR_CANDIDATE_SHA"
          git -C mutation update-ref refs/heads/replay "$REPLAY_COMMIT_SHA"
          git -C mutation update-ref refs/heads/publication "$PUBLICATION_COMMIT_SHA"
          git -C mutation remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Recheck all authorized identities immediately before mutation
        env:
          PATCHSET_SHA: ${{ needs.authorize-git-mutation.outputs.patchset_sha }}
          UPSTREAM_SOURCE_SHA: ${{ needs.authorize-git-mutation.outputs.upstream_source_sha }}
          MIRROR_CANDIDATE_SHA: ${{ needs.authorize-git-mutation.outputs.mirror_candidate_sha }}
          EXPECTED_MAIN_SHA: ${{ needs.authorize-git-mutation.outputs.expected_main_sha }}
          EXPECTED_MIRROR_SHA: ${{ needs.authorize-git-mutation.outputs.expected_mirror_sha }}
          EXPECTED_PATCHED_SHA: ${{ needs.authorize-git-mutation.outputs.expected_patched_sha }}
          REPLAY_COMMIT_SHA: ${{ needs.authorize-git-mutation.outputs.replay_commit_sha }}
          REPLAY_TREE_SHA: ${{ needs.authorize-git-mutation.outputs.replay_tree_sha }}
          PUBLICATION_COMMIT_SHA: ${{ needs.authorize-git-mutation.outputs.publication_commit_sha }}
          VERSION: ${{ needs.authorize-git-mutation.outputs.version }}
        run: |
          set -euo pipefail
          [ "$PATCHSET_SHA" = "$GITHUB_SHA" ] || exit 1
          api="https://api.github.com/repos"
          upstream_status="$(curl -sS -o mutation/final-upstream.json -w '%{http_code}' \
            "$api/${UPSTREAM_REPOSITORY}/git/commits/${UPSTREAM_SOURCE_SHA}")"
          [ "$upstream_status" = 200 ] || exit 1
          queried_upstream_sha="$(jq -er .sha mutation/final-upstream.json)"
          [ "$queried_upstream_sha" = "$UPSTREAM_SOURCE_SHA" ] || exit 1
          [ "$(git -C mutation rev-parse "$REPLAY_COMMIT_SHA^{tree}")" = \
            "$REPLAY_TREE_SHA" ] || exit 1
          [ "$(git -C mutation rev-parse "$PUBLICATION_COMMIT_SHA^")" = \
            "$REPLAY_COMMIT_SHA" ] || exit 1
          [ "$(git -C mutation rev-parse "$MIRROR_CANDIDATE_SHA^1")" = \
            "$EXPECTED_MAIN_SHA" ] || exit 1
          [ "$(git -C mutation show -s --format=%P "$MIRROR_CANDIDATE_SHA" | wc -w)" \
            -eq 2 ] || exit 1
          workflow_install_sha="$(git -C mutation rev-parse "$MIRROR_CANDIDATE_SHA^2")"
          [ "$(git -C mutation rev-parse "$workflow_install_sha^")" = \
            "$UPSTREAM_SOURCE_SHA" ] || exit 1
          [ "$(git -C mutation rev-parse "$MIRROR_CANDIDATE_SHA^{tree}")" = \
            "$(git -C mutation rev-parse "$workflow_install_sha^{tree}")" ] || exit 1

          current_main="$(git -C mutation ls-remote origin refs/heads/main | awk '{print $1}')"
          current_mirror="$(git -C mutation ls-remote \
            origin refs/heads/mirror/upstream-main | awk '{print $1}')"
          current_patched="$(git -C mutation ls-remote origin refs/heads/patched | awk '{print $1}')"
          current_tag="$(git -C mutation ls-remote \
            origin "refs/tags/$VERSION" | awk '{print $1}')"
          require_expected_or_intended() {
            actual="$1"
            expected="$2"
            intended="$3"
            ref_name="$4"
            if [ "$actual" != "$expected" ] && [ "$actual" != "$intended" ]; then
              echo "$ref_name moved to an unauthorized state: $actual" >&2
              exit 1
            fi
          }
          require_expected_or_intended \
            "$current_main" "$EXPECTED_MAIN_SHA" "$MIRROR_CANDIDATE_SHA" main
          require_expected_or_intended \
            "$current_mirror" "$EXPECTED_MIRROR_SHA" "$MIRROR_CANDIDATE_SHA" mirror/upstream-main
          require_expected_or_intended \
            "$current_patched" "$EXPECTED_PATCHED_SHA" "$PUBLICATION_COMMIT_SHA" patched
          require_expected_or_intended "$current_tag" "" "$PUBLICATION_COMMIT_SHA" "tag $VERSION"

          release_status="$(curl -sS -o mutation/final-release.json -w '%{http_code}' \
            "$api/${GITHUB_REPOSITORY}/releases/tags/${VERSION}")"
          if [ "$release_status" = 200 ]; then
            jq -e --arg version "$VERSION" --arg target "$PUBLICATION_COMMIT_SHA" \
              --rawfile body authorized/release-notes.md \
              '.tag_name == $version and .name == $version and
               .body == $body and .target_commitish == $target and
               .draft == false and .prerelease == false' \
              mutation/final-release.json >/dev/null
          elif [ "$release_status" != 404 ]; then
            echo "release lookup failed with HTTP $release_status" >&2
            exit 1
          fi
          current_patchset_sha="$(git -C mutation ls-remote \
            origin refs/heads/patchset | awk '{print $1}')"
          [ "$current_patchset_sha" = "$PATCHSET_SHA" ] || {
            echo "patchset moved before mutation: $current_patchset_sha" >&2
            exit 1
          }

      - name: Publish mirror candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MIRROR_CANDIDATE_SHA: ${{ needs.authorize-git-mutation.outputs.mirror_candidate_sha }}
          EXPECTED_MIRROR_SHA: ${{ needs.authorize-git-mutation.outputs.expected_mirror_sha }}
        working-directory: mutation
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(
            printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0
          )"
          current_mirror="$(git ls-remote origin refs/heads/mirror/upstream-main | awk '{print $1}')"
          if [ "$current_mirror" = "$MIRROR_CANDIDATE_SHA" ]; then
            exit 0
          fi
          [ "$current_mirror" = "$EXPECTED_MIRROR_SHA" ] || {
            echo "mirror/upstream-main moved to an unauthorized state: $current_mirror" >&2
            exit 1
          }
          git push origin "$MIRROR_CANDIDATE_SHA:refs/heads/mirror/upstream-main" \
            "--force-with-lease=refs/heads/mirror/upstream-main:${EXPECTED_MIRROR_SHA}"

      - name: Create or update internal sync request
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ needs.authorize-git-mutation.outputs.expected_main_sha }}
          MIRROR_CANDIDATE_SHA: ${{ needs.authorize-git-mutation.outputs.mirror_candidate_sha }}
          UPSTREAM_SOURCE_SHA: ${{ needs.authorize-git-mutation.outputs.upstream_source_sha }}
        run: |
          set -euo pipefail
          body="Internal sync request for validated upstream commit ${UPSTREAM_SOURCE_SHA}."
          title="sync upstream main"
          require_intended_mirror() {
            current_mirror="$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/heads/mirror/upstream-main" \
              --jq .object.sha)"
            [ "$current_mirror" = "$MIRROR_CANDIDATE_SHA" ] || {
              echo "mirror/upstream-main moved before sync request mutation: $current_mirror" >&2
              exit 1
            }
          }

          pr_number="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open \
            -f head="${GITHUB_REPOSITORY_OWNER}:mirror/upstream-main" \
            -f base=main \
            -f per_page=100 \
            --jq 'if length <= 1 then (.[0].number // "") else error("multiple sync requests") end')"
          if [ -z "$pr_number" ]; then
            current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
            if [ "$current_main" = "$MIRROR_CANDIDATE_SHA" ]; then
              closed_pr_number="$(gh api --paginate --slurp --method GET \
                "repos/${GITHUB_REPOSITORY}/pulls" \
                -f state=closed \
                -f head="${GITHUB_REPOSITORY_OWNER}:mirror/upstream-main" \
                -f base=main \
                -f per_page=100 | jq -er \
                --arg repository "$GITHUB_REPOSITORY" \
                --arg candidate "$MIRROR_CANDIDATE_SHA" \
                '[.[][] | select(
                  .state == "closed" and
                  .head.ref == "mirror/upstream-main" and
                  .head.repo.full_name == $repository and
                  .head.sha == $candidate and
                  .base.ref == "main" and
                  .base.repo.full_name == $repository
                )] | if length == 1 then .[0].number else error("missing or multiple completed sync requests") end')"
              require_intended_mirror
              printf '%s\n' "$closed_pr_number" > mutation/sync-pr-number
              exit 0
            fi
            [ "$current_main" = "$EXPECTED_MAIN_SHA" ] || {
              echo "main moved before sync request creation: $current_main" >&2
              exit 1
            }
            require_intended_mirror
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls" \
              -f title="$title" \
              -f head="mirror/upstream-main" \
              -f base="main" \
              -f body="$body" > mutation/sync-pr.json
          else
            gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" \
              > mutation/sync-pr.json
            jq -e --arg repository "$GITHUB_REPOSITORY" \
              --arg candidate "$MIRROR_CANDIDATE_SHA" \
              '(.state == "open") and
               (.head.ref == "mirror/upstream-main") and
               (.head.repo.full_name == $repository) and
               (.head.sha == $candidate) and
               (.base.ref == "main") and
               (.base.repo.full_name == $repository)' mutation/sync-pr.json >/dev/null
            require_intended_mirror
            printf '%s\n' "$pr_number" > mutation/sync-pr-number
            echo "Internal sync request #${pr_number} already exists; leaving its metadata unchanged."
            exit 0
          fi
          jq -e --arg repository "$GITHUB_REPOSITORY" \
            --arg candidate "$MIRROR_CANDIDATE_SHA" \
            '(.state == "open") and
             (.head.ref == "mirror/upstream-main") and
             (.head.repo.full_name == $repository) and
             (.head.sha == $candidate) and
             (.base.ref == "main") and
             (.base.repo.full_name == $repository)' mutation/sync-pr.json >/dev/null
          jq -er '.number' mutation/sync-pr.json > mutation/sync-pr-number

      - name: Promote validated candidate to main with compare-and-swap
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MIRROR_CANDIDATE_SHA: ${{ needs.authorize-git-mutation.outputs.mirror_candidate_sha }}
          EXPECTED_MAIN_SHA: ${{ needs.authorize-git-mutation.outputs.expected_main_sha }}
        working-directory: mutation
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(
            printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0
          )"
          current_mirror="$(git ls-remote origin refs/heads/mirror/upstream-main | awk '{print $1}')"
          [ "$current_mirror" = "$MIRROR_CANDIDATE_SHA" ] || {
            echo "mirror/upstream-main moved before main promotion: $current_mirror" >&2
            exit 1
          }
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$current_main" != "$EXPECTED_MAIN_SHA" ] && \
            [ "$current_main" != "$MIRROR_CANDIDATE_SHA" ]; then
            echo "main moved to an unauthorized state: $current_main" >&2
            exit 1
          fi
          if [ "$current_main" = "$MIRROR_CANDIDATE_SHA" ]; then
            echo "main already matches the authorized candidate; skipping promotion."
            exit 0
          fi
          git push --atomic origin \
            "$MIRROR_CANDIDATE_SHA:refs/heads/mirror/upstream-main" \
            "$MIRROR_CANDIDATE_SHA:refs/heads/main" \
            "--force-with-lease=refs/heads/mirror/upstream-main:${current_mirror}" \
            "--force-with-lease=refs/heads/main:${current_main}"

      - name: Publish patched branch and reserve tag atomically
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MIRROR_CANDIDATE_SHA: ${{ needs.authorize-git-mutation.outputs.mirror_candidate_sha }}
          EXPECTED_PATCHED_SHA: ${{ needs.authorize-git-mutation.outputs.expected_patched_sha }}
          PUBLICATION_COMMIT_SHA: ${{ needs.authorize-git-mutation.outputs.publication_commit_sha }}
          VERSION: ${{ needs.authorize-git-mutation.outputs.version }}
        working-directory: mutation
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(
            printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0
          )"
          current_mirror="$(git ls-remote origin refs/heads/mirror/upstream-main | awk '{print $1}')"
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          [ "$current_mirror" = "$MIRROR_CANDIDATE_SHA" ] || {
            echo "mirror/upstream-main moved before patched publication: $current_mirror" >&2
            exit 1
          }
          [ "$current_main" = "$MIRROR_CANDIDATE_SHA" ] || {
            echo "main moved before patched publication: $current_main" >&2
            exit 1
          }
          current_patched="$(git ls-remote origin refs/heads/patched | awk '{print $1}')"
          current_tag="$(git ls-remote origin "refs/tags/$VERSION" | awk '{print $1}')"
          if [ "$current_patched" != "$EXPECTED_PATCHED_SHA" ] && \
            [ "$current_patched" != "$PUBLICATION_COMMIT_SHA" ]; then
            echo "patched moved to an unauthorized state: $current_patched" >&2
            exit 1
          fi
          if [ -n "$current_tag" ] && [ "$current_tag" != "$PUBLICATION_COMMIT_SHA" ]; then
            echo "tag $VERSION points to an unauthorized state: $current_tag" >&2
            exit 1
          fi
          if [ "$current_patched" = "$PUBLICATION_COMMIT_SHA" ] && \
            [ "$current_tag" = "$PUBLICATION_COMMIT_SHA" ]; then
            echo "patched and $VERSION already match the authorized publication; skipping."
            exit 0
          fi

          git push --atomic origin \
            "$MIRROR_CANDIDATE_SHA:refs/heads/mirror/upstream-main" \
            "$MIRROR_CANDIDATE_SHA:refs/heads/main" \
            "$PUBLICATION_COMMIT_SHA:refs/heads/${PATCHED_BRANCH}" \
            "$PUBLICATION_COMMIT_SHA:refs/tags/$VERSION" \
            "--force-with-lease=refs/heads/mirror/upstream-main:${current_mirror}" \
            "--force-with-lease=refs/heads/main:${current_main}" \
            "--force-with-lease=refs/heads/patched:${current_patched}" \
            "--force-with-lease=refs/tags/${VERSION}:${current_tag}"

      - name: Verify published branch and reserved tag identities
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          MIRROR_CANDIDATE_SHA: ${{ needs.authorize-git-mutation.outputs.mirror_candidate_sha }}
          PUBLICATION_COMMIT_SHA: ${{ needs.authorize-git-mutation.outputs.publication_commit_sha }}
          VERSION: ${{ needs.authorize-git-mutation.outputs.version }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(
            printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0
          )"
          mirror_sha="$(git -C mutation ls-remote origin refs/heads/mirror/upstream-main | awk '{print $1}')"
          main_sha="$(git -C mutation ls-remote origin refs/heads/main | awk '{print $1}')"
          patched_sha="$(git -C mutation ls-remote origin refs/heads/patched | awk '{print $1}')"
          tag_sha="$(git -C mutation ls-remote origin "refs/tags/$VERSION" | awk '{print $1}')"
          [ "$mirror_sha" = "$MIRROR_CANDIDATE_SHA" ] || exit 1
          [ "$main_sha" = "$MIRROR_CANDIDATE_SHA" ] || exit 1
          [ "$patched_sha" = "$PUBLICATION_COMMIT_SHA" ] || exit 1
          [ "$tag_sha" = "$PUBLICATION_COMMIT_SHA" ] || exit 1
          pr_number="$(cat mutation/sync-pr-number)"
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]] || exit 1
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" > mutation/final-sync-pr.json
          jq -e --arg repository "$GITHUB_REPOSITORY" \
            --arg candidate "$MIRROR_CANDIDATE_SHA" \
            '((.state == "open") or (.state == "closed")) and
             (.head.ref == "mirror/upstream-main") and
             (.head.repo.full_name == $repository) and
             (.head.sha == $candidate) and
             (.base.ref == "main") and
             (.base.repo.full_name == $repository)' mutation/final-sync-pr.json >/dev/null

  prepare-image-authority:
    needs: prepare-release
    if: ${{ needs.prepare-release.result == 'success' }}
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      authority_artifact_name: ${{ needs.prepare-release.outputs.recovery_image_artifact_name || steps.image_authority.outputs.authority_artifact_name }}
      authority_artifact_id: ${{ needs.prepare-release.outputs.recovery_image_artifact_id || steps.upload_image_authority.outputs.artifact-id }}
      authority_artifact_digest: ${{ needs.prepare-release.outputs.recovery_image_artifact_digest || steps.upload_image_authority.outputs.artifact-digest }}
      authorized_image_digest: ${{ steps.image_authority.outputs.oci_root_digest }}
      authorized_image_media_type: ${{ steps.image_authority.outputs.oci_root_media_type }}
      authorized_image_size: ${{ steps.image_authority.outputs.oci_root_size }}
      oci_archive_sha256: ${{ steps.image_authority.outputs.oci_archive_sha256 }}
      oci_closure_sha256: ${{ steps.image_authority.outputs.oci_closure_sha256 }}
      oci_descriptor_count: ${{ steps.image_authority.outputs.oci_descriptor_count }}
      oci_blob_count: ${{ steps.image_authority.outputs.oci_blob_count }}
      expected_version_state: ${{ steps.image_authority.outputs.expected_version_state }}
      expected_latest_state: ${{ steps.image_authority.outputs.expected_latest_state }}
      expected_latest_manifest_sha256: ${{ steps.image_authority.outputs.expected_latest_manifest_sha256 }}
      expected_latest_version_label: ${{ steps.image_authority.outputs.expected_latest_version_label }}
      expected_latest_revision_label: ${{ steps.image_authority.outputs.expected_latest_revision_label }}
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Download exact verified release state by platform identity
        id: download_release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.prepare-release.outputs.release_artifact_id }}
          path: artifact-download
          skip-decompress: true
          digest-mismatch: error

      - name: Download exact recovered image authority by platform identity
        if: ${{ needs.prepare-release.outputs.recovery_image_artifact_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.prepare-release.outputs.recovery_image_artifact_id }}
          path: image-authority-download
          skip-decompress: true
          digest-mismatch: error

      - name: Verify exact archive, manifest, and publication content
        env:
          PATCHSET_SHA: ${{ needs.prepare-release.outputs.patchset_sha }}
          UPSTREAM_SOURCE_SHA: ${{ needs.prepare-release.outputs.upstream_source_sha }}
          MIRROR_CANDIDATE_SHA: ${{ needs.prepare-release.outputs.mirror_candidate_sha }}
          REPLAY_COMMIT_SHA: ${{ needs.prepare-release.outputs.replay_commit_sha }}
          REPLAY_TREE_SHA: ${{ needs.prepare-release.outputs.replay_tree_sha }}
          EXPECTED_MAIN_SHA: ${{ needs.prepare-release.outputs.expected_main_sha }}
          EXPECTED_MIRROR_SHA: ${{ needs.prepare-release.outputs.expected_mirror_sha }}
          EXPECTED_PATCHED_SHA: ${{ needs.prepare-release.outputs.expected_patched_sha }}
          VALIDATION_CONCLUSION: ${{ needs.prepare-release.outputs.validation_conclusion }}
          ORIGINATING_REPOSITORY: ${{ needs.prepare-release.outputs.originating_repository }}
          ORIGINATING_WORKFLOW_PATH: ${{ needs.prepare-release.outputs.originating_workflow_path }}
          ORIGINATING_RUN_ID: ${{ needs.prepare-release.outputs.originating_run_id }}
          ORIGINATING_RUN_ATTEMPT: ${{ needs.prepare-release.outputs.originating_run_attempt }}
          PUBLICATION_COMMIT_SHA: ${{ needs.prepare-release.outputs.publication_commit_sha }}
          PUBLICATION_TREE_SHA: ${{ needs.prepare-release.outputs.publication_tree_sha }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          IMAGE_OWNER: ${{ needs.prepare-release.outputs.image_owner }}
          VERSION_IMAGE_TAG: ${{ needs.prepare-release.outputs.version_image_tag }}
          LATEST_IMAGE_TAG: ${{ needs.prepare-release.outputs.latest_image_tag }}
          VERSION_LABEL: ${{ needs.prepare-release.outputs.version_label }}
          REVISION_LABEL: ${{ needs.prepare-release.outputs.revision_label }}
          DOCKER_CONTEXT_COMMIT_SHA: ${{ needs.prepare-release.outputs.docker_context_commit_sha }}
          DOCKER_CONTEXT_TREE_SHA: ${{ needs.prepare-release.outputs.docker_context_tree_sha }}
          DOCKERFILE_PATH: ${{ needs.prepare-release.outputs.dockerfile_path }}
          CACHE_FROM: ${{ needs.prepare-release.outputs.cache_from }}
          CACHE_TO: ${{ needs.prepare-release.outputs.cache_to }}
          RELEASE_NOTES_SHA256: ${{ needs.prepare-release.outputs.release_notes_sha256 }}
          CONTENT_MANIFEST_SHA256: ${{ needs.prepare-release.outputs.content_manifest_sha256 }}
          MANIFEST_SHA256: ${{ needs.prepare-release.outputs.manifest_sha256 }}
          RELEASE_ARTIFACT_NAME: ${{ needs.prepare-release.outputs.release_artifact_name }}
          RELEASE_ARTIFACT_ID: ${{ needs.prepare-release.outputs.release_artifact_id }}
          RELEASE_ARTIFACT_DIGEST: ${{ needs.prepare-release.outputs.release_artifact_digest }}
          RECOVERY_IMAGE_ARTIFACT_NAME: ${{ needs.prepare-release.outputs.recovery_image_artifact_name }}
          RECOVERY_IMAGE_ARTIFACT_ID: ${{ needs.prepare-release.outputs.recovery_image_artifact_id }}
          RECOVERY_IMAGE_ARTIFACT_DIGEST: ${{ needs.prepare-release.outputs.recovery_image_artifact_digest }}
          RECOVERED_IMAGE_DIGEST: ${{ needs.prepare-release.outputs.recovered_image_digest }}
        run: |
          set -euo pipefail
          suffix="${RELEASE_ARTIFACT_NAME#verified-release-state-}"
          producer_run="${suffix%-*}"
          producer_attempt="${suffix##*-}"
          [ "$RELEASE_ARTIFACT_NAME" = "verified-release-state-${producer_run}-${producer_attempt}" ] || exit 1
          [[ "$producer_run" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$producer_attempt" =~ ^[1-9][0-9]*$ ]] || exit 1
          [ "$producer_run" = "$GITHUB_RUN_ID" ] || exit 1
          [ "$producer_attempt" -le "$GITHUB_RUN_ATTEMPT" ] || exit 1
          [ "$ORIGINATING_RUN_ID" = "$GITHUB_RUN_ID" ] || exit 1
          [[ "$RELEASE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          archive_digest="${RELEASE_ARTIFACT_DIGEST#sha256:}"
          [[ "$archive_digest" =~ ^[0-9a-f]{64}$ ]] || exit 1
          mapfile -t archive_files < <(find artifact-download -maxdepth 1 -type f -print)
          [ "${#archive_files[@]}" -eq 1 ] || exit 1
          [ "$(sha256sum "${archive_files[0]}" | awk '{print $1}')" = "$archive_digest" ] || exit 1
          mkdir release-state
          unzip -q "${archive_files[0]}" -d release-state
          expected_payload_files="$(printf '%s\n' \
            MANIFEST.SHA256 SHA256SUMS content-manifest.sha256 \
            publication-context.tar publication-manifest.env release-notes.md release.bundle | sort)"
          actual_payload_files="$(find release-state -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          [ "$actual_payload_files" = "$expected_payload_files" ] || exit 1

          [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [[ "$CONTENT_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [[ "$RELEASE_NOTES_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          (cd release-state && sha256sum -c MANIFEST.SHA256)
          [ "$(sha256sum release-state/publication-manifest.env | awk '{print $1}')" = "$MANIFEST_SHA256" ] || exit 1
          [ "$(sha256sum release-state/content-manifest.sha256 | awk '{print $1}')" = \
            "$CONTENT_MANIFEST_SHA256" ] || exit 1
          (cd release-state && sha256sum -c content-manifest.sha256)
          [ "$(sha256sum release-state/release-notes.md | awk '{print $1}')" = \
            "$RELEASE_NOTES_SHA256" ] || exit 1

          require_manifest() {
            key="$1"
            expected="$2"
            [ "$(grep -F "${key}=" release-state/publication-manifest.env | wc -l)" -eq 1 ] || exit 1
            grep -Fx "${key}=${expected}" release-state/publication-manifest.env >/dev/null
          }
          require_manifest patchset_sha "$PATCHSET_SHA"
          require_manifest upstream_source_sha "$UPSTREAM_SOURCE_SHA"
          require_manifest mirror_candidate_sha "$MIRROR_CANDIDATE_SHA"
          require_manifest replay_tree_sha "$REPLAY_TREE_SHA"
          require_manifest expected_main_sha "$EXPECTED_MAIN_SHA"
          require_manifest expected_mirror_sha "$EXPECTED_MIRROR_SHA"
          require_manifest expected_patched_sha "$EXPECTED_PATCHED_SHA"
          require_manifest validation_conclusion "$VALIDATION_CONCLUSION"
          require_manifest originating_repository "$ORIGINATING_REPOSITORY"
          require_manifest originating_workflow_path "$ORIGINATING_WORKFLOW_PATH"
          require_manifest originating_run_id "$ORIGINATING_RUN_ID"
          require_manifest originating_run_attempt "$ORIGINATING_RUN_ATTEMPT"
          require_manifest replay_commit_sha "$REPLAY_COMMIT_SHA"
          require_manifest publication_commit_sha "$PUBLICATION_COMMIT_SHA"
          require_manifest publication_tree_sha "$PUBLICATION_TREE_SHA"
          require_manifest version "$VERSION"
          require_manifest image_owner "$IMAGE_OWNER"
          require_manifest version_image_tag "$VERSION_IMAGE_TAG"
          require_manifest latest_image_tag "$LATEST_IMAGE_TAG"
          require_manifest version_label "$VERSION_LABEL"
          require_manifest revision_label "$REVISION_LABEL"
          require_manifest docker_context_commit_sha "$DOCKER_CONTEXT_COMMIT_SHA"
          require_manifest docker_context_tree_sha "$DOCKER_CONTEXT_TREE_SHA"
          require_manifest dockerfile_path "$DOCKERFILE_PATH"
          require_manifest cache_from "$CACHE_FROM"
          require_manifest cache_to "$CACHE_TO"
          require_manifest release_notes_sha256 "$RELEASE_NOTES_SHA256"
          require_manifest content_manifest_sha256 "$CONTENT_MANIFEST_SHA256"
          [ "$(wc -l < release-state/publication-manifest.env)" -eq 28 ] || exit 1
          ! grep -Ev '^[a-z_]+=[^[:cntrl:]]*$' release-state/publication-manifest.env || exit 1
          [ "$VALIDATION_CONCLUSION" = success ] || exit 1
          [ "$ORIGINATING_REPOSITORY" = "$GITHUB_REPOSITORY" ] || exit 1
          [ "$ORIGINATING_WORKFLOW_PATH" = .github/workflows/sync-upstream.yml ] || exit 1
          [ "$DOCKER_CONTEXT_COMMIT_SHA" = "$PUBLICATION_COMMIT_SHA" ] || exit 1
          [ "$DOCKER_CONTEXT_TREE_SHA" = "$PUBLICATION_TREE_SHA" ] || exit 1
          [ "$DOCKERFILE_PATH" = Dockerfile ] || exit 1
          if [ -n "$RECOVERY_IMAGE_ARTIFACT_ID" ] || \
            [ -n "$RECOVERY_IMAGE_ARTIFACT_DIGEST" ] || \
            [ -n "$RECOVERY_IMAGE_ARTIFACT_NAME" ]; then
            [[ "$RECOVERY_IMAGE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
            image_archive_digest="${RECOVERY_IMAGE_ARTIFACT_DIGEST#sha256:}"
            [[ "$image_archive_digest" =~ ^[0-9a-f]{64}$ ]] || exit 1
            receipt_producer_attempt="${RECOVERY_IMAGE_ARTIFACT_NAME##*-}"
            [ "$RECOVERY_IMAGE_ARTIFACT_NAME" = \
              "image-publication-authority-${GITHUB_RUN_ID}-${receipt_producer_attempt}" ] || exit 1
            [[ "$receipt_producer_attempt" =~ ^[1-9][0-9]*$ ]] || exit 1
            [ "$receipt_producer_attempt" -le "$GITHUB_RUN_ATTEMPT" ] || exit 1
            mapfile -t image_archives < <(find image-authority-download -maxdepth 1 -type f -print)
            [ "${#image_archives[@]}" -eq 1 ] || exit 1
            [ "$(sha256sum "${image_archives[0]}" | awk '{print $1}')" = \
              "$image_archive_digest" ] || exit 1
            mkdir verified-image-authority
            unzip -q "${image_archives[0]}" -d verified-image-authority
            expected_receipt_files="$(printf '%s\n' IMAGE-MANIFEST.SHA256 \
              image-publication.env oci-closure.json release-image.oci.tar | sort)"
            actual_receipt_files="$(find verified-image-authority -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
            [ "$actual_receipt_files" = "$expected_receipt_files" ] || exit 1
            (cd verified-image-authority && sha256sum -c IMAGE-MANIFEST.SHA256)
            receipt=verified-image-authority/image-publication.env
            [ "$(wc -l < "$receipt")" -eq 37 ] || exit 1
            ! grep -Ev '^[a-z_]+=[^[:cntrl:]]*$' "$receipt" || exit 1
            receipt_field() {
              key="$1"
              [ "$(grep -F "${key}=" "$receipt" | wc -l)" -eq 1 ] || exit 1
              sed -n "s/^${key}=//p" "$receipt"
            }
            [ "$(receipt_field repository)" = "$GITHUB_REPOSITORY" ] || exit 1
            [ "$(receipt_field workflow_path)" = .github/workflows/sync-upstream.yml ] || exit 1
            [ "$(receipt_field run_id)" = "$GITHUB_RUN_ID" ] || exit 1
            [ "$(receipt_field run_attempt)" = "$receipt_producer_attempt" ] || exit 1
            [ "$(receipt_field release_artifact_id)" = "$RELEASE_ARTIFACT_ID" ] || exit 1
            [ "$(receipt_field release_artifact_digest)" = "$RELEASE_ARTIFACT_DIGEST" ] || exit 1
            [ "$(receipt_field manifest_sha256)" = "$MANIFEST_SHA256" ] || exit 1
            [ "$(receipt_field version)" = "$VERSION" ] || exit 1
            [ "$(receipt_field replay_commit_sha)" = "$REPLAY_COMMIT_SHA" ] || exit 1
            [ "$(receipt_field publication_commit_sha)" = "$PUBLICATION_COMMIT_SHA" ] || exit 1
            [ "$(receipt_field patchset_sha)" = "$PATCHSET_SHA" ] || exit 1
            [ "$(receipt_field upstream_source_sha)" = "$UPSTREAM_SOURCE_SHA" ] || exit 1
            [ "$(receipt_field mirror_candidate_sha)" = "$MIRROR_CANDIDATE_SHA" ] || exit 1
            [ "$(receipt_field replay_tree_sha)" = "$REPLAY_TREE_SHA" ] || exit 1
            [ "$(receipt_field publication_tree_sha)" = "$PUBLICATION_TREE_SHA" ] || exit 1
            [ "$(receipt_field version_image_tag)" = "$VERSION_IMAGE_TAG" ] || exit 1
            [ "$(receipt_field latest_image_tag)" = "$LATEST_IMAGE_TAG" ] || exit 1
            [ "$(receipt_field expected_version_state)" = missing ] || exit 1
            recovered_latest_state="$(receipt_field expected_latest_state)"
            case "$recovered_latest_state" in
              missing)
                [ -z "$(receipt_field expected_latest_manifest_sha256)" ] || exit 1
                [ -z "$(receipt_field expected_latest_version_label)" ] || exit 1
                [ -z "$(receipt_field expected_latest_revision_label)" ] || exit 1
                ;;
              present)
                [[ "$(receipt_field expected_latest_manifest_sha256)" =~ ^[0-9a-f]{64}$ ]] || exit 1
                [[ "$(receipt_field expected_latest_version_label)" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-patch\.[0-9]+$ ]] || exit 1
                [[ "$(receipt_field expected_latest_revision_label)" =~ ^[0-9a-f]{40}$ ]] || exit 1
                ;;
              *) exit 1 ;;
            esac
            [ "$(receipt_field runtime_platforms)" = linux/amd64 ] || exit 1
            [ "$(receipt_field build_provenance)" = false ] || exit 1
            [ "$(receipt_field build_sbom)" = false ] || exit 1
            [ "$(receipt_field oci_root_digest)" = "$RECOVERED_IMAGE_DIGEST" ] || exit 1
            [ "$(receipt_field oci_archive_sha256)" = \
              "$(sha256sum verified-image-authority/release-image.oci.tar | awk '{print $1}')" ] || exit 1
            [ "$(receipt_field oci_archive_size)" = \
              "$(stat -c %s verified-image-authority/release-image.oci.tar)" ] || exit 1
            [ "$(receipt_field oci_closure_sha256)" = \
              "$(sha256sum verified-image-authority/oci-closure.json | awk '{print $1}')" ] || exit 1
            [[ "$RECOVERED_IMAGE_DIGEST" =~ ^[0-9a-f]{64}$ ]] || exit 1
          else
            [ -z "$RECOVERED_IMAGE_DIGEST" ] || exit 1
          fi
          mkdir publication
          tar -xf release-state/publication-context.tar -C publication
          [ -f "publication/$DOCKERFILE_PATH" ] || exit 1

      - name: Prove publication state before image authorization
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ needs.prepare-release.outputs.expected_main_sha }}
          EXPECTED_MIRROR_SHA: ${{ needs.prepare-release.outputs.expected_mirror_sha }}
          EXPECTED_PATCHED_SHA: ${{ needs.prepare-release.outputs.expected_patched_sha }}
          MIRROR_CANDIDATE_SHA: ${{ needs.prepare-release.outputs.mirror_candidate_sha }}
          PUBLICATION_COMMIT_SHA: ${{ needs.prepare-release.outputs.publication_commit_sha }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          RECOVERY_IMAGE_ARTIFACT_ID: ${{ needs.prepare-release.outputs.recovery_image_artifact_id }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          read_ref() {
            endpoint="$1"
            output="$2"
            status="$(curl -sS -o "$output" -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$api/$endpoint")"
            case "$status" in
              200) jq -er .object.sha "$output" ;;
              404) printf '' ;;
              *) echo "reference lookup failed with HTTP $status: $endpoint" >&2; exit 1 ;;
            esac
          }
          main_sha="$(read_ref git/ref/heads/main preauth-main.json)"
          mirror_sha="$(read_ref git/ref/heads/mirror/upstream-main preauth-mirror.json)"
          patched_sha="$(read_ref git/ref/heads/patched preauth-patched.json)"
          tag_sha="$(read_ref "git/ref/tags/${VERSION}" preauth-tag.json)"
          if [ -z "$RECOVERY_IMAGE_ARTIFACT_ID" ]; then
            [ "$main_sha" = "$EXPECTED_MAIN_SHA" ] || exit 1
            [ "$mirror_sha" = "$EXPECTED_MIRROR_SHA" ] || exit 1
            [ "$patched_sha" = "$EXPECTED_PATCHED_SHA" ] || exit 1
            [ -z "$tag_sha" ] || exit 1
          else
            { [ "$main_sha" = "$EXPECTED_MAIN_SHA" ] || \
              [ "$main_sha" = "$MIRROR_CANDIDATE_SHA" ]; } || exit 1
            { [ "$mirror_sha" = "$EXPECTED_MIRROR_SHA" ] || \
              [ "$mirror_sha" = "$MIRROR_CANDIDATE_SHA" ]; } || exit 1
            { [ "$patched_sha" = "$EXPECTED_PATCHED_SHA" ] || \
              [ "$patched_sha" = "$PUBLICATION_COMMIT_SHA" ]; } || exit 1
            { [ -z "$tag_sha" ] || [ "$tag_sha" = "$PUBLICATION_COMMIT_SHA" ]; } || exit 1
          fi

      - name: Set up Docker Buildx for the sole release image build
        if: ${{ needs.prepare-release.outputs.recovery_image_artifact_id == '' }}
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Create image authority directory
        if: ${{ needs.prepare-release.outputs.recovery_image_artifact_id == '' }}
        run: mkdir image-publication-authority

      - name: Build exact release image into a local OCI archive
        if: ${{ needs.prepare-release.outputs.recovery_image_artifact_id == '' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: publication
          file: publication/Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          provenance: false
          sbom: false
          outputs: type=oci,dest=image-publication-authority/release-image.oci.tar
          labels: |
            ${{ needs.prepare-release.outputs.version_label }}
            ${{ needs.prepare-release.outputs.revision_label }}
          cache-from: ${{ needs.prepare-release.outputs.cache_from }}
          cache-to: ${{ needs.prepare-release.outputs.cache_to }}

      - name: Verify exact local OCI publication content
        id: local_image
        if: ${{ needs.prepare-release.outputs.recovery_image_artifact_id == '' }}
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          REPLAY_COMMIT_SHA: ${{ needs.prepare-release.outputs.replay_commit_sha }}
          PATCHSET_SHA: ${{ needs.prepare-release.outputs.patchset_sha }}
          UPSTREAM_SOURCE_SHA: ${{ needs.prepare-release.outputs.upstream_source_sha }}
          MIRROR_CANDIDATE_SHA: ${{ needs.prepare-release.outputs.mirror_candidate_sha }}
          REPLAY_TREE_SHA: ${{ needs.prepare-release.outputs.replay_tree_sha }}
          PUBLICATION_COMMIT_SHA: ${{ needs.prepare-release.outputs.publication_commit_sha }}
          PUBLICATION_TREE_SHA: ${{ needs.prepare-release.outputs.publication_tree_sha }}
        run: |
          set -euo pipefail
          archive=image-publication-authority/release-image.oci.tar
          python3 -c "$OCI_CLOSURE_VERIFIER" "$archive" authority-layout \
            image-publication-authority/oci-closure.json "$VERSION" "$REPLAY_COMMIT_SHA" \
            "$REPLAY_TREE_SHA" "$PUBLICATION_TREE_SHA" "$PATCHSET_SHA" \
            "$UPSTREAM_SOURCE_SHA" "$MIRROR_CANDIDATE_SHA" "$PUBLICATION_COMMIT_SHA"
          closure=image-publication-authority/oci-closure.json
          echo "oci_root_media_type=$(jq -er .root.mediaType "$closure")" >> "$GITHUB_OUTPUT"
          echo "oci_root_digest=$(jq -er '.root.digest | sub("^sha256:"; "")' "$closure")" >> "$GITHUB_OUTPUT"
          echo "oci_root_size=$(jq -er '.root.size | tostring' "$closure")" >> "$GITHUB_OUTPUT"
          echo "oci_archive_sha256=$(jq -er .layout.archive.sha256 "$closure")" >> "$GITHUB_OUTPUT"
          echo "oci_archive_size=$(jq -er '.layout.archive.size | tostring' "$closure")" >> "$GITHUB_OUTPUT"
          echo "oci_layout_sha256=$(jq -er .layout.ociLayout.sha256 "$closure")" >> "$GITHUB_OUTPUT"
          echo "oci_layout_size=$(jq -er '.layout.ociLayout.size | tostring' "$closure")" >> "$GITHUB_OUTPUT"
          echo "oci_index_sha256=$(jq -er .layout.index.sha256 "$closure")" >> "$GITHUB_OUTPUT"
          echo "oci_index_size=$(jq -er '.layout.index.size | tostring' "$closure")" >> "$GITHUB_OUTPUT"
          echo "oci_closure_sha256=$(sha256sum "$closure" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "oci_descriptor_count=$(jq -er '.blobs | length' "$closure")" >> "$GITHUB_OUTPUT"
          echo "oci_blob_count=$(jq -er '.blobs | length' "$closure")" >> "$GITHUB_OUTPUT"

      - name: Set up ORAS for authenticated pre-mutation reads
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4
        with:
          url: https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_linux_amd64.tar.gz
          checksum: 6cdc692f929100feb08aa8de584d02f7bcc30ec7d88bc2adc2054d782db57c64

      - name: Log in to private GHCR before fresh state authorization
        if: ${{ needs.prepare-release.outputs.recovery_image_artifact_id == '' }}
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Record immutable image publication authority
        if: ${{ needs.prepare-release.outputs.recovery_image_artifact_id == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT_ID: ${{ needs.prepare-release.outputs.release_artifact_id }}
          RELEASE_ARTIFACT_DIGEST: ${{ needs.prepare-release.outputs.release_artifact_digest }}
          MANIFEST_SHA256: ${{ needs.prepare-release.outputs.manifest_sha256 }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          REPLAY_COMMIT_SHA: ${{ needs.prepare-release.outputs.replay_commit_sha }}
          PATCHSET_SHA: ${{ needs.prepare-release.outputs.patchset_sha }}
          UPSTREAM_SOURCE_SHA: ${{ needs.prepare-release.outputs.upstream_source_sha }}
          MIRROR_CANDIDATE_SHA: ${{ needs.prepare-release.outputs.mirror_candidate_sha }}
          REPLAY_TREE_SHA: ${{ needs.prepare-release.outputs.replay_tree_sha }}
          PUBLICATION_COMMIT_SHA: ${{ needs.prepare-release.outputs.publication_commit_sha }}
          PUBLICATION_TREE_SHA: ${{ needs.prepare-release.outputs.publication_tree_sha }}
          VERSION_IMAGE_TAG: ${{ needs.prepare-release.outputs.version_image_tag }}
          LATEST_IMAGE_TAG: ${{ needs.prepare-release.outputs.latest_image_tag }}
          OCI_ROOT_MEDIA_TYPE: ${{ steps.local_image.outputs.oci_root_media_type }}
          OCI_ROOT_DIGEST: ${{ steps.local_image.outputs.oci_root_digest }}
          OCI_ROOT_SIZE: ${{ steps.local_image.outputs.oci_root_size }}
          OCI_ARCHIVE_SHA256: ${{ steps.local_image.outputs.oci_archive_sha256 }}
          OCI_ARCHIVE_SIZE: ${{ steps.local_image.outputs.oci_archive_size }}
          OCI_LAYOUT_SHA256: ${{ steps.local_image.outputs.oci_layout_sha256 }}
          OCI_LAYOUT_SIZE: ${{ steps.local_image.outputs.oci_layout_size }}
          OCI_INDEX_SHA256: ${{ steps.local_image.outputs.oci_index_sha256 }}
          OCI_INDEX_SIZE: ${{ steps.local_image.outputs.oci_index_size }}
          OCI_CLOSURE_SHA256: ${{ steps.local_image.outputs.oci_closure_sha256 }}
          OCI_DESCRIPTOR_COUNT: ${{ steps.local_image.outputs.oci_descriptor_count }}
          OCI_BLOB_COUNT: ${{ steps.local_image.outputs.oci_blob_count }}
        run: |
          set -euo pipefail
          inspect_baseline() {
            tag="$1"
            prefix="$2"
            if oras manifest fetch --descriptor "$tag" > "${prefix}.descriptor.json" \
              2> "${prefix}.err"; then
              descriptor_digest="$(jq -er \
                '.digest | select(test("^sha256:[0-9a-f]{64}$"))' \
                "${prefix}.descriptor.json")"
              descriptor_size="$(jq -er \
                '.size | select(type == "number" and . >= 0) | tostring' \
                "${prefix}.descriptor.json")"
              oras manifest fetch --output "${prefix}.raw" "$tag"
              [ "$(sha256sum "${prefix}.raw" | awk '{print "sha256:" $1}')" = \
                "$descriptor_digest" ] || exit 1
              [ "$(stat -c %s "${prefix}.raw")" = "$descriptor_size" ] || exit 1
              oras manifest fetch --platform linux/amd64 --output \
                "${prefix}.platform.raw" "$tag"
              config_digest="$(jq -er \
                '.config.digest | select(test("^sha256:[0-9a-f]{64}$"))' \
                "${prefix}.platform.raw")"
              config_size="$(jq -er \
                '.config.size | select(type == "number" and . >= 0) | tostring' \
                "${prefix}.platform.raw")"
              repository="${tag%:*}"
              oras blob fetch --output "${prefix}.json" \
                "${repository}@${config_digest}"
              [ "$(sha256sum "${prefix}.json" | awk '{print "sha256:" $1}')" = \
                "$config_digest" ] || exit 1
              [ "$(stat -c %s "${prefix}.json")" = "$config_size" ] || exit 1
              printf present
              return
            fi
            expected_error="Error response from registry: failed to find \"${tag}\": ${tag}: not found"
            if [ "$(wc -l < "${prefix}.err")" -eq 1 ] && \
              grep -Fx "$expected_error" "${prefix}.err" >/dev/null; then
              printf missing
              return
            fi
            cat "${prefix}.err" >&2
            exit 1
          }

          expected_version_state="$(inspect_baseline "$VERSION_IMAGE_TAG" authority-version)"
          [ "$expected_version_state" = missing ] || {
            echo "release image version tag already exists before mutation" >&2
            exit 1
          }
          expected_latest_state="$(inspect_baseline "$LATEST_IMAGE_TAG" authority-latest)"
          expected_latest_manifest_sha256=
          expected_latest_version_label=
          expected_latest_revision_label=
          if [ "$expected_latest_state" = present ]; then
            expected_latest_manifest_sha256="$(sha256sum authority-latest.raw | awk '{print $1}')"
            expected_latest_version_label="$(jq -er \
              '.config.Labels["org.opencontainers.image.version"]' authority-latest.json)"
            expected_latest_revision_label="$(jq -er \
              '.config.Labels["org.opencontainers.image.revision"]' authority-latest.json)"
            [[ "$expected_latest_version_label" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-patch\.[0-9]+$ ]] || exit 1
            [[ "$expected_latest_revision_label" =~ ^[0-9a-f]{40}$ ]] || exit 1
            tag_status="$(curl -sS -o authority-latest-tag.json -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${expected_latest_version_label}")"
            [ "$tag_status" = 200 ] || {
              echo "latest-patch version label has no exact downstream tag" >&2
              exit 1
            }
            latest_tag_commit="$(jq -er .object.sha authority-latest-tag.json)"
            release_status="$(curl -sS -o authority-latest-release.json -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${expected_latest_version_label}")"
            [ "$release_status" = 200 ] || {
              echo "latest-patch version label has no exact downstream release" >&2
              exit 1
            }
            jq -e --arg version "$expected_latest_version_label" \
              --arg target "$latest_tag_commit" \
              '.tag_name == $version and .target_commitish == $target and
               .draft == false and .prerelease == false' authority-latest-release.json >/dev/null
            commit_status="$(curl -sS -o authority-latest-commit.json -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${latest_tag_commit}")"
            [ "$commit_status" = 200 ] || exit 1
            latest_tag_parent="$(jq -er '.parents[0].sha' authority-latest-commit.json)"
            { [ "$expected_latest_revision_label" = "$latest_tag_commit" ] || \
              [ "$expected_latest_revision_label" = "$latest_tag_parent" ]; } || {
              echo "latest-patch revision does not match its release tag" >&2
              exit 1
            }
          fi

          cat > image-publication-authority/image-publication.env <<EOF
          repository=${GITHUB_REPOSITORY}
          workflow_path=.github/workflows/sync-upstream.yml
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          release_artifact_id=${RELEASE_ARTIFACT_ID}
          release_artifact_digest=${RELEASE_ARTIFACT_DIGEST}
          manifest_sha256=${MANIFEST_SHA256}
          version=${VERSION}
          replay_commit_sha=${REPLAY_COMMIT_SHA}
          publication_commit_sha=${PUBLICATION_COMMIT_SHA}
          patchset_sha=${PATCHSET_SHA}
          upstream_source_sha=${UPSTREAM_SOURCE_SHA}
          mirror_candidate_sha=${MIRROR_CANDIDATE_SHA}
          replay_tree_sha=${REPLAY_TREE_SHA}
          publication_tree_sha=${PUBLICATION_TREE_SHA}
          version_image_tag=${VERSION_IMAGE_TAG}
          latest_image_tag=${LATEST_IMAGE_TAG}
          expected_version_state=${expected_version_state}
          expected_latest_state=${expected_latest_state}
          expected_latest_manifest_sha256=${expected_latest_manifest_sha256}
          expected_latest_version_label=${expected_latest_version_label}
          expected_latest_revision_label=${expected_latest_revision_label}
          runtime_platforms=linux/amd64
          build_provenance=false
          build_sbom=false
          oci_root_media_type=${OCI_ROOT_MEDIA_TYPE}
          oci_root_digest=${OCI_ROOT_DIGEST}
          oci_root_size=${OCI_ROOT_SIZE}
          oci_archive_sha256=${OCI_ARCHIVE_SHA256}
          oci_archive_size=${OCI_ARCHIVE_SIZE}
          oci_layout_sha256=${OCI_LAYOUT_SHA256}
          oci_layout_size=${OCI_LAYOUT_SIZE}
          oci_index_sha256=${OCI_INDEX_SHA256}
          oci_index_size=${OCI_INDEX_SIZE}
          oci_closure_sha256=${OCI_CLOSURE_SHA256}
          oci_descriptor_count=${OCI_DESCRIPTOR_COUNT}
          oci_blob_count=${OCI_BLOB_COUNT}
          EOF
          (cd image-publication-authority && \
            sha256sum image-publication.env oci-closure.json \
              release-image.oci.tar > IMAGE-MANIFEST.SHA256)

      - name: Upload immutable image publication authority
        id: upload_image_authority
        if: ${{ needs.prepare-release.outputs.recovery_image_artifact_id == '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-publication-authority-${{ github.run_id }}-${{ github.run_attempt }}
          path: image-publication-authority
          compression-level: 0
          if-no-files-found: error

      - name: Redownload fresh authority by immutable artifact identity
        if: ${{ needs.prepare-release.outputs.recovery_image_artifact_id == '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.upload_image_authority.outputs.artifact-id }}
          path: authority-redownload
          skip-decompress: true
          digest-mismatch: error

      - name: Select and verify exact authorized OCI archive
        id: image_authority
        env:
          RECOVERY_AUTHORITY_NAME: ${{ needs.prepare-release.outputs.recovery_image_artifact_name }}
          RECOVERY_AUTHORITY_ID: ${{ needs.prepare-release.outputs.recovery_image_artifact_id }}
          RECOVERY_AUTHORITY_DIGEST: ${{ needs.prepare-release.outputs.recovery_image_artifact_digest }}
          FRESH_AUTHORITY_DIGEST: ${{ steps.upload_image_authority.outputs.artifact-digest }}
          RELEASE_ARTIFACT_ID: ${{ needs.prepare-release.outputs.release_artifact_id }}
          RELEASE_ARTIFACT_DIGEST: ${{ needs.prepare-release.outputs.release_artifact_digest }}
          MANIFEST_SHA256: ${{ needs.prepare-release.outputs.manifest_sha256 }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          REPLAY_COMMIT_SHA: ${{ needs.prepare-release.outputs.replay_commit_sha }}
          PATCHSET_SHA: ${{ needs.prepare-release.outputs.patchset_sha }}
          UPSTREAM_SOURCE_SHA: ${{ needs.prepare-release.outputs.upstream_source_sha }}
          MIRROR_CANDIDATE_SHA: ${{ needs.prepare-release.outputs.mirror_candidate_sha }}
          REPLAY_TREE_SHA: ${{ needs.prepare-release.outputs.replay_tree_sha }}
          PUBLICATION_COMMIT_SHA: ${{ needs.prepare-release.outputs.publication_commit_sha }}
          PUBLICATION_TREE_SHA: ${{ needs.prepare-release.outputs.publication_tree_sha }}
          VERSION_IMAGE_TAG: ${{ needs.prepare-release.outputs.version_image_tag }}
          LATEST_IMAGE_TAG: ${{ needs.prepare-release.outputs.latest_image_tag }}
        run: |
          set -euo pipefail
          if [ -n "$RECOVERY_AUTHORITY_ID" ]; then
            cp -a verified-image-authority authorized-image
            authority_attempt="${RECOVERY_AUTHORITY_NAME##*-}"
            [ "$RECOVERY_AUTHORITY_NAME" = \
              "image-publication-authority-${GITHUB_RUN_ID}-${authority_attempt}" ] || exit 1
          else
            mapfile -t archives < <(find authority-redownload -maxdepth 1 -type f -print)
            [ "${#archives[@]}" -eq 1 ] || exit 1
            [ "$(sha256sum "${archives[0]}" | awk '{print "sha256:" $1}')" = \
              "$FRESH_AUTHORITY_DIGEST" ] || exit 1
            mkdir authorized-image
            unzip -q "${archives[0]}" -d authorized-image
            authority_attempt="$GITHUB_RUN_ATTEMPT"
          fi
          expected_files="$(printf '%s\n' IMAGE-MANIFEST.SHA256 image-publication.env \
            oci-closure.json release-image.oci.tar | sort)"
          actual_files="$(find authorized-image -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          [ "$actual_files" = "$expected_files" ] || exit 1
          (cd authorized-image && sha256sum -c IMAGE-MANIFEST.SHA256)
          authority=authorized-image/image-publication.env
          [ "$(wc -l < "$authority")" -eq 37 ] || exit 1
          ! grep -Ev '^[a-z_]+=[^[:cntrl:]]*$' "$authority" || exit 1
          authority_field() {
            [ "$(grep -F "${1}=" "$authority" | wc -l)" -eq 1 ] || exit 1
            sed -n "s/^${1}=//p" "$authority"
          }
          [ "$(authority_field repository)" = "$GITHUB_REPOSITORY" ] || exit 1
          [ "$(authority_field workflow_path)" = .github/workflows/sync-upstream.yml ] || exit 1
          [ "$(authority_field run_id)" = "$GITHUB_RUN_ID" ] || exit 1
          [ "$(authority_field run_attempt)" = "$authority_attempt" ] || exit 1
          [ "$(authority_field release_artifact_id)" = "$RELEASE_ARTIFACT_ID" ] || exit 1
          [ "$(authority_field release_artifact_digest)" = "$RELEASE_ARTIFACT_DIGEST" ] || exit 1
          [ "$(authority_field manifest_sha256)" = "$MANIFEST_SHA256" ] || exit 1
          [ "$(authority_field version)" = "$VERSION" ] || exit 1
          [ "$(authority_field replay_commit_sha)" = "$REPLAY_COMMIT_SHA" ] || exit 1
          [ "$(authority_field publication_commit_sha)" = "$PUBLICATION_COMMIT_SHA" ] || exit 1
          [ "$(authority_field patchset_sha)" = "$PATCHSET_SHA" ] || exit 1
          [ "$(authority_field upstream_source_sha)" = "$UPSTREAM_SOURCE_SHA" ] || exit 1
          [ "$(authority_field mirror_candidate_sha)" = "$MIRROR_CANDIDATE_SHA" ] || exit 1
          [ "$(authority_field replay_tree_sha)" = "$REPLAY_TREE_SHA" ] || exit 1
          [ "$(authority_field publication_tree_sha)" = "$PUBLICATION_TREE_SHA" ] || exit 1
          [ "$(authority_field version_image_tag)" = "$VERSION_IMAGE_TAG" ] || exit 1
          [ "$(authority_field latest_image_tag)" = "$LATEST_IMAGE_TAG" ] || exit 1
          [ "$(authority_field expected_version_state)" = missing ] || exit 1
          expected_latest_state="$(authority_field expected_latest_state)"
          expected_latest_manifest_sha256="$(authority_field expected_latest_manifest_sha256)"
          expected_latest_version_label="$(authority_field expected_latest_version_label)"
          expected_latest_revision_label="$(authority_field expected_latest_revision_label)"
          case "$expected_latest_state" in
            missing)
              [ -z "$expected_latest_manifest_sha256" ] || exit 1
              [ -z "$expected_latest_version_label" ] || exit 1
              [ -z "$expected_latest_revision_label" ] || exit 1
              ;;
            present)
              [[ "$expected_latest_manifest_sha256" =~ ^[0-9a-f]{64}$ ]] || exit 1
              [[ "$expected_latest_version_label" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-patch\.[0-9]+$ ]] || exit 1
              [[ "$expected_latest_revision_label" =~ ^[0-9a-f]{40}$ ]] || exit 1
              ;;
            *) exit 1 ;;
          esac
          [ "$(authority_field runtime_platforms)" = linux/amd64 ] || exit 1
          [ "$(authority_field build_provenance)" = false ] || exit 1
          [ "$(authority_field build_sbom)" = false ] || exit 1
          [ "$(authority_field oci_archive_sha256)" = \
            "$(sha256sum authorized-image/release-image.oci.tar | awk '{print $1}')" ] || exit 1
          [ "$(authority_field oci_archive_size)" = \
            "$(stat -c %s authorized-image/release-image.oci.tar)" ] || exit 1
          rm -rf authorized-layout
          python3 -c "$OCI_CLOSURE_VERIFIER" authorized-image/release-image.oci.tar \
            authorized-layout regenerated-oci-closure.json "$VERSION" "$REPLAY_COMMIT_SHA" \
            "$REPLAY_TREE_SHA" "$PUBLICATION_TREE_SHA" "$PATCHSET_SHA" \
            "$UPSTREAM_SOURCE_SHA" "$MIRROR_CANDIDATE_SHA" "$PUBLICATION_COMMIT_SHA"
          cmp authorized-image/oci-closure.json regenerated-oci-closure.json
          [ "$(authority_field oci_closure_sha256)" = \
            "$(sha256sum regenerated-oci-closure.json | awk '{print $1}')" ] || exit 1
          [ "$(authority_field oci_root_media_type)" = \
            "$(jq -er .root.mediaType regenerated-oci-closure.json)" ] || exit 1
          descriptor_digest="$(jq -er '.root.digest | sub("^sha256:"; "")' regenerated-oci-closure.json)"
          [ "$descriptor_digest" = "$(authority_field oci_root_digest)" ] || exit 1
          [ "$(authority_field oci_root_size)" = \
            "$(jq -er '.root.size | tostring' regenerated-oci-closure.json)" ] || exit 1
          [ "$(authority_field oci_layout_sha256)" = \
            "$(jq -er .layout.ociLayout.sha256 regenerated-oci-closure.json)" ] || exit 1
          [ "$(authority_field oci_layout_size)" = \
            "$(jq -er '.layout.ociLayout.size | tostring' regenerated-oci-closure.json)" ] || exit 1
          [ "$(authority_field oci_index_sha256)" = \
            "$(jq -er .layout.index.sha256 regenerated-oci-closure.json)" ] || exit 1
          [ "$(authority_field oci_index_size)" = \
            "$(jq -er '.layout.index.size | tostring' regenerated-oci-closure.json)" ] || exit 1
          descriptor_count="$(jq -er '.blobs | length' regenerated-oci-closure.json)"
          [ "$(authority_field oci_descriptor_count)" = "$descriptor_count" ] || exit 1
          [ "$(authority_field oci_blob_count)" = "$descriptor_count" ] || exit 1
          if [ -n "$RECOVERY_AUTHORITY_ID" ]; then
            echo "authority_artifact_name=$RECOVERY_AUTHORITY_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "authority_artifact_name=image-publication-authority-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              >> "$GITHUB_OUTPUT"
          fi
          echo "oci_root_digest=$descriptor_digest" >> "$GITHUB_OUTPUT"
          echo "oci_root_media_type=$(authority_field oci_root_media_type)" >> "$GITHUB_OUTPUT"
          echo "oci_root_size=$(authority_field oci_root_size)" >> "$GITHUB_OUTPUT"
          echo "oci_archive_sha256=$(authority_field oci_archive_sha256)" >> "$GITHUB_OUTPUT"
          echo "oci_closure_sha256=$(authority_field oci_closure_sha256)" >> "$GITHUB_OUTPUT"
          echo "oci_descriptor_count=$descriptor_count" >> "$GITHUB_OUTPUT"
          echo "oci_blob_count=$descriptor_count" >> "$GITHUB_OUTPUT"
          echo "expected_version_state=missing" >> "$GITHUB_OUTPUT"
          echo "expected_latest_state=$expected_latest_state" >> "$GITHUB_OUTPUT"
          echo "expected_latest_manifest_sha256=$expected_latest_manifest_sha256" >> "$GITHUB_OUTPUT"
          echo "expected_latest_version_label=$expected_latest_version_label" >> "$GITHUB_OUTPUT"
          echo "expected_latest_revision_label=$expected_latest_revision_label" >> "$GITHUB_OUTPUT"

      - name: Log in to private GHCR before recovered state authorization
        if: ${{ needs.prepare-release.outputs.recovery_image_artifact_id != '' }}
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Verify authenticated registry state before mutation
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          REPLAY_COMMIT_SHA: ${{ needs.prepare-release.outputs.replay_commit_sha }}
          VERSION_IMAGE_TAG: ${{ needs.prepare-release.outputs.version_image_tag }}
          LATEST_IMAGE_TAG: ${{ needs.prepare-release.outputs.latest_image_tag }}
          AUTHORIZED_DIGEST: ${{ steps.image_authority.outputs.oci_root_digest }}
          EXPECTED_VERSION_STATE: ${{ steps.image_authority.outputs.expected_version_state }}
          EXPECTED_LATEST_STATE: ${{ steps.image_authority.outputs.expected_latest_state }}
          EXPECTED_LATEST_MANIFEST_SHA256: ${{ steps.image_authority.outputs.expected_latest_manifest_sha256 }}
          EXPECTED_LATEST_VERSION_LABEL: ${{ steps.image_authority.outputs.expected_latest_version_label }}
          EXPECTED_LATEST_REVISION_LABEL: ${{ steps.image_authority.outputs.expected_latest_revision_label }}
          RECOVERY_AUTHORITY_ID: ${{ needs.prepare-release.outputs.recovery_image_artifact_id }}
        run: |
          set -euo pipefail
          inspect_current() {
            tag="$1"
            prefix="$2"
            if oras manifest fetch --descriptor "$tag" > "${prefix}.descriptor.json" \
              2> "${prefix}.err"; then
              descriptor_digest="$(jq -er \
                '.digest | select(test("^sha256:[0-9a-f]{64}$"))' \
                "${prefix}.descriptor.json")"
              descriptor_size="$(jq -er \
                '.size | select(type == "number" and . >= 0) | tostring' \
                "${prefix}.descriptor.json")"
              oras manifest fetch --output "${prefix}.raw" "$tag"
              [ "$(sha256sum "${prefix}.raw" | awk '{print "sha256:" $1}')" = \
                "$descriptor_digest" ] || exit 1
              [ "$(stat -c %s "${prefix}.raw")" = "$descriptor_size" ] || exit 1
              oras manifest fetch --platform linux/amd64 --output \
                "${prefix}.platform.raw" "$tag"
              config_digest="$(jq -er \
                '.config.digest | select(test("^sha256:[0-9a-f]{64}$"))' \
                "${prefix}.platform.raw")"
              config_size="$(jq -er \
                '.config.size | select(type == "number" and . >= 0) | tostring' \
                "${prefix}.platform.raw")"
              repository="${tag%:*}"
              oras blob fetch --output "${prefix}.json" \
                "${repository}@${config_digest}"
              [ "$(sha256sum "${prefix}.json" | awk '{print "sha256:" $1}')" = \
                "$config_digest" ] || exit 1
              [ "$(stat -c %s "${prefix}.json")" = "$config_size" ] || exit 1
              digest="${descriptor_digest#sha256:}"
              version="$(jq -er '.config.Labels["org.opencontainers.image.version"]' \
                "${prefix}.json")"
              revision="$(jq -er '.config.Labels["org.opencontainers.image.revision"]' \
                "${prefix}.json")"
              if [ "$digest" = "$AUTHORIZED_DIGEST" ] && [ "$version" = "$VERSION" ] && \
                [ "$revision" = "$REPLAY_COMMIT_SHA" ]; then
                printf target
                return
              fi
              if [ "$prefix" = current-latest ] && [ "$EXPECTED_LATEST_STATE" = present ] && \
                [ "$digest" = "$EXPECTED_LATEST_MANIFEST_SHA256" ] && \
                [ "$version" = "$EXPECTED_LATEST_VERSION_LABEL" ] && \
                [ "$revision" = "$EXPECTED_LATEST_REVISION_LABEL" ]; then
                printf historical
                return
              fi
              echo "registry tag is outside the immutable authority: $tag" >&2
              exit 1
            fi
            expected_error="Error response from registry: failed to find \"${tag}\": ${tag}: not found"
            if [ "$(wc -l < "${prefix}.err")" -eq 1 ] && \
              grep -Fx "$expected_error" "${prefix}.err" >/dev/null; then
              printf missing
              return
            fi
            cat "${prefix}.err" >&2
            exit 1
          }

          [ "$EXPECTED_VERSION_STATE" = missing ] || exit 1
          version_state="$(inspect_current "$VERSION_IMAGE_TAG" current-version)"
          latest_state="$(inspect_current "$LATEST_IMAGE_TAG" current-latest)"
          if [ -z "$RECOVERY_AUTHORITY_ID" ]; then
            [ "$version_state" = missing ] || exit 1
          else
            case "$version_state" in missing|target) ;; *) exit 1 ;; esac
          fi
          case "$EXPECTED_LATEST_STATE:$latest_state" in
            missing:missing|missing:target|present:historical|present:target) ;;
            *) exit 1 ;;
          esac

  publish-image:
    needs: [prepare-release, prepare-image-authority, mutate-git]
    if: >-
      ${{ needs.prepare-release.result == 'success'
        && needs.prepare-image-authority.result == 'success'
        && needs.mutate-git.result == 'success' }}
    permissions:
      actions: read
      packages: write
    outputs:
      published_image_digest: ${{ steps.publish_image.outputs.published_image_digest }}
      authorized_image_digest: ${{ steps.publish_image.outputs.authorized_image_digest }}
      observed_version_digest: ${{ steps.publish_image.outputs.observed_version_digest }}
      observed_latest_digest: ${{ steps.publish_image.outputs.observed_latest_digest }}
      staging_state: ${{ steps.publish_image.outputs.staging_state }}
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Download exact pre-mutation image authority
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.prepare-image-authority.outputs.authority_artifact_id }}
          path: authority-download
          skip-decompress: true
          digest-mismatch: error

      - name: Verify exact pre-mutation image authority
        id: image_authority
        env:
          AUTHORITY_ARTIFACT_NAME: ${{ needs.prepare-image-authority.outputs.authority_artifact_name }}
          AUTHORITY_ARTIFACT_DIGEST: ${{ needs.prepare-image-authority.outputs.authority_artifact_digest }}
          AUTHORIZED_IMAGE_DIGEST: ${{ needs.prepare-image-authority.outputs.authorized_image_digest }}
          AUTHORIZED_IMAGE_MEDIA_TYPE: ${{ needs.prepare-image-authority.outputs.authorized_image_media_type }}
          AUTHORIZED_IMAGE_SIZE: ${{ needs.prepare-image-authority.outputs.authorized_image_size }}
          AUTHORIZED_ARCHIVE_SHA256: ${{ needs.prepare-image-authority.outputs.oci_archive_sha256 }}
          AUTHORIZED_CLOSURE_SHA256: ${{ needs.prepare-image-authority.outputs.oci_closure_sha256 }}
          AUTHORIZED_DESCRIPTOR_COUNT: ${{ needs.prepare-image-authority.outputs.oci_descriptor_count }}
          AUTHORIZED_BLOB_COUNT: ${{ needs.prepare-image-authority.outputs.oci_blob_count }}
          RELEASE_ARTIFACT_ID: ${{ needs.prepare-release.outputs.release_artifact_id }}
          RELEASE_ARTIFACT_DIGEST: ${{ needs.prepare-release.outputs.release_artifact_digest }}
          MANIFEST_SHA256: ${{ needs.prepare-release.outputs.manifest_sha256 }}
          REPLAY_COMMIT_SHA: ${{ needs.prepare-release.outputs.replay_commit_sha }}
          PATCHSET_SHA: ${{ needs.prepare-release.outputs.patchset_sha }}
          UPSTREAM_SOURCE_SHA: ${{ needs.prepare-release.outputs.upstream_source_sha }}
          MIRROR_CANDIDATE_SHA: ${{ needs.prepare-release.outputs.mirror_candidate_sha }}
          REPLAY_TREE_SHA: ${{ needs.prepare-release.outputs.replay_tree_sha }}
          PUBLICATION_COMMIT_SHA: ${{ needs.prepare-release.outputs.publication_commit_sha }}
          PUBLICATION_TREE_SHA: ${{ needs.prepare-release.outputs.publication_tree_sha }}
          VERSION_IMAGE_TAG: ${{ needs.prepare-release.outputs.version_image_tag }}
          LATEST_IMAGE_TAG: ${{ needs.prepare-release.outputs.latest_image_tag }}
          EXPECTED_VERSION_STATE: ${{ needs.prepare-image-authority.outputs.expected_version_state }}
          EXPECTED_LATEST_STATE: ${{ needs.prepare-image-authority.outputs.expected_latest_state }}
          EXPECTED_LATEST_MANIFEST_SHA256: ${{ needs.prepare-image-authority.outputs.expected_latest_manifest_sha256 }}
          EXPECTED_LATEST_VERSION_LABEL: ${{ needs.prepare-image-authority.outputs.expected_latest_version_label }}
          EXPECTED_LATEST_REVISION_LABEL: ${{ needs.prepare-image-authority.outputs.expected_latest_revision_label }}
        run: |
          set -euo pipefail
          suffix="${AUTHORITY_ARTIFACT_NAME#image-publication-authority-}"
          authority_run="${suffix%-*}"
          authority_attempt="${suffix##*-}"
          [ "$AUTHORITY_ARTIFACT_NAME" = \
            "image-publication-authority-${authority_run}-${authority_attempt}" ] || exit 1
          [ "$authority_run" = "$GITHUB_RUN_ID" ] || exit 1
          [[ "$authority_attempt" =~ ^[1-9][0-9]*$ ]] || exit 1
          [ "$authority_attempt" -le "$GITHUB_RUN_ATTEMPT" ] || exit 1
          [[ "$AUTHORITY_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          mapfile -t archives < <(find authority-download -maxdepth 1 -type f -print)
          [ "${#archives[@]}" -eq 1 ] || exit 1
          [ "$(sha256sum "${archives[0]}" | awk '{print "sha256:" $1}')" = \
            "$AUTHORITY_ARTIFACT_DIGEST" ] || exit 1
          mkdir authorized-image
          unzip -q "${archives[0]}" -d authorized-image
          expected_files="$(printf '%s\n' IMAGE-MANIFEST.SHA256 image-publication.env \
            oci-closure.json release-image.oci.tar | sort)"
          actual_files="$(find authorized-image -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          [ "$actual_files" = "$expected_files" ] || exit 1
          (cd authorized-image && sha256sum -c IMAGE-MANIFEST.SHA256)
          authority=authorized-image/image-publication.env
          [ "$(wc -l < "$authority")" -eq 37 ] || exit 1
          ! grep -Ev '^[a-z_]+=[^[:cntrl:]]*$' "$authority" || exit 1
          authority_field() {
            [ "$(grep -F "${1}=" "$authority" | wc -l)" -eq 1 ] || exit 1
            sed -n "s/^${1}=//p" "$authority"
          }
          [ "$(authority_field repository)" = "$GITHUB_REPOSITORY" ] || exit 1
          [ "$(authority_field workflow_path)" = .github/workflows/sync-upstream.yml ] || exit 1
          [ "$(authority_field run_id)" = "$GITHUB_RUN_ID" ] || exit 1
          [ "$(authority_field run_attempt)" = "$authority_attempt" ] || exit 1
          [ "$(authority_field release_artifact_id)" = "$RELEASE_ARTIFACT_ID" ] || exit 1
          [ "$(authority_field release_artifact_digest)" = "$RELEASE_ARTIFACT_DIGEST" ] || exit 1
          [ "$(authority_field manifest_sha256)" = "$MANIFEST_SHA256" ] || exit 1
          [ "$(authority_field version)" = "$VERSION" ] || exit 1
          [ "$(authority_field replay_commit_sha)" = "$REPLAY_COMMIT_SHA" ] || exit 1
          [ "$(authority_field publication_commit_sha)" = "$PUBLICATION_COMMIT_SHA" ] || exit 1
          [ "$(authority_field patchset_sha)" = "$PATCHSET_SHA" ] || exit 1
          [ "$(authority_field upstream_source_sha)" = "$UPSTREAM_SOURCE_SHA" ] || exit 1
          [ "$(authority_field mirror_candidate_sha)" = "$MIRROR_CANDIDATE_SHA" ] || exit 1
          [ "$(authority_field replay_tree_sha)" = "$REPLAY_TREE_SHA" ] || exit 1
          [ "$(authority_field publication_tree_sha)" = "$PUBLICATION_TREE_SHA" ] || exit 1
          [ "$(authority_field version_image_tag)" = "$VERSION_IMAGE_TAG" ] || exit 1
          [ "$(authority_field latest_image_tag)" = "$LATEST_IMAGE_TAG" ] || exit 1
          [ "$(authority_field expected_version_state)" = "$EXPECTED_VERSION_STATE" ] || exit 1
          [ "$(authority_field expected_latest_state)" = "$EXPECTED_LATEST_STATE" ] || exit 1
          [ "$(authority_field expected_latest_manifest_sha256)" = \
            "$EXPECTED_LATEST_MANIFEST_SHA256" ] || exit 1
          [ "$(authority_field expected_latest_version_label)" = \
            "$EXPECTED_LATEST_VERSION_LABEL" ] || exit 1
          [ "$(authority_field expected_latest_revision_label)" = \
            "$EXPECTED_LATEST_REVISION_LABEL" ] || exit 1
          [ "$(authority_field runtime_platforms)" = linux/amd64 ] || exit 1
          [ "$(authority_field build_provenance)" = false ] || exit 1
          [ "$(authority_field build_sbom)" = false ] || exit 1
          [ "$(authority_field oci_archive_sha256)" = \
            "$(sha256sum authorized-image/release-image.oci.tar | awk '{print $1}')" ] || exit 1
          [ "$(authority_field oci_archive_sha256)" = "$AUTHORIZED_ARCHIVE_SHA256" ] || exit 1
          [ "$(authority_field oci_archive_size)" = \
            "$(stat -c %s authorized-image/release-image.oci.tar)" ] || exit 1
          python3 -c "$OCI_CLOSURE_VERIFIER" authorized-image/release-image.oci.tar \
            authorized-layout regenerated-oci-closure.json "$VERSION" "$REPLAY_COMMIT_SHA" \
            "$REPLAY_TREE_SHA" "$PUBLICATION_TREE_SHA" "$PATCHSET_SHA" \
            "$UPSTREAM_SOURCE_SHA" "$MIRROR_CANDIDATE_SHA" "$PUBLICATION_COMMIT_SHA"
          cmp authorized-image/oci-closure.json regenerated-oci-closure.json
          [ "$(authority_field oci_closure_sha256)" = \
            "$(sha256sum regenerated-oci-closure.json | awk '{print $1}')" ] || exit 1
          [ "$(authority_field oci_closure_sha256)" = "$AUTHORIZED_CLOSURE_SHA256" ] || exit 1
          [ "$(authority_field oci_root_media_type)" = \
            "$(jq -er .root.mediaType regenerated-oci-closure.json)" ] || exit 1
          [ "$(authority_field oci_root_media_type)" = "$AUTHORIZED_IMAGE_MEDIA_TYPE" ] || exit 1
          descriptor_digest="$(jq -er '.root.digest | sub("^sha256:"; "")' regenerated-oci-closure.json)"
          [ "$descriptor_digest" = "$(authority_field oci_root_digest)" ] || exit 1
          [ "$descriptor_digest" = "$AUTHORIZED_IMAGE_DIGEST" ] || exit 1
          [ "$(authority_field oci_root_size)" = \
            "$(jq -er '.root.size | tostring' regenerated-oci-closure.json)" ] || exit 1
          [ "$(authority_field oci_root_size)" = "$AUTHORIZED_IMAGE_SIZE" ] || exit 1
          [ "$(authority_field oci_layout_sha256)" = \
            "$(jq -er .layout.ociLayout.sha256 regenerated-oci-closure.json)" ] || exit 1
          [ "$(authority_field oci_layout_size)" = \
            "$(jq -er '.layout.ociLayout.size | tostring' regenerated-oci-closure.json)" ] || exit 1
          [ "$(authority_field oci_index_sha256)" = \
            "$(jq -er .layout.index.sha256 regenerated-oci-closure.json)" ] || exit 1
          [ "$(authority_field oci_index_size)" = \
            "$(jq -er '.layout.index.size | tostring' regenerated-oci-closure.json)" ] || exit 1
          descriptor_count="$(jq -er '.blobs | length' regenerated-oci-closure.json)"
          [ "$(authority_field oci_descriptor_count)" = "$descriptor_count" ] || exit 1
          [ "$(authority_field oci_blob_count)" = "$descriptor_count" ] || exit 1
          [ "$descriptor_count" = "$AUTHORIZED_DESCRIPTOR_COUNT" ] || exit 1
          [ "$descriptor_count" = "$AUTHORIZED_BLOB_COUNT" ] || exit 1
          echo "oci_root_digest=$descriptor_digest" >> "$GITHUB_OUTPUT"

      - name: Set up ORAS for content-addressed publication
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4
        with:
          url: https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_linux_amd64.tar.gz
          checksum: 6cdc692f929100feb08aa8de584d02f7bcc30ec7d88bc2adc2054d782db57c64

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | oras login --username "$GITHUB_ACTOR" --password-stdin ghcr.io

      - name: Publish and read back the exact authorized image in order
        id: publish_image
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          REPLAY_COMMIT_SHA: ${{ needs.prepare-release.outputs.replay_commit_sha }}
          VERSION_IMAGE_TAG: ${{ needs.prepare-release.outputs.version_image_tag }}
          LATEST_IMAGE_TAG: ${{ needs.prepare-release.outputs.latest_image_tag }}
          EXPECTED_VERSION_STATE: ${{ needs.prepare-image-authority.outputs.expected_version_state }}
          EXPECTED_LATEST_STATE: ${{ needs.prepare-image-authority.outputs.expected_latest_state }}
          EXPECTED_LATEST_MANIFEST_SHA256: ${{ needs.prepare-image-authority.outputs.expected_latest_manifest_sha256 }}
          EXPECTED_LATEST_VERSION_LABEL: ${{ needs.prepare-image-authority.outputs.expected_latest_version_label }}
          EXPECTED_LATEST_REVISION_LABEL: ${{ needs.prepare-image-authority.outputs.expected_latest_revision_label }}
          AUTHORIZED_DIGEST: ${{ steps.image_authority.outputs.oci_root_digest }}
        run: |
          set -euo pipefail
          repository="${VERSION_IMAGE_TAG%:*}"
          root_media_type="$(jq -er .root.mediaType regenerated-oci-closure.json)"
          root_size="$(jq -er '.root.size | tostring' regenerated-oci-closure.json)"
          root_blob="authorized-layout/blobs/sha256/${AUTHORIZED_DIGEST}"

          probe_tag() {
            tag="$1"
            prefix="$2"
            if oras manifest fetch --descriptor "$tag" > "${prefix}.descriptor.json" \
              2> "${prefix}.err"; then
              digest="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$")) | sub("^sha256:"; "")' \
                "${prefix}.descriptor.json")"
              printf '%s' "$digest"
              return
            fi
            expected_error="Error response from registry: failed to find \"${tag}\": ${tag}: not found"
            if [ "$(wc -l < "${prefix}.err")" -eq 1 ] && \
              grep -Fx "$expected_error" "${prefix}.err" >/dev/null; then
              printf missing
              return
            fi
            cat "${prefix}.err" >&2
            exit 1
          }

          verify_reference() {
            tag="$1"
            prefix="$2"
            expected_digest="$3"
            expected_version="$4"
            expected_revision="$5"
            exact_authority="$6"
            oras manifest fetch --descriptor "$tag" > "${prefix}.descriptor.json"
            jq -e --arg digest "sha256:${expected_digest}" \
              '.digest == $digest and (.size | type == "number" and . >= 0) and
               (.mediaType | type == "string" and length > 0)' \
              "${prefix}.descriptor.json" >/dev/null
            oras manifest fetch --output "${prefix}.raw" "$tag"
            [ "$(sha256sum "${prefix}.raw" | awk '{print $1}')" = "$expected_digest" ] || exit 1
            [ "$(stat -c %s "${prefix}.raw")" = \
              "$(jq -er '.size | tostring' "${prefix}.descriptor.json")" ] || exit 1
            if [ "$exact_authority" = true ]; then
              [ "$(jq -er .mediaType "${prefix}.descriptor.json")" = "$root_media_type" ] || exit 1
              [ "$(jq -er '.size | tostring' "${prefix}.descriptor.json")" = "$root_size" ] || exit 1
              cmp "${prefix}.raw" "$root_blob"
            fi
            oras manifest fetch --platform linux/amd64 --output "${prefix}.platform.raw" "$tag"
            config_digest="$(jq -er '.config.digest | select(test("^sha256:[0-9a-f]{64}$"))' \
              "${prefix}.platform.raw")"
            config_size="$(jq -er '.config.size | select(type == "number" and . >= 0) | tostring' \
              "${prefix}.platform.raw")"
            oras blob fetch --output "${prefix}.config.json" "${repository}@${config_digest}"
            [ "$(sha256sum "${prefix}.config.json" | awk '{print "sha256:" $1}')" = \
              "$config_digest" ] || exit 1
            [ "$(stat -c %s "${prefix}.config.json")" = "$config_size" ] || exit 1
            jq -e --arg version "$expected_version" --arg revision "$expected_revision" \
              '.config.Labels["org.opencontainers.image.version"] == $version and
               .config.Labels["org.opencontainers.image.revision"] == $revision' \
              "${prefix}.config.json" >/dev/null
          }

          [ "$EXPECTED_VERSION_STATE" = missing ] || exit 1
          version_before="$(probe_tag "$VERSION_IMAGE_TAG" version-before)"
          case "$version_before" in
            missing)
              oras cp --from-oci-layout --no-tty \
                "authorized-layout@sha256:${AUTHORIZED_DIGEST}" "$VERSION_IMAGE_TAG"
              ;;
            "$AUTHORIZED_DIGEST") ;;
            *) echo "version tag conflicts with immutable authority" >&2; exit 1 ;;
          esac
          verify_reference "$VERSION_IMAGE_TAG" version-final "$AUTHORIZED_DIGEST" \
            "$VERSION" "$REPLAY_COMMIT_SHA" true

          latest_before="$(probe_tag "$LATEST_IMAGE_TAG" latest-before)"
          case "$EXPECTED_LATEST_STATE:$latest_before" in
            "missing:missing") ;;
            "missing:$AUTHORIZED_DIGEST") ;;
            "present:$EXPECTED_LATEST_MANIFEST_SHA256")
              verify_reference "$LATEST_IMAGE_TAG" latest-historical \
                "$EXPECTED_LATEST_MANIFEST_SHA256" "$EXPECTED_LATEST_VERSION_LABEL" \
                "$EXPECTED_LATEST_REVISION_LABEL" false
              ;;
            "present:$AUTHORIZED_DIGEST") ;;
            *) echo "latest-patch tag conflicts with immutable authority" >&2; exit 1 ;;
          esac
          if [ "$latest_before" != "$AUTHORIZED_DIGEST" ]; then
            oras cp --from-oci-layout --no-tty \
              "authorized-layout@sha256:${AUTHORIZED_DIGEST}" "$LATEST_IMAGE_TAG"
          fi
          verify_reference "$LATEST_IMAGE_TAG" latest-final "$AUTHORIZED_DIGEST" \
            "$VERSION" "$REPLAY_COMMIT_SHA" true
          cmp version-final.raw latest-final.raw
          echo "authorized_image_digest=$AUTHORIZED_DIGEST" >> "$GITHUB_OUTPUT"
          echo "observed_version_digest=$AUTHORIZED_DIGEST" >> "$GITHUB_OUTPUT"
          echo "observed_latest_digest=$AUTHORIZED_DIGEST" >> "$GITHUB_OUTPUT"
          echo "published_image_digest=$AUTHORIZED_DIGEST" >> "$GITHUB_OUTPUT"
          echo "staging_state=not-used" >> "$GITHUB_OUTPUT"

  create-release:
    needs: [prepare-release, prepare-image-authority, mutate-git, publish-image]
    if: >-
      ${{ needs.prepare-release.result == 'success'
        && needs.prepare-image-authority.result == 'success'
        && needs.mutate-git.result == 'success'
        && needs.publish-image.result == 'success' }}
    permissions:
      actions: read
      contents: write
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Download exact verified release state by platform identity
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare-release.outputs.release_artifact_id }}
          path: artifact-download
          skip-decompress: true
          digest-mismatch: error

      - name: Verify exact archive, manifest, and release inputs
        env:
          PATCHSET_SHA: ${{ needs.prepare-release.outputs.patchset_sha }}
          UPSTREAM_SOURCE_SHA: ${{ needs.prepare-release.outputs.upstream_source_sha }}
          MIRROR_CANDIDATE_SHA: ${{ needs.prepare-release.outputs.mirror_candidate_sha }}
          REPLAY_TREE_SHA: ${{ needs.prepare-release.outputs.replay_tree_sha }}
          EXPECTED_MAIN_SHA: ${{ needs.prepare-release.outputs.expected_main_sha }}
          EXPECTED_MIRROR_SHA: ${{ needs.prepare-release.outputs.expected_mirror_sha }}
          EXPECTED_PATCHED_SHA: ${{ needs.prepare-release.outputs.expected_patched_sha }}
          VALIDATION_CONCLUSION: ${{ needs.prepare-release.outputs.validation_conclusion }}
          ORIGINATING_REPOSITORY: ${{ needs.prepare-release.outputs.originating_repository }}
          ORIGINATING_WORKFLOW_PATH: ${{ needs.prepare-release.outputs.originating_workflow_path }}
          ORIGINATING_RUN_ID: ${{ needs.prepare-release.outputs.originating_run_id }}
          ORIGINATING_RUN_ATTEMPT: ${{ needs.prepare-release.outputs.originating_run_attempt }}
          REPLAY_COMMIT_SHA: ${{ needs.prepare-release.outputs.replay_commit_sha }}
          PUBLICATION_COMMIT_SHA: ${{ needs.prepare-release.outputs.publication_commit_sha }}
          PUBLICATION_TREE_SHA: ${{ needs.prepare-release.outputs.publication_tree_sha }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          IMAGE_OWNER: ${{ needs.prepare-release.outputs.image_owner }}
          VERSION_IMAGE_TAG: ${{ needs.prepare-release.outputs.version_image_tag }}
          LATEST_IMAGE_TAG: ${{ needs.prepare-release.outputs.latest_image_tag }}
          VERSION_LABEL: ${{ needs.prepare-release.outputs.version_label }}
          REVISION_LABEL: ${{ needs.prepare-release.outputs.revision_label }}
          DOCKER_CONTEXT_COMMIT_SHA: ${{ needs.prepare-release.outputs.docker_context_commit_sha }}
          DOCKER_CONTEXT_TREE_SHA: ${{ needs.prepare-release.outputs.docker_context_tree_sha }}
          DOCKERFILE_PATH: ${{ needs.prepare-release.outputs.dockerfile_path }}
          CACHE_FROM: ${{ needs.prepare-release.outputs.cache_from }}
          CACHE_TO: ${{ needs.prepare-release.outputs.cache_to }}
          RELEASE_NOTES_SHA256: ${{ needs.prepare-release.outputs.release_notes_sha256 }}
          CONTENT_MANIFEST_SHA256: ${{ needs.prepare-release.outputs.content_manifest_sha256 }}
          RELEASE_ARTIFACT_NAME: ${{ needs.prepare-release.outputs.release_artifact_name }}
          RELEASE_ARTIFACT_ID: ${{ needs.prepare-release.outputs.release_artifact_id }}
          RELEASE_ARTIFACT_DIGEST: ${{ needs.prepare-release.outputs.release_artifact_digest }}
          MANIFEST_SHA256: ${{ needs.prepare-release.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          suffix="${RELEASE_ARTIFACT_NAME#verified-release-state-}"
          producer_run="${suffix%-*}"
          producer_attempt="${suffix##*-}"
          [ "$RELEASE_ARTIFACT_NAME" = "verified-release-state-${producer_run}-${producer_attempt}" ] || exit 1
          [[ "$producer_run" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$producer_attempt" =~ ^[1-9][0-9]*$ ]] || exit 1
          [ "$producer_run" = "$GITHUB_RUN_ID" ] || exit 1
          [ "$producer_attempt" -le "$GITHUB_RUN_ATTEMPT" ] || exit 1
          [ "$ORIGINATING_RUN_ID" = "$GITHUB_RUN_ID" ] || exit 1
          [[ "$RELEASE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          archive_digest="${RELEASE_ARTIFACT_DIGEST#sha256:}"
          [[ "$archive_digest" =~ ^[0-9a-f]{64}$ ]] || exit 1
          mapfile -t archive_files < <(find artifact-download -maxdepth 1 -type f -print)
          [ "${#archive_files[@]}" -eq 1 ] || exit 1
          [ "$(sha256sum "${archive_files[0]}" | awk '{print $1}')" = "$archive_digest" ] || exit 1
          mkdir release-state
          unzip -q "${archive_files[0]}" -d release-state
          expected_payload_files="$(printf '%s\n' \
            MANIFEST.SHA256 SHA256SUMS content-manifest.sha256 \
            publication-context.tar publication-manifest.env release-notes.md release.bundle | sort)"
          actual_payload_files="$(find release-state -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          [ "$actual_payload_files" = "$expected_payload_files" ] || exit 1
          [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [[ "$CONTENT_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [[ "$RELEASE_NOTES_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          (cd release-state && sha256sum -c MANIFEST.SHA256)
          [ "$(sha256sum release-state/publication-manifest.env | awk '{print $1}')" = \
            "$MANIFEST_SHA256" ] || exit 1
          [ "$(sha256sum release-state/content-manifest.sha256 | awk '{print $1}')" = \
            "$CONTENT_MANIFEST_SHA256" ] || exit 1
          (cd release-state && sha256sum -c content-manifest.sha256)
          [ "$(sha256sum release-state/release-notes.md | awk '{print $1}')" = \
            "$RELEASE_NOTES_SHA256" ] || exit 1

          require_manifest() {
            key="$1"
            expected="$2"
            [ "$(grep -F "${key}=" release-state/publication-manifest.env | wc -l)" -eq 1 ] || exit 1
            grep -Fx "${key}=${expected}" release-state/publication-manifest.env >/dev/null
          }
          require_manifest patchset_sha "$PATCHSET_SHA"
          require_manifest upstream_source_sha "$UPSTREAM_SOURCE_SHA"
          require_manifest mirror_candidate_sha "$MIRROR_CANDIDATE_SHA"
          require_manifest replay_tree_sha "$REPLAY_TREE_SHA"
          require_manifest expected_main_sha "$EXPECTED_MAIN_SHA"
          require_manifest expected_mirror_sha "$EXPECTED_MIRROR_SHA"
          require_manifest expected_patched_sha "$EXPECTED_PATCHED_SHA"
          require_manifest validation_conclusion "$VALIDATION_CONCLUSION"
          require_manifest originating_repository "$ORIGINATING_REPOSITORY"
          require_manifest originating_workflow_path "$ORIGINATING_WORKFLOW_PATH"
          require_manifest originating_run_id "$ORIGINATING_RUN_ID"
          require_manifest originating_run_attempt "$ORIGINATING_RUN_ATTEMPT"
          require_manifest replay_commit_sha "$REPLAY_COMMIT_SHA"
          require_manifest publication_commit_sha "$PUBLICATION_COMMIT_SHA"
          require_manifest publication_tree_sha "$PUBLICATION_TREE_SHA"
          require_manifest version "$VERSION"
          require_manifest image_owner "$IMAGE_OWNER"
          require_manifest version_image_tag "$VERSION_IMAGE_TAG"
          require_manifest latest_image_tag "$LATEST_IMAGE_TAG"
          require_manifest version_label "$VERSION_LABEL"
          require_manifest revision_label "$REVISION_LABEL"
          require_manifest docker_context_commit_sha "$DOCKER_CONTEXT_COMMIT_SHA"
          require_manifest docker_context_tree_sha "$DOCKER_CONTEXT_TREE_SHA"
          require_manifest dockerfile_path "$DOCKERFILE_PATH"
          require_manifest cache_from "$CACHE_FROM"
          require_manifest cache_to "$CACHE_TO"
          require_manifest release_notes_sha256 "$RELEASE_NOTES_SHA256"
          require_manifest content_manifest_sha256 "$CONTENT_MANIFEST_SHA256"
          [ "$(wc -l < release-state/publication-manifest.env)" -eq 28 ] || exit 1
          ! grep -Ev '^[a-z_]+=[^[:cntrl:]]*$' release-state/publication-manifest.env || exit 1

      - name: Authorize exact GitHub release output
        id: release_authority
        env:
          PUBLICATION_COMMIT_SHA: ${{ needs.prepare-release.outputs.publication_commit_sha }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          PUBLISHED_IMAGE_DIGEST: ${{ needs.publish-image.outputs.published_image_digest }}
          AUTHORIZED_IMAGE_DIGEST: ${{ needs.prepare-image-authority.outputs.authorized_image_digest }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          patched_sha="$(curl -fsSL "$api/git/ref/heads/patched" | jq -er .object.sha)"
          tag_sha="$(curl -fsSL "$api/git/ref/tags/${VERSION}" | jq -er .object.sha)"
          [ "$patched_sha" = "$PUBLICATION_COMMIT_SHA" ] || exit 1
          [ "$tag_sha" = "$PUBLICATION_COMMIT_SHA" ] || exit 1
          [[ "$PUBLISHED_IMAGE_DIGEST" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [[ "$AUTHORIZED_IMAGE_DIGEST" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [ "$PUBLISHED_IMAGE_DIGEST" = "$AUTHORIZED_IMAGE_DIGEST" ] || {
            echo "published image digest differs from pre-mutation authority" >&2
            exit 1
          }

          release_status="$(curl -sS -o existing-release.json -w '%{http_code}' \
            "$api/releases/tags/${VERSION}")"
          if [ "$release_status" = 200 ]; then
            jq -e --arg version "$VERSION" --arg target "$PUBLICATION_COMMIT_SHA" \
              --rawfile body release-state/release-notes.md \
              '.tag_name == $version and .name == $version and .body == $body and
               .target_commitish == $target and
               .draft == false and .prerelease == false' \
              existing-release.json >/dev/null || {
                echo "existing release does not match authorized publication evidence" >&2
                exit 1
              }
            mode=skip
          elif [ "$release_status" = 404 ]; then
            mode=create
          else
            echo "release lookup failed with HTTP $release_status" >&2
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Create exact authorized GitHub release
        if: ${{ steps.release_authority.outputs.mode == 'create' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          PUBLICATION_COMMIT_SHA: ${{ needs.prepare-release.outputs.publication_commit_sha }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --target "$PUBLICATION_COMMIT_SHA" \
            --notes-file release-state/release-notes.md

      - name: Verify exact GitHub release read-back
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          PUBLICATION_COMMIT_SHA: ${{ needs.prepare-release.outputs.publication_commit_sha }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          status="$(curl -sS -o final-release.json -w '%{http_code}' \
            "$api/releases/tags/${VERSION}")"
          [ "$status" = 200 ] || {
            echo "release read-back failed with HTTP $status" >&2
            exit 1
          }
          jq -e --arg version "$VERSION" --arg target "$PUBLICATION_COMMIT_SHA" \
            --rawfile body release-state/release-notes.md \
            '.tag_name == $version and .name == $version and .body == $body and
             .target_commitish == $target and .draft == false and .prerelease == false' \
            final-release.json >/dev/null || {
              echo "release read-back differs from authorized publication" >&2
              exit 1
            }

  report-publication-outcome:
    needs: [prepare-release, prepare-image-authority, authorize-git-mutation, mutate-git, publish-image, create-release]
    if: ${{ always() }}
    permissions:
      actions: read
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - name: Download prepared notes for outcome classification
        if: ${{ needs.prepare-release.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.prepare-release.outputs.release_artifact_id }}
          path: reporter-release-state
          digest-mismatch: error

      - name: Independently resolve image publication authority
        id: reporter_authority
        if: ${{ always() && needs.prepare-release.result == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT_ID: ${{ needs.prepare-release.outputs.release_artifact_id }}
          RELEASE_ARTIFACT_DIGEST: ${{ needs.prepare-release.outputs.release_artifact_digest }}
          MANIFEST_SHA256: ${{ needs.prepare-release.outputs.manifest_sha256 }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          REPLAY_COMMIT_SHA: ${{ needs.prepare-release.outputs.replay_commit_sha }}
          PATCHSET_SHA: ${{ needs.prepare-release.outputs.patchset_sha }}
          UPSTREAM_SOURCE_SHA: ${{ needs.prepare-release.outputs.upstream_source_sha }}
          MIRROR_CANDIDATE_SHA: ${{ needs.prepare-release.outputs.mirror_candidate_sha }}
          REPLAY_TREE_SHA: ${{ needs.prepare-release.outputs.replay_tree_sha }}
          PUBLICATION_COMMIT_SHA: ${{ needs.prepare-release.outputs.publication_commit_sha }}
          PUBLICATION_TREE_SHA: ${{ needs.prepare-release.outputs.publication_tree_sha }}
          VERSION_IMAGE_TAG: ${{ needs.prepare-release.outputs.version_image_tag }}
          LATEST_IMAGE_TAG: ${{ needs.prepare-release.outputs.latest_image_tag }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            > reporter-artifact-pages.json
          jq '[.[].artifacts[]]' reporter-artifact-pages.json > reporter-artifacts.json
          attempt="$(jq -r --arg run "$GITHUB_RUN_ID" --argjson current "$GITHUB_RUN_ATTEMPT" '
            [.[] | select(.expired == false) | .name
             | capture("^image-publication-authority-(?<run>[1-9][0-9]*)-(?<attempt>[1-9][0-9]*)$")
             | select(.run == $run and (.attempt | tonumber) <= $current)
             | .attempt | tonumber] | if length > 0 then max else empty end' reporter-artifacts.json)"
          [ -n "$attempt" ] || exit 1
          name="image-publication-authority-${GITHUB_RUN_ID}-${attempt}"
          [ "$(jq --arg name "$name" '[.[] | select(.name == $name and .expired == false)] | length' \
            reporter-artifacts.json)" -eq 1 ] || exit 1
          artifact_id="$(jq -er --arg name "$name" \
            '.[] | select(.name == $name and .expired == false) | .id' reporter-artifacts.json)"
          artifact_digest="$(jq -er --arg name "$name" \
            '.[] | select(.name == $name and .expired == false) | .digest' reporter-artifacts.json)"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > reporter-authority.zip
          [ "$(sha256sum reporter-authority.zip | awk '{print "sha256:" $1}')" = \
            "$artifact_digest" ] || exit 1
          mkdir reporter-authority
          unzip -q reporter-authority.zip -d reporter-authority
          expected="$(printf '%s\n' IMAGE-MANIFEST.SHA256 image-publication.env \
            oci-closure.json release-image.oci.tar | sort)"
          actual="$(find reporter-authority -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          [ "$actual" = "$expected" ] || exit 1
          (cd reporter-authority && sha256sum -c IMAGE-MANIFEST.SHA256)
          authority=reporter-authority/image-publication.env
          [ "$(wc -l < "$authority")" -eq 37 ] || exit 1
          authority_field() {
            [ "$(grep -F "${1}=" "$authority" | wc -l)" -eq 1 ] || exit 1
            sed -n "s/^${1}=//p" "$authority"
          }
          [ "$(authority_field repository)" = "$GITHUB_REPOSITORY" ] || exit 1
          [ "$(authority_field workflow_path)" = .github/workflows/sync-upstream.yml ] || exit 1
          [ "$(authority_field run_id)" = "$GITHUB_RUN_ID" ] || exit 1
          [ "$(authority_field run_attempt)" = "$attempt" ] || exit 1
          [ "$(authority_field release_artifact_id)" = "$RELEASE_ARTIFACT_ID" ] || exit 1
          [ "$(authority_field release_artifact_digest)" = "$RELEASE_ARTIFACT_DIGEST" ] || exit 1
          [ "$(authority_field manifest_sha256)" = "$MANIFEST_SHA256" ] || exit 1
          [ "$(authority_field version)" = "$VERSION" ] || exit 1
          [ "$(authority_field replay_commit_sha)" = "$REPLAY_COMMIT_SHA" ] || exit 1
          [ "$(authority_field publication_commit_sha)" = "$PUBLICATION_COMMIT_SHA" ] || exit 1
          [ "$(authority_field version_image_tag)" = "$VERSION_IMAGE_TAG" ] || exit 1
          [ "$(authority_field latest_image_tag)" = "$LATEST_IMAGE_TAG" ] || exit 1
          [ "$(authority_field expected_version_state)" = missing ] || exit 1
          reporter_latest_state="$(authority_field expected_latest_state)"
          case "$reporter_latest_state" in
            missing)
              [ -z "$(authority_field expected_latest_manifest_sha256)" ] || exit 1
              [ -z "$(authority_field expected_latest_version_label)" ] || exit 1
              [ -z "$(authority_field expected_latest_revision_label)" ] || exit 1
              ;;
            present)
              [[ "$(authority_field expected_latest_manifest_sha256)" =~ ^[0-9a-f]{64}$ ]] || exit 1
              [[ "$(authority_field expected_latest_version_label)" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-patch\.[0-9]+$ ]] || exit 1
              [[ "$(authority_field expected_latest_revision_label)" =~ ^[0-9a-f]{40}$ ]] || exit 1
              ;;
            *) exit 1 ;;
          esac
          [ "$(authority_field oci_archive_sha256)" = \
            "$(sha256sum reporter-authority/release-image.oci.tar | awk '{print $1}')" ] || exit 1
          python3 -c "$OCI_CLOSURE_VERIFIER" reporter-authority/release-image.oci.tar \
            reporter-layout reporter-oci-closure.json "$VERSION" "$REPLAY_COMMIT_SHA" \
            "$REPLAY_TREE_SHA" "$PUBLICATION_TREE_SHA" "$PATCHSET_SHA" \
            "$UPSTREAM_SOURCE_SHA" "$MIRROR_CANDIDATE_SHA" "$PUBLICATION_COMMIT_SHA"
          cmp reporter-authority/oci-closure.json reporter-oci-closure.json
          [ "$(authority_field oci_closure_sha256)" = \
            "$(sha256sum reporter-oci-closure.json | awk '{print $1}')" ] || exit 1
          digest="$(jq -er '.root.digest | sub("^sha256:"; "")' reporter-oci-closure.json)"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [ "$digest" = "$(authority_field oci_root_digest)" ] || exit 1
          [ "$(authority_field oci_root_media_type)" = \
            "$(jq -er .root.mediaType reporter-oci-closure.json)" ] || exit 1
          [ "$(authority_field oci_root_size)" = \
            "$(jq -er '.root.size | tostring' reporter-oci-closure.json)" ] || exit 1
          echo "authorized_digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Set up ORAS for outcome classification
        id: reporter_oras
        if: ${{ always() && steps.reporter_authority.outcome == 'success' }}
        continue-on-error: true
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4
        with:
          url: https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_linux_amd64.tar.gz
          checksum: 6cdc692f929100feb08aa8de584d02f7bcc30ec7d88bc2adc2054d782db57c64

      - name: Log in to private GHCR for outcome classification
        id: reporter_login
        if: ${{ always() && steps.reporter_oras.outcome == 'success' }}
        continue-on-error: true
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | oras login --username "$GITHUB_ACTOR" --password-stdin ghcr.io

      - name: Record completed and missing publication outputs
        id: outcome
        env:
          PREPARE_RESULT: ${{ needs.prepare-release.result }}
          AUTHORITY_RESULT: ${{ needs.prepare-image-authority.result }}
          GIT_AUTHORIZATION_RESULT: ${{ needs.authorize-git-mutation.result }}
          MUTATE_RESULT: ${{ needs.mutate-git.result }}
          IMAGE_RESULT: ${{ needs.publish-image.result }}
          RELEASE_RESULT: ${{ needs.create-release.result }}
          MIRROR_CANDIDATE_SHA: ${{ inputs.mirror_candidate_sha }}
          PUBLICATION_COMMIT_SHA: ${{ needs.prepare-release.outputs.publication_commit_sha }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          REPLAY_COMMIT_SHA: ${{ needs.prepare-release.outputs.replay_commit_sha }}
          VERSION_IMAGE_TAG: ${{ needs.prepare-release.outputs.version_image_tag }}
          LATEST_IMAGE_TAG: ${{ needs.prepare-release.outputs.latest_image_tag }}
          PUBLISHED_IMAGE_DIGEST: ${{ steps.reporter_authority.outputs.authorized_digest }}
          JOB_AUTHORIZED_IMAGE_DIGEST: ${{ needs.publish-image.outputs.authorized_image_digest }}
          JOB_OBSERVED_VERSION_DIGEST: ${{ needs.publish-image.outputs.observed_version_digest }}
          JOB_OBSERVED_LATEST_DIGEST: ${{ needs.publish-image.outputs.observed_latest_digest }}
          STAGING_STATE: ${{ needs.publish-image.outputs.staging_state }}
          REPORTER_LOGIN_RESULT: ${{ steps.reporter_login.outcome }}
        run: |
          set -u
          mkdir -p publication-outcome

          report_ref_status() {
            endpoint="$1"
            expected="$2"
            prefix="$3"
            if [ -z "$expected" ]; then
              printf unknown
              return
            fi
            http_status="$(curl -sS -o "${prefix}.json" -w '%{http_code}' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/${endpoint}" || true)"
            if [ "$http_status" = 200 ]; then
              actual="$(jq -er .object.sha "${prefix}.json" 2>/dev/null || true)"
              if [ -z "$actual" ]; then
                printf unknown
              elif [ "$actual" = "$expected" ]; then
                printf completed
              else
                printf mismatch
              fi
            elif [ "$http_status" = 404 ]; then
              printf missing
            else
              printf unknown
            fi
          }

          mirror_status="$(report_ref_status \
            git/ref/heads/mirror/upstream-main "$MIRROR_CANDIDATE_SHA" reporter-mirror)"
          main_status="$(report_ref_status \
            git/ref/heads/main "$MIRROR_CANDIDATE_SHA" reporter-main)"
          patched_status="$(report_ref_status \
            git/ref/heads/patched "$PUBLICATION_COMMIT_SHA" reporter-patched)"
          if [ -n "$VERSION" ]; then
            tag_status="$(report_ref_status \
              "git/ref/tags/${VERSION}" "$PUBLICATION_COMMIT_SHA" reporter-tag)"
          else
            tag_status=unknown
          fi

          version_image_status=unknown
          latest_image_status=unknown
          report_image_status() {
            image="$1"
            prefix="$2"
            if [ -z "$image" ] || [ "$REPORTER_LOGIN_RESULT" != success ]; then
              printf unknown
            elif oras manifest fetch --descriptor "$image" > "${prefix}.descriptor.json" \
              2> "${prefix}.err"; then
              actual_digest="$(jq -er \
                '.digest | select(test("^sha256:[0-9a-f]{64}$")) | sub("^sha256:"; "")' \
                "${prefix}.descriptor.json" 2>> "${prefix}.err" || true)"
              printf '%s\n' "$actual_digest" > "${prefix}.digest"
              repository="${image%:*}"
              if [ -z "$actual_digest" ] || \
                ! oras manifest fetch --output "${prefix}.raw" "$image" \
                  2>> "${prefix}.err" || \
                [ "$(sha256sum "${prefix}.raw" | awk '{print $1}')" != "$actual_digest" ] || \
                ! oras manifest fetch --platform linux/amd64 --output \
                  "${prefix}.platform.raw" "$image" 2>> "${prefix}.err"; then
                printf unknown
              else
                config_digest="$(jq -er \
                  '.config.digest | select(test("^sha256:[0-9a-f]{64}$"))' \
                  "${prefix}.platform.raw" 2>> "${prefix}.err" || true)"
                config_size="$(jq -er \
                  '.config.size | select(type == "number" and . >= 0) | tostring' \
                  "${prefix}.platform.raw" 2>> "${prefix}.err" || true)"
                if [ -z "$config_digest" ] || [ -z "$config_size" ] || \
                  ! oras blob fetch --output "${prefix}.json" \
                    "${repository}@${config_digest}" 2>> "${prefix}.err"; then
                  printf unknown
                elif [ "$(sha256sum "${prefix}.json" | awk '{print "sha256:" $1}')" != \
                  "$config_digest" ] || \
                  [ "$(stat -c %s "${prefix}.json")" != "$config_size" ]; then
                  printf mismatch
                elif jq -e --arg version "$VERSION" --arg revision "$REPLAY_COMMIT_SHA" \
                  '.config.Labels["org.opencontainers.image.version"] == $version and
                   .config.Labels["org.opencontainers.image.revision"] == $revision' \
                  "${prefix}.json" >/dev/null && \
                  [[ "$PUBLISHED_IMAGE_DIGEST" =~ ^[0-9a-f]{64}$ ]] && \
                  [ "$actual_digest" = "$PUBLISHED_IMAGE_DIGEST" ]; then
                  printf completed
                else
                  printf mismatch
                fi
              fi
            elif expected_error="Error response from registry: failed to find \"${image}\": ${image}: not found" && \
              [ "$(wc -l < "${prefix}.err")" -eq 1 ] && \
              grep -Fx "$expected_error" "${prefix}.err" >/dev/null; then
              printf missing
            elif grep -Eiq 'unauthorized|denied|(^|[^0-9])(401|403)([^0-9]|$)' "${prefix}.err"; then
              printf unknown
            else
              printf unknown
            fi
          }
          version_image_status="$(report_image_status "$VERSION_IMAGE_TAG" reporter-version-image)"
          latest_image_status="$(report_image_status "$LATEST_IMAGE_TAG" reporter-latest-image)"
          observed_version_digest="$(cat reporter-version-image.digest 2>/dev/null || true)"
          observed_latest_digest="$(cat reporter-latest-image.digest 2>/dev/null || true)"
          if [ "$version_image_status" = completed ] && \
            [ "$latest_image_status" = completed ] && \
            ! cmp reporter-version-image.raw reporter-latest-image.raw >/dev/null; then
            version_image_status=mismatch
            latest_image_status=mismatch
          fi

          release_status=unknown
          if [ -n "$VERSION" ]; then
            release_lookup_status="$(curl -sS -o reporter-release.json -w '%{http_code}' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}" || true)"
            if [ "$release_lookup_status" = 200 ]; then
              if [ -f reporter-release-state/release-notes.md ] && \
                jq -e --arg version "$VERSION" --arg target "$PUBLICATION_COMMIT_SHA" \
                  --rawfile body reporter-release-state/release-notes.md \
                  '.tag_name == $version and .name == $version and
                   .body == $body and .target_commitish == $target and
                   .draft == false and .prerelease == false' \
                  reporter-release.json >/dev/null; then
                release_status=completed
              else
                release_status=mismatch
              fi
            elif [ "$release_lookup_status" = 404 ]; then
              release_status=missing
            fi
          fi

          overall=incomplete
          if [ "$PREPARE_RESULT" = success ] && [ "$AUTHORITY_RESULT" = success ] && \
            [ "$GIT_AUTHORIZATION_RESULT" = success ] && \
            [ "$MUTATE_RESULT" = success ] && \
            [ "$IMAGE_RESULT" = success ] && [ "$RELEASE_RESULT" = success ] && \
            [ "$JOB_AUTHORIZED_IMAGE_DIGEST" = "$PUBLISHED_IMAGE_DIGEST" ] && \
            [ "$JOB_OBSERVED_VERSION_DIGEST" = "$PUBLISHED_IMAGE_DIGEST" ] && \
            [ "$JOB_OBSERVED_LATEST_DIGEST" = "$PUBLISHED_IMAGE_DIGEST" ] && \
            [ "$STAGING_STATE" = not-used ] && \
            [ "$mirror_status" = completed ] && [ "$main_status" = completed ] && \
            [ "$patched_status" = completed ] && [ "$tag_status" = completed ] && \
            [ "$version_image_status" = completed ] && \
            [ "$latest_image_status" = completed ] && [ "$release_status" = completed ]; then
            overall=complete
          fi
          echo "overall=$overall" >> "$GITHUB_OUTPUT"

          cat > publication-outcome/publication-outcome.md <<EOF
          # Publication outcome

          Overall: ${overall}

          | Output | Status | Expected identity |
          | --- | --- | --- |
          | mirror branch | ${mirror_status} | ${MIRROR_CANDIDATE_SHA:-unavailable} |
          | main branch | ${main_status} | ${MIRROR_CANDIDATE_SHA:-unavailable} |
          | patched branch | ${patched_status} | ${PUBLICATION_COMMIT_SHA:-unavailable} |
          | release tag | ${tag_status} | ${VERSION:-unavailable} at ${PUBLICATION_COMMIT_SHA:-unavailable} |
          | version image | ${version_image_status} | ${VERSION_IMAGE_TAG:-unavailable} at sha256:${PUBLISHED_IMAGE_DIGEST:-unavailable} |
          | latest image | ${latest_image_status} | ${LATEST_IMAGE_TAG:-unavailable} at sha256:${PUBLISHED_IMAGE_DIGEST:-unavailable} |
          | authorized image digest | ${JOB_AUTHORIZED_IMAGE_DIGEST:-unavailable} | ${PUBLISHED_IMAGE_DIGEST:-unavailable} |
          | observed version digest | ${observed_version_digest:-unavailable} | ${JOB_OBSERVED_VERSION_DIGEST:-unavailable} |
          | observed latest digest | ${observed_latest_digest:-unavailable} | ${JOB_OBSERVED_LATEST_DIGEST:-unavailable} |
          | staging tag | ${STAGING_STATE:-unknown} | not-used |
          | GitHub release | ${release_status} | ${VERSION:-unavailable} |

          Job results: prepare=${PREPARE_RESULT}, image-authority=${AUTHORITY_RESULT}, git-authority=${GIT_AUTHORIZATION_RESULT}, mutate=${MUTATE_RESULT}, image=${IMAGE_RESULT}, release=${RELEASE_RESULT}
          EOF
          cat publication-outcome/publication-outcome.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload publication outcome report
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: publication-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-outcome
          if-no-files-found: warn

      - name: Require independently verified publication outcome
        if: ${{ always() }}
        env:
          OVERALL: ${{ steps.outcome.outputs.overall }}
        run: |
          set -euo pipefail
          [ "$OVERALL" = complete ] || {
            echo "independent publication read-back is incomplete" >&2
            exit 1
          }
